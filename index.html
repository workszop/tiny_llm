      ['data-phase', 'data-phase-index', 'data-phases-total', 'data-example', 'data-source', 'data-main-hash', 'data-branch-hash', 'data-values'].forEach((name) => need(el, name));
    });
    need(refs.probe, 'data-probe-status');
    need(refs.probe, 'data-probe-pass');
    need(refs.probe, 'data-probe-fail');
    return { ok: problems.length === 0, value: problems.join('; ') || 'kontrakt zgodny' };
  });
  return checks;
}

function probeRow(name) {
  let row = qs(`[data-check="${name}"]`, refs.probe);
  if (!row) {
    row = document.createElement('tr');
    row.setAttribute('data-check', name);
    row.setAttribute('data-check-status', 'running');
    const nameCell = document.createElement('td'); nameCell.textContent = name;
    const statusCell = document.createElement('td'); statusCell.className = 'probe-status';
    const valueCell = document.createElement('td'); valueCell.className = 'probe-value';
    const actionCell = document.createElement('td');
    if (!name.startsWith('seed')) {
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'btn-ghost btn-small';
      btn.dataset.action = 'probe-rerun'; btn.dataset.name = name;
      btn.textContent = t('probeRerun');
      actionCell.appendChild(btn);
    }
    row.append(nameCell, statusCell, valueCell, actionCell);
    qs('#probe-rows').appendChild(row);
  }
  return row;
}

function setProbeRow(name, status, value) {
  const row = probeRow(name);
  row.setAttribute('data-check-status', status);
  row.setAttribute('data-check-value', value || '');
  row.children[1].textContent = status;
  row.children[2].textContent = value || '';
}

function updateProbeCounts(running) {
  const rows = qsa('[data-check]', refs.probe);
  const pass = rows.filter((r) => r.getAttribute('data-check-status') === 'pass').length;
  const fail = rows.filter((r) => r.getAttribute('data-check-status') === 'fail').length;
  setAttr(refs.probe, 'data-probe-pass', pass);
  setAttr(refs.probe, 'data-probe-fail', fail);
  setAttr(refs.probe, 'data-probe-status', running ? 'running' : (fail > 0 ? 'fail' : 'pass'));
}

async function runProbe(name) {
  refs.probe.hidden = false;
  const all = App.probeChecks;
  const selected = !name ? all : all.filter((c) => c.name === name || (name === 'classifier' && c.name.startsWith('classifier-')));
  if (name && selected.length === 0) throw new Error(`Nieznana kontrola: ${name}`);
  updateProbeCounts(true);
  setAttr(refs.probe, 'data-probe-status', 'running');
  const results = [];
  for (const check of selected) {
    setProbeRow(check.name, 'running', '');
    let result;
    try {
      result = await check.fn();
    } catch (err) {
      result = { ok: false, value: `wyjątek: ${err && err.message}` };
    }
    setProbeRow(check.name, result.ok ? 'pass' : 'fail', result.value);
    results.push({ name: check.name, ok: result.ok, value: result.value });
    await new Promise((r) => setTimeout(r, 0));
  }
  updateProbeCounts(false);
  return name && results.length === 1 ? results[0] : results;
}

async function drainGenerator(gen) {
  // Longer slices than the app: slicing does not change results (see the determinism check).
  let res = { done: false };
  while (!res.done) {
    const started = nowMs();
    while (nowMs() - started < 60) {
      res = gen.next();
      if (res.done) break;
    }
    await new Promise((r) => setTimeout(r, 0));
  }
  return res.value;
}

async function runSeedProbe() {
  refs.probe.hidden = false;
  setAttr(refs.probe, 'data-probe-status', 'running');
  const results = [];
  const check = (seed, name, ok, value) => { setProbeRow(`seed${seed}-${name}`, ok ? 'pass' : 'fail', value); };
  for (const seed of SEEDS_TESTED) {
    const started = nowMs();
    const base = { seed, shape: App.shape, data: App.data };
    const preParams = initParams(App.shape, seed);
    const pre = await drainGenerator(flowPretrain({ ...base, params: preParams, cfg: TRAIN.pretrain }));
    const sftParams = preParams.slice();
    const sft = await drainGenerator(flowSft({ ...base, params: sftParams, cfg: TRAIN.sft }));
    const rlParams = sftParams.slice();
    const rl = await drainGenerator(flowRl({ ...base, params: rlParams, sftParams, cfg: TRAIN.rl, labeller: 'rzeczowy' }));
    const corpus = await drainGenerator(flowPretrain({ ...base, params: initParams(App.shape, seed), cfg: { ...TRAIN.pretrain, steps: TRAIN.corpusExperimentSteps }, corpusIds: shuffledCorpus(App.data, seed), stream: 'batch-shuffled', label: 'exp-corpus' }));
    const demos = await drainGenerator(flowSft({ ...base, params: preParams.slice(), cfg: TRAIN.sft, seqs: shuffledDemoSeqs(App.data, seed), stream: 'sft-shuffled', label: 'exp-demos' }));
    const inv = await drainGenerator(flowRl({ ...base, params: sftParams.slice(), sftParams, cfg: TRAIN.rl, labeller: 'odwrocony', stream: 'rl-inverted', label: 'exp-labeller' }));
    const m = { pre: pre.metrics.trained, sft: sft.metrics.trained, sftHeld: sft.metrics.heldOut, rl: rl.metrics.trained, rlHeld: rl.metrics.heldOut, demos: demos.metrics.trained, inv: inv.metrics.trained };
    const row = {
      seed, seconds: Math.round((nowMs() - started) / 1000),
      preValInitial: pre.valLossInitial, preVal: pre.valLoss, preLossInitial: pre.lossInitial,
      preForm: m.pre.form, preCont: m.pre.continuation,
      sftForm: m.sft.form, sftFormHeld: m.sftHeld.form, sftCorrect: m.sft.correct, sftPref: m.sft.preferred, sftCorrectHeld: m.sftHeld.correct,
      rlPref: m.rl.preferred, rlForm: m.rl.form, rlPrefHeld: m.rlHeld.preferred, rlCorrectHeld: m.rlHeld.correct,
      corpusVal: corpus.valLoss, demosCorrect: m.demos.correct, invZb: m.inv.classes.zbywajaca, rlZb: m.rl.classes.zbywajaca,
    };
    results.push(row);
    const lnV = Math.log(App.shape.vocabSize);
    check(seed, 'pre-val', row.preVal <= 0.6 * row.preValInitial, `${row.preVal.toFixed(2)} <= 0,6 x ${row.preValInitial.toFixed(2)}`);
    check(seed, 'pre-initial', Math.abs(row.preLossInitial - lnV) <= 0.5, `${row.preLossInitial.toFixed(2)} ~ ln(V) ${lnV.toFixed(2)}`);
    check(seed, 'pre-form', row.preForm <= 20, `${row.preForm}% <= 20%`);
    check(seed, 'pre-continuation', row.preCont >= 60, `${row.preCont}% >= 60%`);
    check(seed, 'sft-form', row.sftForm >= 80, `${row.sftForm}% >= 80%`);
    check(seed, 'sft-form-held', row.sftFormHeld >= 60, `${row.sftFormHeld}% >= 60%`);
    check(seed, 'sft-gain', row.sftForm - row.preForm >= 50, `${(row.sftForm - row.preForm).toFixed(1)} >= 50`);
    check(seed, 'sft-correct', row.sftCorrect >= 55, `${row.sftCorrect}% >= 55%`);
    check(seed, 'sft-preferred', row.sftPref >= 20 && row.sftPref <= 60, `20% <= ${row.sftPref}% <= 60%`);
    check(seed, 'rl-preferred', row.rlPref >= 75, `${row.rlPref}% >= 75%`);
    check(seed, 'rl-gain', row.rlPref - row.sftPref >= 25, `${(row.rlPref - row.sftPref).toFixed(1)} >= 25`);
    check(seed, 'rl-form', row.sftForm - row.rlForm <= 10, `${row.rlForm}% vs ${row.sftForm}%`);
    check(seed, 'exp-corpus', row.corpusVal - row.preVal >= 0.5, `${row.corpusVal.toFixed(2)} vs ${row.preVal.toFixed(2)}`);
    check(seed, 'exp-demos', row.sftCorrect - row.demosCorrect >= 30, `${row.demosCorrect}% vs ${row.sftCorrect}%`);
    check(seed, 'exp-labeller', row.invZb >= 50 && row.invZb > row.rlZb, `${row.invZb}% vs ${row.rlZb}%`);
    renderSeedTable(results);
    updateProbeCounts(seed !== SEEDS_TESTED[SEEDS_TESTED.length - 1]);
  }
  setAttr(refs.probe, 'data-seed-results', JSON.stringify(results));
  updateProbeCounts(false);
}

// ─── Helpers: step pages (a branch of the weights, never the main checkpoints) ───
const STEP_PHASES = { pretrain: ['context', 'predict', 'target', 'loss', 'update', 'after'], sft: ['context', 'predict', 'target', 'loss', 'update', 'after'], rl: ['pair', 'score', 'update', 'shift'] };
const STEP_SOURCES = { pretrain: ['random', 'pretrain'], sft: ['pretrain', 'sft'], rl: ['sft', 'rl'] };
const STEP_LR = { pretrain: () => TRAIN.pretrain.lr, sft: () => TRAIN.sft.lr, rl: () => TRAIN.rl.lr };

function newStep(key) {
  return { key, state: 'needs', source: STEP_SOURCES[key][0], sourceParams: null, branch: null, adam: null, rng: null, example: 0, phase: 0, updates: 0, values: null, ex: null, autoplay: false, timer: null, rewardModel: null, rewardFrom: null, rewardKind: '', preparingFor: null };
}

function stepSourceParams(step) { return checkpointParams(step.source); }

function resetStepBranch(step) {
  step.sourceParams = stepSourceParams(step);
  step.branch = step.sourceParams.slice();
  step.adam = makeAdam(App.shape.total);
  step.rng = makeRng(hashSeed(App.seed, 'step-' + step.key + '-' + step.source));
  step.example = 0;
  step.updates = 0;
  newStepExample(step);
}

// Keeps each page honest about its source: called before every render of the page.
function syncStep(step) {
  const first = STEP_SOURCES[step.key].find((src) => checkpointParams(src));
  if (!first) {
    stopAutoplay(step);
    step.state = 'needs'; step.sourceParams = null; step.branch = null; step.values = null; step.ex = null; step.phase = 0; step.rewardModel = null;
    return;
  }
  if (!checkpointParams(step.source)) step.source = first;
  if (step.sourceParams !== checkpointParams(step.source)) {
    stopAutoplay(step);
    step.state = 'ready';
    if (step.key === 'rl') { prepareStepReward(step); if (step.state === 'preparing') return; }
    resetStepBranch(step);
  } else if (step.key === 'rl') {
    const main = App.rl.reward;
    if (main && step.rewardFrom !== main) { step.rewardModel = main; step.rewardFrom = main; step.rewardKind = 'main'; }
  }
}

function prepareStepReward(step) {
  const main = App.rl.reward;
  if (main) { step.rewardModel = main; step.rewardFrom = main; step.rewardKind = 'main'; return; }
  const sft = App.stages.sft.params;
  if (step.preparingFor === sft) { step.state = 'preparing'; return; }
  if (step.rewardFrom === sft && step.rewardModel) return;
  step.state = 'preparing';
  step.preparingFor = sft;
  const ctx = { sftParams: sft, shape: App.shape, data: App.data, rng: makeRng(hashSeed(App.seed, 'step-reward')), cfg: TRAIN.rl, pairsTarget: App.loop.cfgOverride ? 15 : 60 };
  const gen = (function* run() { yield* collectSimulatedPairs(ctx, 'rzeczowy'); yield* fitReward(ctx); })();
  const slice = () => {
    if (step.preparingFor !== sft) return;
    const started = nowMs();
    let res = { done: false };
    while (nowMs() - started < SLICE_MS && !res.done) res = gen.next();
    if (!res.done) { setTimeout(slice, 0); return; }
    step.preparingFor = null;
    if (App.stages.sft.params !== sft) return;
    step.rewardModel = ctx.reward; step.rewardFrom = sft; step.rewardKind = 'standin';
    step.state = 'ready';
    step.sourceParams = null;
    renderStepView('rl');
  };
  setTimeout(slice, 0);
}

function topOf(probs, count, mustInclude) {
  const order = Array.from(probs.keys()).sort((a, b) => probs[b] - probs[a]);
  const top = order.slice(0, count);
  if (mustInclude !== undefined && !top.includes(mustInclude)) top[count - 1] = mustInclude;
  return top.map((id) => ({ token: App.data.vocab.list[id], p: probs[id], isTarget: id === mustInclude }));
}

function predictInto(step, windowIds) {
  const work = App.stepWork;
  work.window.set(windowIds);
  forwardWindow(step.branch, App.shape, work);
  softmaxInto(work.logits, work.probs, 1);
  return work.probs;
}

function newStepExample(step) {
  step.phase = 0;
  step.example += 1;
  if (step.key === 'rl') { newRlStepExample(step); return; }
  const data = App.data; const vocab = data.vocab; const work = App.stepWork;
  let contextIds; let target; let extra = {};
  if (step.key === 'pretrain') {
    const sets = App.stepSets.corpus;
    const at = sets[Math.floor(step.rng() * sets.length)];
    fillWindow(work, data.corpusIds, at, vocab.nl);
    target = data.corpusIds[at];
    contextIds = Array.from(work.window);
  } else {
    // The first example of a branch starts the answer, where the change from pretraining is largest.
    const list = App.stepSets.sft;
    const candidates = step.example === 1 ? list.filter((ex) => ex.t === 0) : list;
    const ex = candidates[Math.floor(step.rng() * candidates.length)];
    const seq = data.demoSeqs[ex.s];
    const buf = seq.context.concat(seq.response.slice(0, ex.t));
    fillWindow(work, buf, buf.length, vocab.nl);
    target = seq.response[ex.t];
    contextIds = Array.from(work.window);
    extra = { prompt: data.demos[ex.s].prompt, response: data.demos[ex.s].response, style: data.demos[ex.s].style, responseIndex: ex.t, demoIndex: ex.s };
  }
  const probs = predictInto(step, contextIds);
  const pBefore = probs[target];
  step.ex = { contextIds, target };
  step.values = {
    context: idsToTokens(contextIds), target: vocab.list[target], pBefore, lossBefore: -Math.log(pBefore),
    topBefore: topOf(probs, 5, target), topAfter: null, pAfter: null, lossAfter: null, gradNorm: null, changed: null, meanChange: null, maxChange: null, lr: STEP_LR[step.key](), ...extra,
  };
}

function applyStepUpdate(step) {
  const vals = step.values;
  const grad = App.stepGrad; grad.fill(0);
  const work = App.stepWork;
  work.window.set(step.ex.contextIds);
  accumulateGrad(step.branch, grad, App.shape, work, step.ex.target, 1);
  const before = step.branch.slice();
  vals.gradNorm = adamStep(step.branch, grad, step.adam, vals.lr, TRAIN[step.key].clip);
  fillChangeStats(vals, before, step.branch);
  const probs = predictInto(step, step.ex.contextIds);
  vals.pAfter = probs[step.ex.target];
  vals.lossAfter = -Math.log(vals.pAfter);
  vals.topAfter = topOf(probs, 5, step.ex.target);
  step.updates += 1;
}

function fillChangeStats(vals, before, after) {
  let changed = 0; let sum = 0; let max = 0;
  for (let i = 0; i < after.length; i++) {
    const delta = Math.abs(after[i] - before[i]);
    if (delta > 0) { changed += 1; sum += delta; if (delta > max) max = delta; }
  }
  vals.changed = changed; vals.meanChange = sum / Math.max(changed, 1); vals.maxChange = max;
}

function logProbOfAnswer(params, contextIds, answerIds) {
  const work = App.stepWork; const vocab = App.data.vocab;
  const seq = contextIds.slice();
  let sum = 0; let first = null;
  answerIds.forEach((id, i) => {
    fillWindow(work, seq, seq.length, vocab.nl);
    forwardWindow(params, App.shape, work);
    softmaxInto(work.logits, work.probs, 1);
    const logP = Math.log(Math.max(work.probs[id], 1e-300));
    if (i === 0) first = work.probs[id];
    sum += logP;
    seq.push(id);
  });
  return { logP: sum, firstP: first };
}

function stepReward(step, contextIds, answerIds) {
  const tokens = idsToTokens(answerIds);
  const model = step.rewardModel;
  const raw = (rewardScore(model, rewardFeatures(tokens)) - model.mean) / model.std;
  const clipped = Math.max(-TRAIN.rl.rewardClip, Math.min(TRAIN.rl.rewardClip, raw));
  const kl = logProbOfAnswer(step.branch, contextIds, answerIds).logP - logProbOfAnswer(App.stages.sft.params, contextIds, answerIds).logP;
  return { score: clipped, kl, reward: clipped - TRAIN.rl.klBeta * kl };
}

function newRlStepExample(step) {
  const data = App.data; const vocab = data.vocab; const work = App.stepWork;
  let best = null;
  for (let tries = 0; tries < 40; tries++) {
    const idx = Math.floor(step.rng() * data.rlPromptIds.length);
    const ctx = data.rlPromptIds[idx];
    const a = sampleTokens(step.branch, App.shape, work, ctx, step.rng, 1, vocab.nl, vocab.end, MAX_GEN_TOKENS);
    const b = sampleTokens(step.branch, App.shape, work, ctx, step.rng, 1, vocab.nl, vocab.end, MAX_GEN_TOKENS);
    if (a.join() === b.join()) continue;
    const ra = stepReward(step, ctx, a); const rb = stepReward(step, ctx, b);
    if (!best || Math.abs(ra.reward - rb.reward) > Math.abs(best.ra.reward - best.rb.reward)) best = { idx, ctx, a, b, ra, rb };
    if (Math.abs(ra.reward - rb.reward) > 0.2) break;
  }
  if (!best) { step.ex = null; step.values = null; return; }
  const baseline = (best.ra.reward + best.rb.reward) / 2;
  const preferred = best.ra.reward >= best.rb.reward ? 'a' : 'b';
  const pa = logProbOfAnswer(step.branch, best.ctx, best.a); const pb = logProbOfAnswer(step.branch, best.ctx, best.b);
  const expect = data.rlPromptExpect[best.idx];
  step.ex = { ctx: best.ctx, a: best.a, b: best.b };
  step.values = {
    prompt: data.rlPrompts[best.idx], baseline, preferred,
    a: { tokens: idsToTokens(best.a), cls: classifyOutput(expect, idsToTokens(best.a), data), score: best.ra.score, kl: best.ra.kl, reward: best.ra.reward, adv: best.ra.reward - baseline, logPBefore: pa.logP, firstBefore: pa.firstP, logPAfter: null, firstAfter: null },
    b: { tokens: idsToTokens(best.b), cls: classifyOutput(expect, idsToTokens(best.b), data), score: best.rb.score, kl: best.rb.kl, reward: best.rb.reward, adv: best.rb.reward - baseline, logPBefore: pb.logP, firstBefore: pb.firstP, logPAfter: null, firstAfter: null },
    gradNorm: null, changed: null, meanChange: null, maxChange: null, lr: STEP_LR.rl(), klBeta: TRAIN.rl.klBeta, rewardKind: step.rewardKind, labeller: step.rewardKind === 'main' ? App.rl.mainLabeller : 'rzeczowy',
  };
}

function applyRlStepUpdate(step) {
  const vals = step.values; const work = App.stepWork; const vocab = App.data.vocab;
  const grad = App.stepGrad; grad.fill(0);
  [['a', step.ex.a], ['b', step.ex.b]].forEach(([key, answer]) => {
    const seq = step.ex.ctx.concat(answer);
    for (let t = step.ex.ctx.length; t < seq.length; t++) {
      fillWindow(work, seq, t, vocab.nl);
      accumulateGrad(step.branch, grad, App.shape, work, seq[t], vals[key].adv / 2);
    }
  });
  const before = step.branch.slice();
  vals.gradNorm = adamStep(step.branch, grad, step.adam, vals.lr, TRAIN.rl.clip);
  fillChangeStats(vals, before, step.branch);
  const pa = logProbOfAnswer(step.branch, step.ex.ctx, step.ex.a); const pb = logProbOfAnswer(step.branch, step.ex.ctx, step.ex.b);
  vals.a.logPAfter = pa.logP; vals.a.firstAfter = pa.firstP;
  vals.b.logPAfter = pb.logP; vals.b.firstAfter = pb.firstP;
  step.updates += 1;
}

function stepForward(key) {
  const step = App.steps[key];
  syncStep(step);
  if (step.state !== 'ready' || !step.values) { renderStepView(key); return false; }
  const phases = STEP_PHASES[key];
  if (step.phase >= phases.length - 1) newStepExample(step);
  else {
    step.phase += 1;
    if (phases[step.phase] === 'update' && step.values.gradNorm === null) {
      if (key === 'rl') applyRlStepUpdate(step); else applyStepUpdate(step);
    }
  }
  renderStepView(key);
  return true;
}

function stepBackward(key) {
  const step = App.steps[key];
  if (step.state === 'ready' && step.phase > 0) step.phase -= 1;
  renderStepView(key);
}

function stepOther(key) {
  const step = App.steps[key];
  syncStep(step);
  if (step.state === 'ready') newStepExample(step);
  renderStepView(key);
}

function stepRestart(key) {
  const step = App.steps[key];
  syncStep(step);
  if (step.state === 'ready') resetStepBranch(step);
  renderStepView(key);
}

function stepSetSource(key, source) {
  const step = App.steps[key];
  if (!checkpointParams(source)) return;
  stopAutoplay(step);
  step.source = source;
  step.sourceParams = null;
  syncStep(step);
  renderStepView(key);
}

function stopAutoplay(step) {
  if (step.timer) clearInterval(step.timer);
  step.timer = null;
  step.autoplay = false;
}

function toggleAutoplay(key) {
  const step = App.steps[key];
  if (step.autoplay) { stopAutoplay(step); renderStepView(key); return; }
  syncStep(step);
  if (step.state !== 'ready') { renderStepView(key); return; }
  step.autoplay = true;
  step.timer = setInterval(() => {
    if (App.view !== STEP_VIEW[key]) { stopAutoplay(step); renderStepView(key); return; }
    stepForward(key);
  }, AUTOPLAY_MS);
  renderStepView(key);
}

// ─── Helpers: data samples ───
function pickSample(list, count) {
  return shuffled(list, App.sampleRng).slice(0, count);
}

function refreshSamples(kinds) {
  const data = App.data;
  const wanted = kinds || ['corpus', 'demos', 'pairs'];
  if (wanted.includes('corpus')) {
    const lines = [];
    data.docs.forEach((doc) => doc.lines.forEach((line) => lines.push({ genre: doc.genre, line })));
    App.samples.corpus = { total: lines.length, items: pickSample(lines, SAMPLE_SIZE) };
  }
  if (wanted.includes('demos')) {
    App.samples.demos = { total: data.demos.length, items: pickSample(data.demos, SAMPLE_SIZE) };
  }
  if (wanted.includes('pairs')) refreshPairSample();
}

function refreshPairSample() {
  const data = App.data; const vocab = data.vocab;
  const out = { source: 'none', total: 0, items: [], promptsTotal: data.rlPrompts.length, prompts: pickSample(data.rlPrompts, 3) };
  if (App.rl.lastPairs && App.rl.lastPairs.length) {
    out.source = 'run';
    out.total = App.rl.lastPairs.length;
    out.items = pickSample(App.rl.lastPairs, 3).map((pair) => ({ prompt: pair.prompt, win: pair.winTokens, lose: pair.loseTokens }));
  } else if (App.stages.sft.status === 'done') {
    out.source = 'live';
    const labeller = App.rl.source === 'wlasne' ? 'rzeczowy' : App.rl.source;
    const rank = LABELLER_RANK[labeller];
    const work = makeWork(App.shape);
    out.labeller = labeller;
    for (let tries = 0; tries < 80 && out.items.length < 3; tries++) {
      const idx = Math.floor(App.sampleRng() * data.rlPromptIds.length);
      const ctx = data.rlPromptIds[idx];
      const a = idsToTokens(sampleTokens(App.stages.sft.params, App.shape, work, ctx, App.sampleRng, 1, vocab.nl, vocab.end, MAX_GEN_TOKENS));
      const b = idsToTokens(sampleTokens(App.stages.sft.params, App.shape, work, ctx, App.sampleRng, 1, vocab.nl, vocab.end, MAX_GEN_TOKENS));
      if (a.join(' ') === b.join(' ')) continue;
      const expect = data.rlPromptExpect[idx];
      const ra = rank[classifyOutput(expect, a, data)]; const rb = rank[classifyOutput(expect, b, data)];
      if (ra === rb) continue;
      out.items.push({ prompt: data.rlPrompts[idx], win: ra > rb ? a : b, lose: ra > rb ? b : a });
    }
    out.total = SIMULATED_PAIRS;
  }
  App.samples.pairs = out;
}

function drawChart(canvas, series, yLabelDigits) {
  if (!canvas || canvas.offsetParent === null) return;
  const dpr = window.devicePixelRatio || 1;
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  if (!width || !height) return;
  if (canvas.width !== Math.round(width * dpr) || canvas.height !== Math.round(height * dpr)) {
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, width, height);
  const pad = { l: 44, r: 12, t: 10, b: 22 };
  const all = series.flatMap((s) => s.points);
  ctx.font = CHART_FONT;
  ctx.strokeStyle = CHART_COLORS.grid;
  ctx.fillStyle = CHART_COLORS.axis;
  ctx.lineWidth = 1;
  let minY = 0; let maxY = 1; let maxX = 1;
  if (all.length) {
    minY = Math.min(...all.map((p) => p.y));
    maxY = Math.max(...all.map((p) => p.y));
    maxX = Math.max(...all.map((p) => p.x), 1);
    if (series[0] && series[0].floorZero) minY = Math.min(0, minY);
    if (maxY - minY < 1e-6) maxY = minY + 1;
  }
  const plotW = width - pad.l - pad.r;
  const plotH = height - pad.t - pad.b;
  const px = (x) => pad.l + (x / maxX) * plotW;
  const py = (y) => pad.t + (1 - (y - minY) / (maxY - minY)) * plotH;
  for (let i = 0; i <= 3; i++) {
    const y = minY + (maxY - minY) * (i / 3);
    ctx.beginPath(); ctx.moveTo(pad.l, py(y)); ctx.lineTo(width - pad.r, py(y)); ctx.stroke();
    ctx.fillText(y.toFixed(yLabelDigits === undefined ? 1 : yLabelDigits), 4, py(y) + 4);
  }
  ctx.fillText('0', pad.l, height - 6);
  ctx.fillText(String(maxX), width - pad.r - ctx.measureText(String(maxX)).width, height - 6);
  series.forEach((s) => {
    if (!s.points.length) return;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 2;
    ctx.setLineDash(s.dash || []);
    ctx.beginPath();
    s.points.forEach((p, i) => { if (i === 0) ctx.moveTo(px(p.x), py(p.y)); else ctx.lineTo(px(p.x), py(p.y)); });
    ctx.stroke();
    ctx.setLineDash([]);
  });
}

function drawStageCharts(key) {
  const stage = App.stages[key];
  if (App.view !== STAGE_VIEW[key]) return;
  if (key === 'rl') {
    const hist = stage.history.filter((h) => Number.isFinite(h.reward));
    drawChart(qs('#chart-rl-reward'), [{ points: hist.map((h) => ({ x: h.step, y: h.reward })), color: CHART_COLORS.ink }]);
    drawChart(qs('#chart-rl-pref'), [{ points: smoothHistory(hist).map((h) => ({ x: h.x, y: h.y })), color: CHART_COLORS.blue, floorZero: true }], 0);
    return;
  }
  const hist = stage.history.filter((h) => Number.isFinite(h.loss));
  drawChart(qs(`#chart-${key}`), [
    { points: hist.map((h) => ({ x: h.step, y: h.loss })), color: CHART_COLORS.ink, floorZero: true },
    { points: hist.filter((h) => Number.isFinite(h.val)).map((h) => ({ x: h.step, y: h.val })), color: CHART_COLORS.blue, dash: [6, 4] },
  ]);
}

function smoothHistory(hist) {
  const out = [];
  let avg = null;
  hist.forEach((h) => {
    const value = (h.preferred || 0) * 100;
    avg = avg === null ? value : 0.9 * avg + 0.1 * value;
    out.push({ x: h.step, y: avg });
  });
  return out;
}

function trainingFraction() {
  const loop = App.loop;
  if (!loop.gen) return 0;
  const ctx = loop.ctx;
  if (loop.kind === 'stage') {
    const stage = App.stages[loop.key];
    return stage.stepsTotal ? Math.min(1, stage.step / stage.stepsTotal) : 0;

function renderTokenChips(box, rawTokens, ids, windowLimit, appendedFrom) {

  const firstVisible = Math.max(0, total - 40);
  if (firstVisible > 0) {
    const more = document.createElement('span'); more.className = 'token-chip unseen'; more.textContent = `+${firstVisible}`;
    box.appendChild(more);
  }
  for (let i = firstVisible; i < total; i++) {
    const id = ids[i];
    let cls = '';
    if (id === vocab.unk) cls += ' unknown';
    if (i >= appendedFrom) cls += ' appended';
    if (windowLimit !== null && i < total - windowLimit) cls += ' unseen';
    const label = id === vocab.unk ? `${rawTokens[i] || ''} → ${TOKEN_UNK}` : vocab.list[id];
    box.appendChild(makeTokenChip(label, id, cls));
  }
}

function renderNext() {
  const nextEl = qs('[data-next-token]');
  if (!nextEl) return;
  ensureCheckpoint();
  const { parsed, ids, probs } = computeNext();
  const vocab = App.data.vocab;
  setAttr(nextEl, 'data-context', JSON.stringify(idsToTokens(ids)));
  setAttr(nextEl, 'data-temperature', App.next.temperature);
  setAttr(nextEl, 'data-checkpoint', App.next.checkpoint);
  setAttr(nextEl, 'data-empty', parsed.empty);

  const input = qs('#next-prompt');
  if (input.value !== App.next.text && document.activeElement !== input) input.value = App.next.text;
  const messages = [];
  if (parsed.empty) messages.push(t('promptEmpty'));
  if (parsed.trimmed) messages.push(t('promptTrimmed', { max: MAX_PROMPT_CHARS }));
  if (parsed.allUnknown) messages.push(t('allUnknown'));
  else if (parsed.unknown) messages.push(t('unknownNote'));
  if (ids.length > CONTEXT_LEN) messages.push(t('unseenNote', { n: CONTEXT_LEN }));
  setText(qs('#next-messages'), messages.join(' '));
  qs('#next-messages').classList.toggle('is-error', parsed.empty);
  setAttr(input, 'aria-invalid', parsed.empty);

  renderTokenChips(qs('#next-tokens'), parsed.raw, ids, CONTEXT_LEN, parsed.ids.length);

  const barsBox = qs('#next-bars');
  barsBox.textContent = '';
  let top = [];
  if (probs) {
    const order = Array.from(probs.keys()).sort((a, b) => probs[b] - probs[a]).slice(0, 8);
    top = order.map((id) => ({ token: vocab.list[id], p: probs[id] }));
    order.forEach((id) => {
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'bar';
      btn.dataset.action = 'force-token'; btn.dataset.id = id;
      const name = document.createElement('span'); name.className = 'bar-name'; name.textContent = vocab.list[id];
      const track = document.createElement('span'); track.className = 'bar-track';
      const fill = document.createElement('span'); fill.className = 'bar-fill'; fill.style.width = `${Math.max(probs[id] * 100, 1)}%`;
      track.appendChild(fill);
      const val = document.createElement('span'); val.className = 'bar-val'; val.textContent = `${(probs[id] * 100).toFixed(1).replace('.', ',')}%`;
      btn.append(name, track, val);
      btn.setAttribute('aria-label', `${vocab.list[id]}: ${(probs[id] * 100).toFixed(1)}%`);
      barsBox.appendChild(btn);
    });
    let entropy = 0;
    probs.forEach((v) => { if (v > 0) entropy -= v * Math.log(v); });
    setText(qs('#next-entropy'), `${Math.round(100 * entropy / Math.log(vocab.list.length))}%`);
  } else {
    setText(qs('#next-entropy'), '-');
  }
  setAttr(nextEl, 'data-top', JSON.stringify(top.map((item) => ({ token: item.token, p: Number(item.p.toFixed(6)) }))));
  setText(qs('#next-sampled'), App.next.sampled || t('labSampledNone'));
  setText(qs('#next-output'), App.next.appended.length ? prettyTokens(idsToTokens(App.next.appended)) : t('labOutputNone'));
  qs('#next-btn').disabled = parsed.empty;
  qs('#next-nl').disabled = parsed.empty;

  qsa('[data-action="checkpoint"]').forEach((btn) => {
    const key = btn.dataset.ck;
    const available = key === 'random' || !!checkpointParams(key);
    btn.disabled = !available;
    btn.classList.toggle('active', key === App.next.checkpoint);
    btn.setAttribute('aria-pressed', key === App.next.checkpoint);
  });
  const allAvailable = STAGE_ORDER.every((key) => checkpointParams(key));
  setText(qs('#ck-reason'), App.next.movedNote || (allAvailable ? '' : t('ckReasonPretrain')));
  const temp = qs('#next-temp');
  temp.value = App.next.temperature;
  setText(qs('#next-temp-value'), App.next.temperature === 0 ? t('labTemperatureGreedy') : fmt(App.next.temperature, 1));
  setAttr(temp, 'aria-valuetext', App.next.temperature === 0 ? t('labTemperatureGreedy') : fmt(App.next.temperature, 1));
}

    box.appendChild(len);
  }
  renderStage('rl');
}

function renderQuiz() {
  const quiz = App.quiz;
  const body = qs('#quiz-body');
  body.textContent = '';
  const total = QUIZ.length;
  setText(qs('#quiz-progress-text'), quiz.finished ? t('quizScore', { score: quiz.score, total }) : t('quizProgress', { n: quiz.index + 1, total }));
  qs('#quiz-progress-fill').style.width = `${Math.round(100 * (quiz.finished ? total : quiz.index) / total)}%`;
  setAttr(qs('#quiz-root'), 'data-quiz-index', quiz.index);
  setAttr(qs('#quiz-root'), 'data-quiz-score', quiz.score);
  setAttr(qs('#quiz-root'), 'data-quiz-finished', quiz.finished);
  if (quiz.finished) {
    const score = document.createElement('p'); score.className = 'quiz-score'; score.id = 'quiz-score'; score.textContent = t('quizScore', { score: quiz.score, total });
    const again = document.createElement('button'); again.type = 'button'; again.className = 'edu-btn'; again.dataset.action = 'quiz-retake'; again.textContent = t('quizRetake');
    body.append(score, again);
    return;
  }
  const item = QUIZ[quiz.index];
  const form = document.createElement('fieldset'); form.className = 'quiz-q';
  const legend = document.createElement('legend'); legend.textContent = t(item.q);
  form.appendChild(legend);
  item.options.forEach((key, i) => {
    const label = document.createElement('label'); label.className = 'opt';
    if (quiz.checked && i === item.correct) label.classList.add('correct');
    if (quiz.checked && i === quiz.selected && i !== item.correct) label.classList.add('wrong');
    if (!quiz.checked && i === quiz.selected) label.classList.add('selected');
    const input = document.createElement('input'); input.type = 'radio'; input.name = 'quiz-answer'; input.value = i;
    input.checked = quiz.selected === i; input.disabled = quiz.checked;
    const text = document.createElement('span'); text.textContent = t(key);
    label.append(input, text);
    form.appendChild(label);
  });
  body.appendChild(form);
  if (quiz.checked) {
    const good = quiz.selected === item.correct;
    const note = document.createElement('p'); note.className = `quiz-why ${good ? 'good' : 'bad'}`; note.id = 'quiz-why';
    note.textContent = `${t(good ? 'quizCorrect' : 'quizWrong')} ${t(item.why)}`;
    body.appendChild(note);
  }
  const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'edu-btn'; btn.id = 'quiz-action';
  if (quiz.checked) {
    btn.dataset.action = 'quiz-next';
    btn.textContent = t(quiz.index === total - 1 ? 'quizFinish' : 'quizNext');
  } else {
    btn.dataset.action = 'quiz-check';
    btn.textContent = t('quizCheck');
    btn.disabled = quiz.selected === null;
  }
  body.appendChild(btn);
}

    const view = el.dataset.noticeView;

    const state = !target ? 'done' : (App.stages[target].status === 'training' || App.stages[target].status === 'paused' ? 'running' : 'needed');
    const signature = `${target}|${state}|${target ? App.stages[target].status : ''}|${isBusy()}`;
    if (el.dataset.signature === signature) return;
    el.dataset.signature = signature;
    setAttr(el, 'data-needs', target);
    setAttr(el, 'data-state', state);
    el.hidden = state === 'done';
    if (state === 'done') return;
    const name = stageName(target);
    let text = t('noticeNeed', { name });
    if (state === 'running') text = t(App.stages[target].status === 'paused' ? 'noticePaused' : 'noticeRunning', { name });
    else if (view === 'krok-pretraining') text = t('noticeStepRandom');
    setText(qs('.notice-text', el), text);
    const action = qs('.notice-action', el);
    action.textContent = '';
    if (state === 'needed' && STAGE_VIEW[target] === view) {
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'btn-ink';
      btn.dataset.action = 'notice-train'; btn.dataset.key = target;
      btn.textContent = t('noticeTrain');
      btn.disabled = isBusy() || App.stages[target].status !== 'ready';
      action.appendChild(btn);
    } else if (STAGE_VIEW[target] !== view) {
      const link = document.createElement('a');
      link.className = 'btn-ink'; link.href = `#${STAGE_VIEW[target]}`;
      link.textContent = t('noticeGo', { name });
      action.appendChild(link);
    }
  });
}

function renderSamples() {

  const fillList = (el, kind, sample, whatKey, draw) => {
    setAttr(el, 'data-total', sample.total);
    setAttr(el, 'data-shown', sample.items.length);
    setAttr(el, 'data-items', JSON.stringify(sample.items));
    setText(qs('.sample-count', el), t('sampleCount', { shown: sample.items.length, total: sample.total, what: t(whatKey) }));
    const list = qs('.sample-list', el);
    list.textContent = '';
    sample.items.forEach((item) => list.appendChild(draw(item)));
  };
  const chip = (text, tone) => { const c = document.createElement('span'); c.className = `edu-chip ${tone}`; c.textContent = text; return c; };
  const line = (text, cls) => { const d = document.createElement('div'); d.className = cls || 'sample-text'; d.textContent = text; return d; };
  fillList(corpusEl, 'corpus', App.samples.corpus, 'sampleWhatCorpus', (item) => {

  fillList(qs('[data-data-sample="demos"]'), 'demos', App.samples.demos, 'sampleWhatDemos', (item) => {
    const li = document.createElement('li');

  });
  const pairs = App.samples.pairs;

  setText(qs('.sample-prompts-count', pairsEl), t('samplePrompts', { shown: pairs.prompts.length, total: pairs.promptsTotal }));
  const promptList = qs('.sample-prompts', pairsEl);

  let countText = t('samplePairsNone');
  if (pairs.source === 'run') countText = t('sampleCount', { shown: pairs.items.length, total: pairs.total, what: t('sampleWhatPairsRun') });
  if (pairs.source === 'live') countText = `${t('sampleCount', { shown: pairs.items.length, total: pairs.total, what: t('sampleWhatPairsLive', { total: pairs.total }) })} ${t('sampleLabeller', { name: t(LABELLER_NAME_KEYS[pairs.labeller]) })}`;

    const li = document.createElement('li');

    const lose = document.createElement('div'); lose.className = 'pair-line'; lose.append(chip(t('sampleLose'), 'tone-red'), line(prettyTokens(item.lose)));
    li.append(line(prettyTokens(splitTokens(item.prompt)), 'prompt-line'), win, lose);

function pct(value) {
  if (value === null || value === undefined) return '-';
  if (value < 0.00001) return `${(value * 100).toExponential(1).replace('.', ',')}%`;
  return `${(value * 100).toFixed(value < 0.001 ? 4 : (value < 0.1 ? 2 : 1)).replace('.', ',')}%`;
}

function drawStepBars(box, top) {
  box.textContent = '';
  if (!top) { const p = document.createElement('p'); p.className = 'edu-small'; p.textContent = t('stepNotYet'); box.appendChild(p); return; }
  top.forEach((item) => {
    const row = document.createElement('div'); row.className = `bar bar-static ${item.isTarget ? 'is-target' : ''}`;
    const name = document.createElement('span'); name.className = 'bar-name'; name.textContent = item.token;
    const track = document.createElement('span'); track.className = 'bar-track';
    const fill = document.createElement('span'); fill.className = 'bar-fill'; fill.style.width = `${Math.max(item.p * 100, 1)}%`;
    track.appendChild(fill);
    const val = document.createElement('span'); val.className = 'bar-val'; val.textContent = pct(item.p);
    row.append(name, track, val);
    box.appendChild(row);
  });
}

function renderStepView(key) {
  const el = qs(`[data-step-view="${key}"]`);
  if (!el) return;
  const step = App.steps[key];
  syncStep(step);
  const phases = STEP_PHASES[key];
  const phaseName = phases[step.phase];
  const reached = (name) => step.state === 'ready' && step.values && step.phase >= phases.indexOf(name);
  setAttr(el, 'data-state', step.state);
  setAttr(el, 'data-phase', step.state === 'ready' ? phaseName : '');
  setAttr(el, 'data-phase-index', step.phase);
  setAttr(el, 'data-phases-total', phases.length);
  setAttr(el, 'data-example', step.example);
  setAttr(el, 'data-source', step.source);
  setAttr(el, 'data-updates', step.updates);
  setAttr(el, 'data-autoplay', step.autoplay);
  const main = step.sourceParams ? weightsHash(step.sourceParams) : '';
  const branch = step.branch ? weightsHash(step.branch) : '';
  setAttr(el, 'data-main-hash', main);
  setAttr(el, 'data-branch-hash', branch);
  setAttr(el, 'data-values', JSON.stringify(step.state === 'ready' ? step.values : null));
  qsa(`#view-${STEP_VIEW[key]} .chain .link`).forEach((link, i) => link.classList.toggle('on', step.state === 'ready' && i === step.phase));
  const ready = step.state === 'ready' && !!step.values;
  qs(`#step-next-${key}`).disabled = !ready;
  setText(qs(`#step-next-${key}`), ready && step.phase === phases.length - 1 ? t('stepNextExample') : t('stepNext'));
  qs(`#step-back-${key}`).disabled = !ready || step.phase === 0;
  qs(`#step-other-${key}`).disabled = !ready;
  qs(`#step-restart-${key}`).disabled = !ready;
  const play = qs(`#step-play-${key}`);
  play.disabled = !ready;
  setText(play, step.autoplay ? t('stepStop') : t('stepPlay'));
  qsa(`[data-action="step-source"][data-key="${key}"]`).forEach((btn) => {
    btn.disabled = !checkpointParams(btn.dataset.src);
    btn.classList.toggle('active', btn.dataset.src === step.source && step.state !== 'needs');
    btn.setAttribute('aria-pressed', btn.dataset.src === step.source);
  });
  const message = step.state === 'preparing' ? t('stepPreparing') : (step.state === 'needs' ? t(key === 'sft' ? 'stepNeedsSft' : 'stepNeedsRl') : '');
  setText(qs(`#step-message-${key}`), message);
  setText(qs(`#step-progress-${key}`), ready ? `${t('stepPhaseOf', { n: step.phase + 1, total: phases.length })}. ${t('stepExampleOf', { n: step.example, updates: step.updates })}` : '');
  setText(qs(`#step-hashes-${key}`), ready ? t('stepHashes', { branch, main }) : '');
  const vals = ready ? step.values : null;
  const caption = qs(`#step-caption-${key}`);
  if (key === 'rl') { renderRlStep(step, vals, reached); setText(caption, ready ? rlCaption(vals, phaseName) : ''); return; }
  const contextBox = qs(`#step-context-${key}`);
  contextBox.textContent = '';
  if (vals) vals.context.forEach((tok) => contextBox.appendChild(makeTokenChip(tok, null, '')));
  if (key === 'sft') {
    setText(qs('#step-demo-prompt'), vals ? prettyTokens(splitTokens(vals.prompt)) : '');
    setText(qs('#step-demo-response'), vals ? prettyTokens(splitTokens(vals.response)) : '');
    const chipEl = qs('#step-demo-style');
    chipEl.className = `edu-chip ${vals ? CLASS_TONES[vals.style] : 'tone-stone'}`;
    setText(chipEl, vals ? t(CLASS_KEYS[vals.style]) : '-');
  }
  drawStepBars(qs(`#step-before-${key}`), reached('predict') ? vals.topBefore.map((item) => ({ ...item, isTarget: reached('target') && item.isTarget })) : null);
  drawStepBars(qs(`#step-after-${key}`), reached('after') ? vals.topAfter : null);
  setText(qs(`#step-target-${key}`), reached('target') ? vals.target : '-');
  setText(qs(`#step-p-${key}`), reached('target') ? (reached('after') ? `${pct(vals.pBefore)} → ${pct(vals.pAfter)}` : pct(vals.pBefore)) : '-');
  setText(qs(`#step-loss-${key}`), reached('loss') ? (reached('after') ? `${fmt(vals.lossBefore)} → ${fmt(vals.lossAfter)}` : fmt(vals.lossBefore)) : '-');
  setText(qs(`#step-grad-${key}`), reached('update') ? fmt(vals.gradNorm) : '-');
  setText(qs(`#step-changed-${key}`), reached('update') ? vals.changed.toLocaleString('pl-PL') : '-');
  setText(qs(`#step-move-${key}`), reached('update') ? vals.meanChange.toFixed(5).replace('.', ',') : '-');
  if (!ready) { setText(caption, ''); return; }
  const top = vals.topBefore.slice().sort((a, b) => b.p - a.p)[0];
  const captions = {
    context: t('capContext', { n: CONTEXT_LEN }),
    predict: t('capPredict', { tok: top.token, p: pct(top.p) }),
    target: t('capTarget', { tok: vals.target, p: pct(vals.pBefore) }),
    loss: t('capLoss', { p: (vals.pBefore < 0.0001 ? vals.pBefore.toExponential(2) : vals.pBefore.toFixed(4)).replace('.', ','), loss: fmt(vals.lossBefore) }),
    update: reached('update') ? t('capUpdate', { changed: (vals.changed || 0).toLocaleString('pl-PL'), lr: String(vals.lr).replace('.', ',') }) : '',
    after: reached('after') ? t('capAfter', { before: pct(vals.pBefore), after: pct(vals.pAfter), lossBefore: fmt(vals.lossBefore), lossAfter: fmt(vals.lossAfter) }) : '',
  };
  setText(caption, captions[phaseName]);
}

function answerProb(logP) {
  if (logP === null || logP === undefined) return '-';
  const value = Math.exp(logP);
  return value < 0.0001 ? value.toExponential(1).replace('.', ',') : `${(value * 100).toFixed(2).replace('.', ',')}%`;
}

function rlCaption(vals, phaseName) {
  const name = vals.preferred === 'a' ? 'A' : 'B';
  const pref = vals[vals.preferred];
  if (phaseName === 'pair') return t('capPair');
  if (phaseName === 'score') return t('capScore', { name, base: fmt(vals.baseline) });
  if (phaseName === 'update') return t('capRlUpdate', { changed: (vals.changed || 0).toLocaleString('pl-PL') });
  return t('capShift', { name, before: answerProb(pref.logPBefore), after: answerProb(pref.logPAfter) });
}

function renderRlStep(step, vals, reached) {
  setText(qs('#step-rl-prompt'), vals ? prettyTokens(splitTokens(vals.prompt)) : '');
  setText(qs('#step-rl-kind'), vals ? (vals.rewardKind === 'main' ? t('rlKindMain', { name: t(LABELLER_NAME_KEYS[vals.labeller] || 'srcRzeczowy') }) : t('rlKindStandin')) : '');
  ['a', 'b'].forEach((side) => {
    const item = vals ? vals[side] : null;
    setText(qs(`#rl-text-${side}`), item ? prettyTokens(item.tokens) : '-');
    const chipEl = qs(`#rl-class-${side}`);
    chipEl.hidden = !item;
    if (item) { chipEl.className = `edu-chip ${CLASS_TONES[item.cls]}`; setText(chipEl, t(CLASS_KEYS[item.cls])); }
    const scored = reached('score');
    qs(`#rl-better-${side}`).hidden = !(scored && vals.preferred === side);
    setText(qs(`#rl-score-${side}`), scored ? fmt(item.score) : '-');
    setText(qs(`#rl-kl-${side}`), scored ? fmt(TRAIN.rl.klBeta * item.kl) : '-');
    setText(qs(`#rl-reward-${side}`), scored ? fmt(item.reward) : '-');
    setText(qs(`#rl-adv-${side}`), scored ? fmt(item.adv) : '-');
    setText(qs(`#rl-before-${side}`), item ? answerProb(item.logPBefore) : '-');
    setText(qs(`#rl-after-${side}`), reached('shift') ? answerProb(item.logPAfter) : '-');
    setText(qs(`#rl-first-before-${side}`), item ? pct(item.firstBefore) : '-');
    setText(qs(`#rl-first-after-${side}`), reached('shift') ? pct(item.firstAfter) : '-');
  });
  setText(qs('#step-grad-rl'), reached('update') ? fmt(vals.gradNorm) : '-');
  setText(qs('#step-changed-rl'), reached('update') ? vals.changed.toLocaleString('pl-PL') : '-');
  setText(qs('#step-move-rl'), reached('update') ? vals.meanChange.toFixed(5).replace('.', ',') : '-');
}

  return viewStepTokenHtml('sft', 'tone-yellow', 'graduation-cap', 'krokSftHead', 'krokSftOver', 'krokSftLead', 'krokFoldSftText', { batch: TRAIN.sft.batch }, demoBox, bottom);
}

      <p class="sample-text" id="rl-text-${s}">-</p><span class="edu-chip tone-stone" id="rl-class-${s}" hidden></span>
      <dl class="rl-values">
        <dt>${t('rlScoreLabel')}</dt><dd id="rl-score-${s}">-</dd>
        <dt>${t('rlKlLabel')}</dt><dd id="rl-kl-${s}">-</dd>
        <dt>${t('rlRewardLabel')}</dt><dd id="rl-reward-${s}">-</dd>
        <dt>${t('rlAdvLabel')}</dt><dd id="rl-adv-${s}">-</dd>
        <dt>${t('rlProbBefore')}</dt><dd id="rl-before-${s}">-</dd>
        <dt>${t('rlProbAfter')}</dt><dd id="rl-after-${s}">-</dd>
        <dt>${t('rlFirstBefore')}</dt><dd id="rl-first-before-${s}">-</dd>
        <dt>${t('rlFirstAfter')}</dt><dd id="rl-first-after-${s}">-</dd>

  return `<section class="sec"><div class="wrap">
    ${secHead('thumbs-up', 'tone-green', 'krokRlHead')}
    ${heroHtml('tone-green', 'krokRlOver', 'krokRlLead')}
    ${noticeHtml('krok-rl')}
    <div class="split">
      <div class="concept">
        <div class="row-head"><span class="badge tone-green">${ic('list-ordered')}</span><h3>${t('krokRow')}</h3></div>
        ${chainHtml(['phasePair', 'phaseScore', 'phaseRlUpdate', 'phaseShift'])}
        <div class="tile"><span class="badge tone-green">${ic('git-compare')}</span><h4>${t('rlDiffTitle')}</h4><p>${t('rlDiffText')}</p></div>
        <details class="more"><summary>${t('krokFoldPre')}</summary><p>${t('krokFoldRlText', { batch: TRAIN.rl.batch, kl: String(TRAIN.rl.klBeta).replace('.', ',') })}</p></details>
      </div>
      <div class="card lab" data-step-view="rl" data-nobudget><div class="card-body">
        ${stepControls('rl')}
        <p class="edu-small" id="step-rl-kind"></p>

        <div class="pair">${side('a', 'rlAnswerA')}${side('b', 'rlAnswerB')}</div>
        ${stepStats('rl', false)}
        <p class="edu-small hash-line" id="step-hashes-rl"></p>

}

function buildViews() {
  const builders = { 'krok-pretraining': viewKrokPretrainingHtml, 'krok-sft': viewKrokSftHtml, 'krok-rl': viewKrokRlHtml, model: viewModelHtml, pretraining: viewPretrainingHtml, sft: viewSftHtml, rl: viewRlHtml, porownanie: viewPorownanieHtml, dane: viewDaneHtml, prawda: viewPrawdaHtml, quiz: viewQuizHtml };
  refs.views.innerHTML = VIEW_ORDER.map((view) => `<div data-view-panel="${view}" data-words="0" id="view-${view}" hidden>${builders[view]()}</div>`).join('');
  refs.nav.innerHTML = VIEW_ORDER.map((view, i) => `<a class="nav-pill" data-view="${view}" href="#${view}" title="${Object.keys(VIEW_KEYS).find((key) => VIEW_KEYS[key] === view)}" data-index="${i + 1}">${t(VIEW_NAV_KEYS[view])}</a>`).join('');
  refs.nav.setAttribute('aria-label', t('navLabel'));
}

// ─── Listeners ───
function setView(view) {
  const target = VIEW_ORDER.includes(view) ? view : 'model';
  const changed = target !== App.view;
  Object.keys(App.steps).forEach((key) => {
    if (STEP_VIEW[key] !== target && App.steps[key].autoplay) { stopAutoplay(App.steps[key]); renderStepView(key); }
  });
  App.view = target;
  App.visited.add(target);
  saveVisited();
  renderView();
  if (changed) {
    window.scrollTo(0, 0);
    announceView(target);
  }
}

function announceView(view) { setText(refs.liveView, t('liveView', { name: t(VIEW_NAV_KEYS[view]) })); }

function saveVisited() { safeStorageSet('tinyllm-visited', JSON.stringify(Array.from(App.visited))); }
function loadVisited() {
  const raw = safeStorageGet('tinyllm-visited');
  if (!raw) return;
  try { JSON.parse(raw).forEach((view) => { if (VIEW_ORDER.includes(view)) App.visited.add(view); }); } catch (err) { /* A broken value only loses a convenience. */ }
}

const ACTIONS = {
  train: (el) => trainToggle(el.dataset.key),
  reset: (el) => resetStage(el.dataset.key),
  'bar-pause': () => { if (App.loop.kind === 'stage') togglePause(); },
  'next-token': () => sampleNextToken(),
  'force-token': (el) => sampleNextToken(Number(el.dataset.id)),
  'add-nl': () => sampleNextToken(App.data.vocab.nl),
  restart: () => { App.next.appended = []; App.next.sampled = ''; renderNext(); },
  checkpoint: (el) => { App.next.checkpoint = el.dataset.ck; App.next.movedNote = ''; renderNext(); },
  reroll: () => { refreshBench(); renderBench(); },
  'cmp-run': () => applyComparePrompt(),
  pipeline: () => startPipeline(),
  experiment: (el) => startExperiment(el.dataset.exp),
  source: (el) => setSource(el.dataset.src),
  own: (el) => labelOwn(el.dataset.choice),
  'mini-next': () => { App.miniAt += 7; renderMini(); },
  'neigh-checkpoint': (el) => { App.neighbours.checkpoint = el.dataset.ck; renderNeighbours(); },
  'corpus-genre': (el) => { App.corpusGenre = el.dataset.genre; renderCorpus(); },
  'quiz-check': () => {
    if (App.quiz.selected === null) return;
    App.quiz.checked = true;
    if (App.quiz.selected === QUIZ[App.quiz.index].correct) App.quiz.score += 1;
    renderQuiz();
    const action = qs('#quiz-action');
    if (action) action.focus();
  },
  'quiz-next': () => {
    if (App.quiz.index === QUIZ.length - 1) { App.quiz.finished = true; announce(t('quizScoreLive', { score: App.quiz.score, total: QUIZ.length })); }
    else { App.quiz.index += 1; App.quiz.selected = null; App.quiz.checked = false; }
    renderQuiz();
    const first = qs('#quiz-body input, #quiz-body button');
    if (first) first.focus();
  },
  'quiz-retake': () => {
    App.quiz = { index: 0, selected: null, checked: false, score: 0, finished: false };
    renderQuiz();
    const first = qs('#quiz-body input');
    if (first) first.focus();
  },
  'step-next': (el) => stepForward(el.dataset.key),
  'step-back': (el) => stepBackward(el.dataset.key),
  'step-other': (el) => stepOther(el.dataset.key),
  'step-restart': (el) => stepRestart(el.dataset.key),
  'step-play': (el) => toggleAutoplay(el.dataset.key),
  'step-source': (el) => stepSetSource(el.dataset.key, el.dataset.src),
  'sample-reroll': (el) => { refreshSamples([el.dataset.kind]); renderSamples(); },
  'notice-train': (el) => { if (App.stages[el.dataset.key].status === 'ready') startStage(el.dataset.key); },
  'help-open': () => openHelp(),
  'help-close': () => closeHelp(),
  'probe-rerun': (el) => App.probe.run(el.dataset.name),
};

function applyComparePrompt() {
  const select = qs('#cmp-select');
  if (select.value === 'free') App.bench.text = qs('#cmp-free').value;
  else App.bench.text = EVAL_PROMPTS.find((p) => p.id === select.value).text;
  refreshBench();
  renderBench();
}

function openHelp() {
  if (refs.help.open) return;
  App.helpReturn = document.activeElement;
  refs.help.showModal();
}
function closeHelp() {
  if (refs.help.open) refs.help.close();
}

function isTypingTarget(target) {
  if (!target || !target.tagName) return false;
  return /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName) && !(target.type === 'radio' || target.type === 'range') || target.isContentEditable;
}

function bindListeners() {
  document.addEventListener('click', (event) => {
    const el = event.target.closest('[data-action]');
    if (!el || el.disabled) return;
    const action = ACTIONS[el.dataset.action];
    if (action) action(el);
  });
  document.addEventListener('input', (event) => {
    const id = event.target.id;
    if (id === 'next-prompt') {
      App.next.text = event.target.value;
      App.next.appended = []; App.next.sampled = '';
      const parsed = parsePrompt(event.target.value);
      if (parsed.trimmed) event.target.value = parsed.value;
      renderNext();
    } else if (id === 'next-temp') {
      App.next.temperature = Number(event.target.value);
      renderNext();
    }
  });
  document.addEventListener('change', (event) => {
    const id = event.target.id;
    if (id === 'cmp-select') {
      App.bench.freeMode = event.target.value === 'free';
      qs('#cmp-free-wrap').hidden = !App.bench.freeMode;
      if (!App.bench.freeMode) applyComparePrompt();
    } else if (id === 'cmp-free') {
      const parsed = parsePrompt(event.target.value);
      if (parsed.trimmed) event.target.value = parsed.value;
      applyComparePrompt();
    } else if (id === 'neigh-token') {
      renderNeighbours();
    } else if (id === 'seed-input') {
      changeSeed(event.target.value);
    } else if (event.target.name === 'quiz-answer') {
      App.quiz.selected = Number(event.target.value);
      const value = App.quiz.selected;
      renderQuiz();
      const input = qs(`input[name="quiz-answer"][value="${value}"]`);
      if (input) input.focus();
    }
  });
  document.addEventListener('keydown', (event) => {
    if (event.target && event.target.id === 'cmp-free' && event.key === 'Enter') { applyComparePrompt(); return; }
    if (event.ctrlKey || event.metaKey || event.altKey) return;
    if (refs.help.open) return;
    if (isTypingTarget(event.target)) return;
    const key = event.key;
    const stepKey = STAGE_ORDER.find((k) => STEP_VIEW[k] === App.view);
    if (Object.prototype.hasOwnProperty.call(VIEW_KEYS, key)) {
      window.location.hash = VIEW_KEYS[key];
      event.preventDefault();
    } else if (stepKey && (key === 'n' || key === 'N')) {
      stepForward(stepKey);
    } else if (stepKey && (key === 'b' || key === 'B')) {
      stepBackward(stepKey);
    } else if (stepKey && (key === 'a' || key === 'A')) {
      toggleAutoplay(stepKey);
    } else if (key === 't' || key === 'T') {
      const stageKey = STAGE_ORDER.find((k) => STAGE_VIEW[k] === App.view);
      if (stageKey) {
        const stage = App.stages[stageKey];
        const button = qs(`#train-${stageKey}`);
        if (button && !button.disabled && stage.status !== 'done' && stage.status !== 'error') trainToggle(stageKey);
      }
    } else if ((key === 'n' || key === 'N') && App.view === 'model') {
      sampleNextToken();
    } else if (key === '?') {
      openHelp();
      event.preventDefault();
    }
  });
  refs.help.addEventListener('close', () => {
    if (App.helpReturn && App.helpReturn.focus) App.helpReturn.focus();
  });
  window.addEventListener('hashchange', () => setView(window.location.hash.slice(1)));
  window.addEventListener('resize', () => { STAGE_ORDER.forEach(drawStageCharts); updateHeaderHeight(); });
  App.loop.channel = new MessageChannel();
  App.loop.channel.port1.onmessage = pump;
  if ('PerformanceObserver' in window) {
    try {
      new PerformanceObserver((list) => {
        if (App.loop.kind !== 'stage' || !App.stages[App.loop.key]) return;
        list.getEntries().forEach((entry) => {
          const stage = App.stages[App.loop.key];
          if (entry.duration > stage.longest) stage.longest = entry.duration;
        });
      }).observe({ entryTypes: ['longtask'] });
    } catch (err) { /* Long-task timing is optional: slice timing still fills data-longest-task-ms. */ }
  }
}

// ─── Init ───
function init() {
  document.title = t('docTitle');
  App.data = buildData();
  App.shape = makeShape(App.data.vocab.list.length);
  App.next.work = makeWork(App.shape);
  App.stepWork = makeWork(App.shape);
  App.stepGrad = new Float64Array(App.shape.total);
  App.stepSets = { corpus: exampleSets(App.data).corpusTrain, sft: makeSftExamples(App.data.demoSeqs).train };
  STAGE_ORDER.forEach((key) => { App.steps[key] = newStep(key); });
  const params = new URLSearchParams(window.location.search);
  const seedParam = Number(params.get('seed'));
  const seed = Number.isInteger(seedParam) && seedParam >= 1 && seedParam <= 9999 ? seedParam : DEFAULT_SEED;
  initEngine(seed);
  loadVisited();
  buildViews();
  qs('#tab-note').textContent = t('tabNote');
  qs('#seed-label').textContent = t('seedLabel');
  qs('#seed-hint').textContent = t('seedHint');
  qs('#visited-label').textContent = t('visited');
  qs('#help-open').textContent = t('helpOpen');
  qs('#help-title').textContent = t('helpTitle');
  qs('#help-close').textContent = t('helpClose');
  qs('#help-list').innerHTML = ['helpViews', 'helpTrain', 'helpNext', 'helpSteps', 'helpHelp'].map((key) => `<li>${t(key)}</li>`).join('');
  qs('#footer-text').textContent = t('footer');
  qs('#skip-link').textContent = t('skipLink');
  qs('#train-bar-pause').textContent = t('btnPause');
  qs('#probe-title').textContent = t('probeTitle');
  qs('#probe-note').textContent = t('probeNote');
  qs('#probe-seed-title').textContent = t('probeSeedTitle');
  qsa('[data-probe-head]').forEach((el) => { el.textContent = t(el.dataset.probeHead); });
  App.next.text = App.next.defaultText;
  App.bench.text = App.bench.defaultText;
  App.probeChecks = probeChecks();
  App.probe = { run: runProbe, seeds: runSeedProbe, checks: () => App.probeChecks.map((c) => c.name) };
  bindListeners();
  qs('#next-prompt').value = App.next.text;
  refreshBench();
  refreshSamples();
  renderScale();
  renderMini();
  renderCorpus();
  renderQuiz();
  setView(window.location.hash.slice(1) || 'model');
  renderAll();
  renderBudgets();

  // ─── Reveal ───
  const FONT_WAIT_MS = 1500;
  const BRAND_FONTS = ['400 1em Outfit', '700 1em Outfit', '400 1em "IBM Plex Sans"', '600 1em "IBM Plex Sans"', '400 1em "Roboto Mono"'];
  Promise.race([
    Promise.all(BRAND_FONTS.map((f) => document.fonts.load(f).catch(() => null))),
    new Promise((r) => setTimeout(r, FONT_WAIT_MS)),
  ]).then(() => { document.documentElement.classList.add('app-ready'); renderBudgets(); STAGE_ORDER.forEach(drawStageCharts); });

  const probeMode = params.get('probe');
  if (probeMode === '1') App.probe.run();
  else if (probeMode === 'seeds') App.probe.seeds();
  else if (params.get('autorun') === '1') startPipeline();
}

init();

</script>
