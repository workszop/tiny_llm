<style>
/* ============================================================
   edulab - Colors & Type foundation
   Fonts (Outfit, IBM Plex Sans, Roboto Mono) load from Google Fonts
   via the <link> tags in tokens/head.html - paste that into <head>.
   No @import here: it chains requests and blocks rendering.
   ============================================================ */

:root {
  /* ---- Brand fonts ---- */
  --font-display: 'Outfit', 'IBM Plex Sans', system-ui, sans-serif;
  --font-sans:    'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --font-mono:    'Roboto Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* ============================================================
     RAW COLOR TOKENS
     ============================================================ */

  /* Paper - page background is white; the stone steps are bands / wells.
     Warm neutral grey (no yellow cast) so yellow and the colour blocks stay the
     loudest thing on the page. Stone v2 (2026-10-10) replaced the cream sand
     (#FBF7E6 / #F5EDCB), which at 1.07:1 on white did not read as a surface. */
  --paper:    #FFFFFF;   /* page background (white)                       */
  --paper-2:  #F5F3F0;   /* stone band: alternating sections, card heads   */
  --paper-3:  #EAE6E0;   /* deepest stone: wells, table heads, bar tracks  */
  --surface:  #FFFFFF;   /* cards & sheets                                */

  /* Ink - warm near-black text & lines */
  --ink:      #1C1917;   /* primary text                                    */
  --ink-2:    #44403C;   /* secondary text, 10.3:1 on white                 */
  --ink-3:    #625B53;   /* muted / placeholder: >= 4.5:1 on every paper step */
  --line:     #E0DBD3;   /* hairline: dividers, table rows, card heads      */
  --line-2:   #C9C2B7;   /* stronger: card contours, section rules          */
  --line-strong: #857C69;/* control boundaries (inputs, ghost buttons,
                            answer options): >= 3:1 on paper steps (WCAG 1.4.11) */

  /* ---- Brand: Yellow main · Blue + Green secondary · Red danger ----
     Plain saturated colours. The base colour (--blue) is for large fills,
     illustrations and large text (>= 24px, or 19px bold). "-soft" is the
     solid fill for chips and panels that carry small text: it is the
     AA shade (= "-600"), so its "-ink" (white; dark ink on yellow) reaches
     4.5:1. A colour used AS text goes only on white and uses "-600".
     Never colour-on-colour (no green text on green).
     Gate: python3 scripts/check-contrast.py */

  /* Yellow - primary (buttons, progress, values on dark panels) */
  --yellow:      #FFD500;
  --yellow-600:  #F0C800;  /* hover / press          */
  --yellow-soft: #FFD500;  /* chip / panel fill      */
  --yellow-ink:  #1C1917;  /* text on yellow         */

  /* Blue - secondary (panels, chips, correct / selected state) */
  --blue:      #1E8FC2;
  --blue-600:  #177AA8;
  --blue-soft: #177AA8;   /* = blue-600, white text 4.8:1 */
  --blue-ink:  #FFFFFF;

  /* Green - secondary support (chips, success) */
  --green:      #00A651;
  --green-600:  #078342;  /* hover / press, AA text shade */
  --green-soft: #078342;  /* = green-600, white text 4.9:1 */
  --green-ink:  #FFFFFF;

  /* Red - danger / important / wrong (use sparingly) */
  --red:      #E5322D;
  --red-600:  #C92823;
  --red-soft: #C92823;   /* = red-600, white text 5.5:1 */
  --red-ink:  #FFFFFF;

  /* Grape - 5th category tone (colour-coded groups), from the play palette */
  --grape:      #7A5AC2;
  --grape-soft: #7A5AC2;  /* white text 5.2:1 */
  --grape-ink:  #FFFFFF;

  /* Legacy role aliases - older edulab apps use these names */
  --marigold: var(--yellow); --marigold-600: var(--yellow-600); --marigold-soft: var(--yellow-soft); --marigold-ink: var(--yellow-ink);
  --teal:     var(--blue);   --teal-600:     var(--blue-600);   --teal-soft:     var(--blue-soft);   --teal-ink:     var(--blue-ink);
  --sky:      var(--green);                                     --sky-soft:      var(--green-soft);  --sky-ink:      var(--green-ink);
  --coral:    var(--red);    --coral-600:    var(--red-600);    --coral-soft:    var(--red-soft);    --coral-ink:    var(--red-ink);

  /* Play palette - subject/category colours in the kids app */
  --play-sun:    #FFD500;
  --play-grass:  #00A651;
  --play-berry:  #C6478B;
  --play-grape:  #7A5AC2;
  --play-sky:    #1E8FC2;
  --play-coral:  #E5322D;

  /* ---- Semantic ---- */
  --success:      #00A651;  --success-soft: #078342;  --success-ink: #FFFFFF;
  --warning:      #FFD500;  --warning-soft: #FFD500;  --warning-ink: #1C1917;
  --danger:       #E5322D;  --danger-soft:  #C92823;  --danger-ink:  #FFFFFF;
  --info:         #1E8FC2;  --info-soft:    #177AA8;  --info-ink:    #FFFFFF;

  /* ---- Functional aliases ---- */
  --bg:        var(--paper);
  --fg:        var(--ink);
  --fg-muted:  var(--ink-2);
  --primary:   var(--yellow);
  --on-primary:#1C1917;      /* dark text on yellow */
  /* White gap + ink band: >= 3:1 on paper, sand, yellow and every chip fill.
     Pair with `outline: 3px solid transparent` so forced-colours mode still shows focus. */
  --focus-ring: 0 0 0 2px var(--paper), 0 0 0 5px var(--ink);
  /* Range-slider track */
  --track: color-mix(in srgb, var(--ink) 24%, transparent);

  /* ============================================================
     SPACING  (4pt base)
     ============================================================ */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
  --sp-12: 48px; --sp-16: 64px; --sp-20: 80px; --sp-24: 96px;

  /* ---- Radii (friendly, generous) ---- */
  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-pill: 999px;

  /* ---- Elevation - warm, low, soft ---- */
  --shadow-sm: 0 1px 2px rgba(33,30,26,.10), 0 2px 6px rgba(33,30,26,.06);
  --shadow-md: 0 6px 18px rgba(33,30,26,.12), 0 1px 3px rgba(33,30,26,.08);
  --shadow-lg: 0 16px 40px rgba(33,30,26,.12), 0 3px 8px rgba(33,30,26,.06);
  --shadow-primary:  0 8px 22px color-mix(in srgb, var(--yellow) 30%, transparent);
  --shadow-marigold: var(--shadow-primary);   /* legacy alias */

  /* ============================================================
     TYPE SCALE (semantic sizes)
     ============================================================ */
  --display-font:  clamp(48px, 6vw, 72px);
  --h1: 44px; --h2: 33px; --h3: 25px; --h4: 19px;
  --body-lg: 18px; --body: 16px; --body-sm: 14px;
  --caption: 13px; --overline: 12px;
}

/* ============================================================
   SEMANTIC ELEMENT STYLES
   Apply via element selectors or .edu-prose wrapper.
   Element defaults are wrapped in :where(.edu) (zero specificity) so any
   single class wins: <p class="edu-overline">, <p class="edu-small">,
   <h1 class="app-title"> keep their own font/size instead of the element default.
   ============================================================ */

.edu-display, :where(.edu) h1.display {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--display-font);
  line-height: 1.02;
  letter-spacing: -0.025em;
  color: var(--ink);
}
:where(.edu) h1, .edu-h1 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h1);
  line-height: 1.06; letter-spacing: -0.02em; color: var(--ink);
}
:where(.edu) h2, .edu-h2 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h2);
  line-height: 1.12; letter-spacing: -0.015em; color: var(--ink);
}
:where(.edu) h3, .edu-h3 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h3);
  line-height: 1.2; letter-spacing: -0.01em; color: var(--ink);
}
:where(.edu) h4, .edu-h4 {
  font-family: var(--font-sans);
  font-weight: 700; font-size: var(--h4);
  line-height: 1.3; color: var(--ink);
}
:where(.edu) p, .edu-p, .edu-body {
  font-family: var(--font-sans);
  font-weight: 400; font-size: var(--body);
  line-height: 1.6; color: var(--ink-2);
}
.edu-body-lg { font-family: var(--font-sans); font-size: var(--body-lg); line-height: 1.6; color: var(--ink-2); }
.edu-small  { font-family: var(--font-sans); font-size: var(--body-sm); line-height: 1.5; color: var(--ink-2); }
.edu-caption{ font-family: var(--font-sans); font-size: var(--caption); line-height: 1.45; color: var(--ink-3); }

/* Overline - mono, tracked; functional labels only (never above page/section titles) */
.edu-overline {
  font-family: var(--font-mono);
  font-weight: 500; font-size: var(--overline);
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink);
}
:where(.edu) code, .edu-mono {
  font-family: var(--font-mono);
  font-size: 0.92em; color: var(--ink);
  background: var(--paper-3); padding: 0.12em 0.4em; border-radius: var(--r-xs);
}

/* Solid colour blocks (callouts, stat cards, chips): set background: var(--X-soft) and
   color: var(--X-ink) on the block, add .edu-block, and every heading/paragraph inside
   inherits that text colour instead of the default ink. */
.edu-block, .edu-block h1, .edu-block h2, .edu-block h3, .edu-block h4, .edu-block p,
.edu-block li, .edu-block small { color: inherit; }

body.edu { background: var(--paper); color: var(--ink); font-family: var(--font-sans); }

/* ─── App: tokens that are not in the edustyl set ─── */
:root { --gutter: clamp(16px, 4vw, 72px); --header-h: 73px; }

/* ─── Base ─── */
html, body { margin: 0; padding: 0; }
body.edu { font-size: var(--body); overflow-x: hidden; }
*, *::before, *::after { box-sizing: border-box; }
a { color: var(--blue-600); }
:focus-visible { outline: 3px solid transparent; outline-offset: 2px; box-shadow: var(--focus-ring); }
[hidden] { display: none !important; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.skip-link { position: absolute; left: 12px; top: -60px; background: var(--yellow); color: var(--yellow-ink); padding: 10px 14px; border-radius: var(--r-sm); z-index: 60; }
.skip-link:focus { top: 8px; }
button, select, input { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .55; }

/* ─── Chrome ─── */
.edu-header { position: sticky; top: 0; z-index: 50; width: 100%; background: var(--paper); border-bottom: 1px solid var(--line-2); }
.edu-header-inner { padding: 4px var(--gutter); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.edu-logo { width: 64px; height: 64px; display: block; margin-right: -6px; }
.edu-wordmark { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -.02em; color: var(--ink); }
.nav-shell { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; }
.nav { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; justify-content: flex-end; min-width: 0; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav-scroll { flex: none; width: 40px; height: 40px; border-radius: var(--r-pill); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); display: inline-grid; place-items: center; padding: 0; transition: background-color .12s; }
.nav-scroll:hover { background: var(--paper-2); }
.nav-pill { border-radius: var(--r-pill); padding: 8px 9px; color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: var(--body-sm); transition: background-color .15s; white-space: nowrap; }
.nav-pill:hover { background: var(--paper-2); }
.nav-pill.active { background: var(--yellow); color: var(--yellow-ink); font-weight: 600; }

.stepper { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px var(--gutter); background: var(--paper-2); border-bottom: 1px solid var(--line); }
.stepper-group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.edu-chip { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 4px 10px; border-radius: var(--r-pill); white-space: nowrap; }
.stepper-progress { display: flex; align-items: center; gap: 8px; min-width: 160px; flex: 1; }
.progress-track { flex: 1; height: 8px; border-radius: var(--r-pill); background: var(--paper-3); overflow: hidden; min-width: 60px; }
.progress-track > span { display: block; height: 100%; background: var(--ink); border-radius: var(--r-pill); }
.seed-control { display: flex; align-items: center; gap: 8px; }
.seed-control input { width: 84px; padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); }
.seed-error { flex: 1 1 100%; min-width: 0; overflow-wrap: anywhere; margin: 0; }
.small-label { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink); }

.train-bar { position: sticky; top: var(--header-h); z-index: 40; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 8px var(--gutter); background: var(--ink); color: var(--paper); }
.train-bar .train-label { font-family: var(--font-display); font-weight: 600; }
.train-bar .train-eta { color: var(--yellow); font-family: var(--font-mono); font-size: 12px; }
.train-track { flex: 1; min-width: 100px; height: 8px; background: var(--ink-2); border-radius: var(--r-pill); overflow: hidden; }
.train-track span { display: block; height: 100%; width: 0; background: var(--yellow); }
.train-bar button { background: var(--yellow); color: var(--yellow-ink); border: none; border-radius: var(--r-pill); padding: 6px 14px; font-family: var(--font-display); font-weight: 600; min-height: 40px; }

/* ─── Page structure ─── */
.page-head { padding: 34px var(--gutter) 28px; text-align: left; }
.app-title { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.3rem, 5vw, 3.3rem); letter-spacing: -.025em; line-height: 1.05; color: var(--ink); margin: 0 0 14px; }
.edu-lead { font-size: 1.15rem; line-height: 1.6; color: var(--ink-2); margin: 0; }
.sec { margin: 0; padding: 36px 0 44px; border-top: 1px solid var(--line); }
[data-view-panel] > .sec:nth-of-type(even) { background: var(--paper-2); }
.sec > .wrap { padding: 0 var(--gutter); display: grid; gap: 22px; }
.sec-head { display: flex; align-items: center; gap: 14px; }
.sec-head h2, .sec-head h1.sec-h1 { margin: 0; font-size: var(--h2); line-height: 1.12; letter-spacing: -0.015em; }
.sec-head::after { content: ""; flex: 1; height: 1px; background: var(--line-2); }
.view-in { animation: view-fade .2s ease-out; }
@keyframes view-fade { from { opacity: 0; } to { opacity: 1; } }

.tone-grape { background: var(--grape-soft); color: var(--grape-ink); }
.tone-blue { background: var(--blue-soft); color: var(--blue-ink); }
.tone-yellow { background: var(--yellow-soft); color: var(--yellow-ink); }
.tone-green { background: var(--green-soft); color: var(--green-ink); }
.tone-red { background: var(--red-soft); color: var(--red-ink); }
.tone-ink { background: var(--ink); color: var(--paper); }
.tone-stone { background: var(--paper-3); color: var(--ink); }
.ic { width: 18px; height: 18px; flex: none; }
.badge { flex: none; width: 34px; height: 34px; border-radius: var(--r-sm); display: inline-grid; place-items: center; }
.badge-lg { width: 46px; height: 46px; border-radius: var(--r-md); }
.badge-lg .ic { width: 24px; height: 24px; }
.badge.tone-ink { color: var(--yellow); }
.tile-h { display: flex; align-items: center; gap: 12px; min-width: 0; }
.tile-h h3 { margin: 0; font-size: 18px; line-height: 1.3; }

.group-hero { border-radius: var(--r-xl); padding: 22px 28px; display: grid; grid-template-columns: 1fr minmax(180px, 230px); gap: 28px; align-items: center; }
.group-hero > :only-child { grid-column: 1 / -1; }
.group-hero .edu-overline { color: inherit; margin: 0 0 6px; }
.group-hero .lead { margin: 0; font-size: var(--body-lg); line-height: 1.5; }
.group-hero .hero-steps { margin: 12px 0 0; padding-left: 1.4em; display: grid; gap: 6px; font-size: var(--body); line-height: 1.5; }
.group-hero .hero-tail { margin: 12px 0 0; font-size: var(--body); line-height: 1.5; }
.gh-num { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1; }
.gh-bar { height: 10px; border-radius: var(--r-pill); background: color-mix(in srgb, currentColor 24%, transparent); overflow: hidden; margin-top: 6px; }
.gh-bar span { display: block; height: 100%; width: 0; background: currentColor; border-radius: var(--r-pill); }
.group-hero.tone-ink .edu-overline { color: var(--yellow); }

.card { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.card-head { padding: 12px 18px; background: var(--paper-2); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card-head h3 { margin: 0; }
.card-head .edu-overline { margin: 0; }
.card-body { padding: 16px 18px; flex: 1; display: grid; gap: 12px; align-content: start; min-width: 0; }
.card-body > * { margin: 0; min-width: 0; }
.card-foot { padding: 12px 18px; border-top: 1px dashed var(--line-2); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

.split { display: grid; grid-template-columns: minmax(22rem, 30rem) minmax(0, 1fr); gap: clamp(24px, 3vw, 44px); align-items: start; }
.concept { display: grid; gap: 14px; min-width: 0; }
.row-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row-head h3 { margin: 0; font-size: 20px; }
.wide-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.tile { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 8px 10px; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 12px 14px; }
.tile h4 { font-family: var(--font-display); font-size: var(--body); line-height: 1.25; margin: 0; }
.tile p { grid-column: 1 / -1; margin: 0; font-size: var(--body-sm); line-height: 1.45; }
.chain { list-style: none; margin: 0; padding: 0; display: grid; gap: 24px; }
.link { position: relative; background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 10px 14px; font-size: var(--body-sm); line-height: 1.45; }
.link:not(:last-child)::after { content: "↓"; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); line-height: 24px; font-family: var(--font-mono); font-weight: 500; color: var(--ink-2); }
.mini { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 0 14px 14px; display: grid; gap: 10px; overflow: hidden; min-width: 0; }
.mini::before { content: attr(data-label); display: block; margin: 0 -14px; padding: 6px 14px; background: var(--paper-3); color: var(--ink); font-family: var(--font-mono); font-weight: 500; font-size: var(--overline); letter-spacing: .1em; text-transform: uppercase; }
details.more { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-md); min-width: 0; }
details.more > summary { display: flex; justify-content: space-between; gap: 10px; cursor: pointer; list-style: none; padding: 8px 14px; font-family: var(--font-display); font-weight: 600; min-height: 40px; align-items: center; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: "+"; font-family: var(--font-mono); }
details.more[open] > summary { border-bottom: 1px dashed var(--line-2); }
details.more[open] > summary::after { content: "−"; }
details.more > :not(summary) { margin: 10px 14px; font-size: var(--body-sm); }

/* ─── Controls ─── */
.field { margin: 0; }
.field > label, .field > .label { display: block; margin-bottom: 8px; font-family: var(--font-mono); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .1em; color: var(--ink); }
.input { width: 100%; padding: 11px 14px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); font: inherit; background: var(--surface); color: var(--ink); min-height: 44px; }
.input[aria-invalid="true"] { border-color: var(--red-600); }
.range { width: 100%; accent-color: var(--ink); min-height: 40px; }
.edu-btn { font-family: var(--font-display); font-weight: 600; background: var(--yellow); color: var(--on-primary); border: none; border-radius: var(--r-pill); padding: 10px 22px; min-height: 44px; transition: background-color .12s; }
.edu-btn:hover:not(:disabled) { background: var(--yellow-600); }
.btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--r-pill); padding: 8px 18px; font-family: var(--font-display); font-weight: 600; min-height: 44px; transition: background-color .12s; }
.btn-ghost:hover:not(:disabled) { background: var(--paper-2); }
.btn-small { min-height: 40px; padding: 4px 12px; font-size: var(--body-sm); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.edu-seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--paper-2); border-radius: var(--r-pill); max-width: 100%; flex-wrap: wrap; }
.edu-seg button { border: none; background: transparent; padding: 7px 14px; border-radius: var(--r-pill); font-family: var(--font-sans); font-weight: 600; color: var(--ink-2); min-height: 40px; }
.edu-seg button.active { background: var(--yellow); color: var(--yellow-ink); }
.wrap-seg { border-radius: var(--r-lg); }
.reason { font-size: var(--body-sm); color: var(--ink-2); margin: 6px 0 0; }
.reason:empty, .err:empty { display: none; }
.reason.is-error, .err { color: var(--red-600); font-weight: 600; font-size: var(--body-sm); margin: 6px 0 0; }

/* ─── Tokens and bars ─── */
.tokens { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; min-width: 0; }
.token-chip { display: inline-flex; align-items: baseline; gap: 6px; padding: 4px 9px; border-radius: var(--r-xs); background: var(--paper-3); color: var(--ink); font-family: var(--font-mono); font-size: 13px; max-width: 100%; overflow-wrap: anywhere; }
.token-chip small { color: var(--ink-3); font-size: 10px; }
.token-chip.appended { background: var(--blue-soft); color: var(--blue-ink); }
.token-chip.appended small { color: inherit; }
.token-chip.unknown { background: var(--red-soft); color: var(--red-ink); }
.token-chip.unknown small { color: inherit; }
.token-chip.unseen { background: var(--surface); color: var(--ink-3); text-decoration: line-through; border: 1px dashed var(--line-strong); }
.token-chip.target { background: var(--yellow); color: var(--yellow-ink); font-weight: 600; }
.token-chip.chip-plus { background: var(--green-soft); color: var(--green-ink); }
.token-chip.chip-minus { background: var(--red-soft); color: var(--red-ink); }
.bars { display: grid; gap: 4px; min-width: 0; }
.bars-head { margin: 0; }
.bar { display: grid; grid-template-columns: minmax(70px, 130px) minmax(0, 1fr) 56px; gap: 8px; align-items: center; width: 100%; background: transparent; border: 1px solid transparent; border-radius: var(--r-xs); padding: 4px 6px; text-align: left; min-height: 30px; transition: background-color .12s; color: var(--ink); }
.bar:hover { background: var(--paper-2); }
.bar-name { font-family: var(--font-mono); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 12px; background: var(--paper-3); border-radius: var(--r-pill); overflow: hidden; display: block; }
.bar-fill { display: block; height: 100%; background: var(--ink); border-radius: var(--r-pill); }
.bar-val { font-family: var(--font-mono); font-size: 12px; text-align: right; }
.readout { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; font-size: var(--body-sm); }
.readout > span { display: grid; align-content: start; gap: 2px; background: var(--paper-2); border-radius: var(--r-sm); padding: 8px 12px; min-width: 0; overflow-wrap: anywhere; }
.readout b { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; line-height: 1.15; color: var(--ink); }

/* ─── Stats, charts, logs ─── */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; font-size: var(--body-sm); }
.stats > span { display: grid; gap: 2px; background: var(--paper-2); border-radius: var(--r-sm); padding: 8px 12px; min-width: 0; }
.stats b { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; line-height: 1.15; color: var(--ink); overflow-wrap: anywhere; }
.chart { display: block; width: 100%; height: 190px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.chart-small { height: 110px; }
.chart-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.chart-pair p { margin: 0 0 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: var(--body-sm); color: var(--ink-2); }
.key { display: inline-block; width: 22px; height: 2px; }
.key-ink { background: var(--ink); }
.key-blue { background: repeating-linear-gradient(90deg, var(--blue-600) 0 6px, transparent 6px 10px); }
.log-head { margin: 6px 0 0; }
.card-part { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.card-part > .reason { margin: 0; }
.log { max-height: 150px; overflow-y: auto; display: grid; gap: 4px; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px; background: var(--paper-2); }
.log-short { max-height: 130px; }
.log-row { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px; font-size: var(--body-sm); }
.log-step { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }
.log-text { overflow-wrap: anywhere; color: var(--ink); }
.corpus { max-height: 340px; overflow-y: auto; font-family: var(--font-mono); font-size: 13px; display: grid; gap: 10px; padding: 8px 10px; background: var(--paper-2); border-radius: var(--r-sm); }
.doc { display: grid; gap: 4px; color: var(--ink); }
.doc-title { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: var(--body); }
.doc-par { line-height: 1.5; }
.scroll-box { max-height: 420px; overflow: auto; display: block; padding: 0; }

/* ─── Bench ─── */
.bench-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: stretch; }
.samples { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.samples li { display: grid; gap: 6px; padding: 8px 10px; background: var(--paper-2); border-radius: var(--r-sm); justify-items: start; min-width: 0; }
.sample-text { overflow-wrap: anywhere; color: var(--ink); min-width: 0; }
.prompt-line { font-weight: 600; color: var(--ink); overflow-wrap: anywhere; margin: 0; }
.same-col { display: grid; gap: 8px; min-width: 0; }
.same-col .edu-overline { margin: 0; }
.cmp-form { max-width: none; }
.pair-opt { display: grid; gap: 8px; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--r-md); min-width: 0; }
.pair-opt p { margin: 0; }
.reward-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
.link-more { font-weight: 600; }
.plain { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.exp-result { display: grid; gap: 4px; font-size: var(--body-sm); margin-top: 8px; }
.exp-result p { margin: 0; }
.exp-result:empty { display: none; }
.scale-extra { margin: 0; padding: 12px 14px; }
.table-wrap { padding: 0; }
.dane-foot { margin-top: 0; }

/* ─── Tables ─── */
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; padding: 10px 14px; background: var(--paper-3); border-bottom: 1px solid var(--line-2); font-family: var(--font-mono); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--ink); }
td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--ink-2); vertical-align: top; }
tbody tr:nth-child(even) td { background: var(--paper-2); }
tbody tr:last-child td { border-bottom: none; }
td:first-child { color: var(--ink); font-weight: 600; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.table-card { overflow-x: auto; }

/* ─── Quiz ─── */
.quiz-track { height: 8px; background: var(--paper-3); }
.quiz-track span { display: block; height: 100%; width: 0; background: var(--ink); }
.quiz-q { border: none; padding: 0; margin: 0; display: grid; gap: 8px; min-width: 0; }
.opt input { flex: none; }
.quiz-q legend { font-family: var(--font-display); font-weight: 700; font-size: var(--h4); padding: 0; margin-bottom: 8px; color: var(--ink); }
.opt { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: var(--r-md); cursor: pointer; min-height: 44px; color: var(--ink); }
.opt.selected { background: var(--blue-soft); color: var(--blue-ink); border-color: var(--blue-soft); }
.opt.correct { background: var(--green-soft); color: var(--green-ink); border-color: var(--green-soft); }
.opt.wrong { background: var(--red-soft); color: var(--red-ink); border-color: var(--red-soft); }
.quiz-why { margin: 0; font-weight: 600; }
.quiz-why.good { color: var(--green-600); }
.quiz-why.bad { color: var(--red-600); }
.quiz-score { font-family: var(--font-display); font-weight: 700; font-size: var(--h2); color: var(--ink); margin: 0; }
#quiz-body .edu-btn { justify-self: start; }

/* ─── Help, footer, probe ─── */
dialog.help { border: 1px solid var(--line-2); border-radius: var(--r-lg); padding: 22px 26px; max-width: min(520px, calc(100vw - 32px)); color: var(--ink); background: var(--surface); }
dialog.help::backdrop { background: color-mix(in srgb, var(--ink) 45%, transparent); }
dialog.help h2 { margin: 0 0 12px; font-size: var(--h3); }
.help-toggle { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-weight: 500; }
.help-toggle input { width: 18px; height: 18px; accent-color: var(--ink); }
.help-toggle + .edu-small { margin: 6px 0 0; }
.app-footer { padding: 20px var(--gutter) 32px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; color: var(--ink-2); font-size: var(--body-sm); }
.app-footer p { margin: 0; }
.probe { padding: 20px var(--gutter); background: var(--paper-3); }
.probe h2 { font-size: var(--h3); margin: 0 0 6px; }
.probe-value { overflow-wrap: anywhere; font-family: var(--font-mono); font-size: 12px; }
.probe .card { margin-top: 12px; }
[data-check-status="pass"] .probe-status { color: var(--green-600); font-weight: 700; }
[data-check-status="fail"] .probe-status { color: var(--red-600); font-weight: 700; }

/* ─── Phone ─── */
@media (max-width: 768px) {
  .edu-header { display: contents; }
  .edu-header-inner { display: contents; }
  .brand { padding: 2px 16px; background: var(--paper); border-bottom: 1px solid var(--line); }
  .nav-shell { position: sticky; top: 0; z-index: 50; background: var(--paper); padding: 6px 12px; border-bottom: 1px solid var(--line-2); }
  .nav { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; }
  .nav-pill { padding: 12px 12px; min-height: 44px; display: inline-flex; align-items: center; }
  #views a { display: inline-block; padding: 10px 0; }
  #views a.link-more { display: inline-flex; align-items: center; min-width: 44px; min-height: 44px; }
  .seed-control input { min-height: 44px; }
  .chart-pair { grid-template-columns: minmax(0, 1fr); }
  .opt input { width: 22px; height: 22px; }
  .train-bar { padding: 4px 16px; gap: 2px 10px; }
  .sec { padding: 28px 0 36px; }
  .page-head { padding: 24px 16px 20px; }
  .split, .pair, .wide-tiles, .bench-grid { grid-template-columns: minmax(0, 1fr); }
  .group-hero { grid-template-columns: 1fr; padding: 20px; gap: 14px; }
  .sec-head { flex-direction: row; flex-wrap: wrap; align-items: center; }
  .sec-head h2 { flex: 1; min-width: 0; font-size: var(--h3); }
  .sec-head::after { flex: 1 0 100%; }
  .stats { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  /* Tables become stacked rows: one card per row, each cell labelled with its column, so nothing hides off-screen. */
  .table-card table, .table-card tbody, .table-card tr, .table-card td { display: block; width: 100%; }
  .table-card thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .table-card tr { padding: 8px 0; border-bottom: 1px solid var(--line-2); }
  .table-card tbody tr:nth-child(even) td { background: transparent; }
  .table-card td { display: grid; grid-template-columns: minmax(6.5rem, 38%) minmax(0, 1fr); gap: 10px; padding: 4px 14px; border: none; text-align: left; overflow-wrap: anywhere; }
  .table-card td::before { content: attr(data-label); font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
  .table-card td.num { text-align: left; }
  .table-card td:first-child { display: block; color: var(--ink); font-weight: 600; }
  .table-card td:first-child::before { display: none; }
  /* SFT demonstrations: a compact card per row, style and held-out flag share one line. */
  #demo-table tr { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 10px; }
  #demo-table td:nth-child(1), #demo-table td:nth-child(2) { grid-column: 1 / -1; }
  #demo-table td:nth-child(3), #demo-table td:nth-child(4) { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
  .demo-box-table { max-height: none; }
  .bar { grid-template-columns: minmax(60px, 100px) minmax(0, 1fr) 50px; min-height: 40px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* ─── Notices, samples, step pages ─── */
.notice { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; border-radius: var(--r-md); padding: 14px 20px; }
.notice p { margin: 0; flex: 1 1 20rem; font-weight: 500; }
.btn-ink { display: inline-flex; align-items: center; min-height: 44px; padding: 8px 18px; background: var(--ink); color: var(--paper); border: none; border-radius: var(--r-pill); font-family: var(--font-display); font-weight: 600; text-decoration: none; transition: background-color .12s; }
.btn-ink:hover:not(:disabled) { background: var(--ink-2); }
/* On the yellow notice a half-transparent ink button turned grey; keep it solid and just mute it. */
.notice .btn-ink:disabled { opacity: 1; background: var(--ink-2); color: var(--paper); }
#views a.btn-ink { color: var(--paper); }
.chain .link.on { background: var(--yellow); color: var(--on-primary); border-color: var(--yellow); }
.data-sample { display: grid; gap: 8px; margin-top: 10px; min-width: 0; }
.data-sample p { margin: 0; }
.sample-list, .sample-prompts { max-height: 340px; overflow-y: auto; }
.pair-line { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: center; min-width: 0; }
.step-link { align-self: center; }
.step-caption { display: block; background: var(--paper-2); border-radius: var(--r-sm); padding: 10px 14px; font-weight: 500; color: var(--ink); min-height: 66px; overflow-wrap: anywhere; }
.bar-static { cursor: default; }
.bar-static:hover { background: transparent; }
.bar.is-target { background: var(--yellow); color: var(--yellow-ink); }
.bar.is-target:hover { background: var(--yellow); }
.bar.is-target .bar-track { background: var(--paper); }
.demo-box { display: grid; gap: 6px; justify-items: start; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: var(--r-md); min-width: 0; }
.demo-box p { margin: 0; }
.rl-values { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; margin: 6px 0 0; font-size: var(--body-sm); }
.rl-values dt { color: var(--ink-2); }
.rl-values dd { margin: 0; font-family: var(--font-mono); text-align: right; color: var(--ink); }
.hash-line { overflow-wrap: anywhere; color: var(--ink-3); }
.pair-opt .edu-chip { justify-self: start; }

/* ─── SmolLM2 panel ─── */
.smol-grid { align-items: start; }
.smol-input { margin: 4px 0 0; padding: 8px 10px; background: var(--paper-2); border-radius: var(--r-sm); font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); max-height: 140px; overflow-y: auto; }
.smol-output { margin: 4px 0 0; }
.smol-progress { display: grid; gap: 4px; }
.smol-column .edu-overline { margin: 0; }
.smol-error { overflow-wrap: anywhere; }

/* ─── Header between phone and wide desktop: nav gets its own full row, one line, scrolling if needed ─── */
@media (min-width: 769px) and (max-width: 1279px) {
  .nav-shell { flex: 1 0 100%; padding-bottom: 4px; }
  .nav { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; }
}
.quiz-review { margin: 0; padding-left: 22px; display: grid; gap: 12px; }
.quiz-review li { display: grid; gap: 4px; }
.quiz-review p { margin: 0; font-size: var(--body-sm); color: var(--ink-2); }
.quiz-review-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 600; color: var(--ink); }
#demo-rows tr:focus-visible, #demo-rows tr:focus { outline: 3px solid transparent; box-shadow: var(--focus-ring); }

/* ─── Simulation: single-step pages ─── */
.bar.bar-with-delta, .step-pair .bar { grid-template-columns: minmax(70px, 130px) minmax(0, 1fr) 56px 68px; }
.bar-delta { font-family: var(--font-mono); font-size: 12px; text-align: right; white-space: nowrap; }
.bar-delta.is-up { color: var(--green-600); }
.bar-delta.is-down { color: var(--red-600); }
.bar.is-target .bar-delta { color: var(--yellow-ink); }
.token-chip.slot { background: var(--surface); color: var(--ink); border: 2px dashed var(--line-strong); font-weight: 700; min-width: 34px; justify-content: center; }
.step-context { padding: 10px 12px; border: 1px solid var(--line-2); border-radius: var(--r-md); }
.gauge { display: grid; gap: 22px; }
.gauge-track { position: relative; height: 10px; border-radius: var(--r-pill); background: linear-gradient(90deg, var(--green) 0%, var(--yellow) 50%, var(--red) 100%); margin: 8px 24px 0; }
.gauge-mark { position: absolute; top: 14px; transform: translateX(-50%); font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-xs); padding: 2px 6px; white-space: nowrap; }
.gauge-mark::before { content: ""; position: absolute; left: 50%; top: -9px; width: 2px; height: 9px; background: var(--ink); transform: translateX(-50%); }
.gauge-mark-after { top: auto; bottom: 14px; background: var(--yellow); border-color: var(--yellow); }
.gauge-mark-after::before { top: auto; bottom: -9px; }
.gauge .edu-small { margin: 0; }
.update-note { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1.5px solid var(--yellow); border-radius: var(--r-md); background: var(--surface); }
.update-note p { margin: 0; font-weight: 500; }
.step-lesson { border: 1.5px solid var(--green-600); }
.rl-side { transition: border-color .2s, background-color .2s; }
.rl-side.is-preferred { border: 1.5px solid var(--green-600); }
.rl-side.is-other { border-color: var(--line); color: var(--ink-2); }
.rl-values .is-plus { color: var(--green-600); }
.rl-values .is-minus { color: var(--red-600); }
.stats.stats-1 { grid-template-columns: minmax(0, 1fr); }
.score-track { position: relative; }
.score-track::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--ink-3); }
.bar-fill.is-plus { background: var(--green-600); }
.bar-fill.is-minus { background: var(--red-600); }
.score-bar { grid-template-columns: minmax(90px, 150px) minmax(0, 1fr) 48px; }
@media (max-width: 768px) {
  .bar.bar-with-delta, .step-pair .bar { grid-template-columns: minmax(60px, 90px) minmax(0, 1fr) 50px 58px; }
}
</style>
</head>

function hashSeed(a, b) {
  let h = 2166136261 ^ a;
  const text = String(b);
  for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function makeRng(seed) {
  let s = seed >>> 0;
  return function rng() {
    s = (s + 0x6D2B79F5) | 0;
    let z = Math.imul(s ^ (s >>> 15), 1 | s);
    z = (z + Math.imul(z ^ (z >>> 7), 61 | z)) ^ z;
    return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffled(list, rng) {
  const copy = list.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    const tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
  }
  return copy;
}

// "Stolicą Grecji są Ateny": a plural capital takes a plural verb.
function capVerb(g) { return g.verb || 'jest'; }

// `forSft` true builds the training demonstrations; false builds the held-out entries (sft: false),
// which are never trained on and serve only as the SFT validation set.
function buildDemos(forSft = true) {
  const demos = [];
  const add = (prompt, intent, style, response, heldOut) => demos.push({ prompt, intent, style, response, heldOut: !!heldOut });
  GEO.filter((g) => g.sft === forSft).forEach((g) => {
    const prompt = `Jaka jest stolica ${g.gen} ?`;
    add(prompt, 'fact', 'pozadana', `Stolicą ${g.gen} ${capVerb(g)} ${g.cap} .`);
    add(prompt, 'fact', 'pozadana', `${g.cap} to stolica ${g.gen} .`);
  });
  LIST_CATEGORIES.filter((c) => c.sft === forSft).forEach((c) => {
    const prompt = `Wymień trzy ${c.key} .`;
    const it = c.items;
    add(prompt, 'list', 'pozadana', `Trzy ${c.key} to : ${it[0]} , ${it[1]} i ${it[2]} .`);
    add(prompt, 'list', 'pozadana', `Trzy ${c.key} to : ${it[1]} , ${it[3]} i ${it[4]} .`);
  });
  SENTENCE_SUBJECTS.filter((s) => s.sft === forSft).forEach((s) => {
    const prompt = `Napisz jedno zdanie o ${s.loc} .`;
    add(prompt, 'sentence', 'pozadana', s.full[0]);
    add(prompt, 'sentence', 'pozadana', s.full[1]);
  });
  return demos;
}

function buildVocab(docs, demos) {
  const set = new Set([TOKEN_NL, TOKEN_END, TOKEN_UNK]);
  docs.forEach((d) => d.lines.forEach((l) => splitTokens(l).forEach((tok) => set.add(tok))));
  demos.forEach((d) => { splitTokens(d.prompt).concat(splitTokens(d.response)).forEach((tok) => set.add(tok)); });
  EVAL_PROMPTS.forEach((p) => tokenizeRaw(p.text).forEach((tok) => set.add(tok)));
  Object.values(HARM_TOPICS).forEach((h) => splitTokens(h.unsafe).concat(splitTokens(h.refusal)).forEach((tok) => set.add(tok)));
  const list = Array.from(set);
  const index = new Map(list.map((tok, i) => [tok, i]));
  const lower = new Map();
  list.forEach((tok, i) => { const low = tok.toLowerCase(); if (!lower.has(low)) lower.set(low, i); });
  return { list, index, lower, nl: index.get(TOKEN_NL), end: index.get(TOKEN_END), unk: index.get(TOKEN_UNK) };
}

function tokenizeRaw(text) { return text.match(/[\p{L}\p{N}]+|[^\s\p{L}\p{N}]/gu) || []; }

function tokenize(text, vocab) {
  const raw = tokenizeRaw(text);
  const ids = raw.map((tok) => {
    if (vocab.index.has(tok)) return vocab.index.get(tok);
    const low = tok.toLowerCase();
    return vocab.lower.has(low) ? vocab.lower.get(low) : vocab.unk;
  });
  return { raw, ids };
}

function buildData() {
  const docs = buildCorpusDocs();
  const demos = buildDemos(true);
  const valDemos = buildDemos(false);
  const vocab = buildVocab(docs, demos.concat(valDemos));
  const toIds = (line) => splitTokens(line).map((tok) => vocab.index.get(tok));
  // The corpus repeats every line several times, so the validation split is by unique line text:
  // all copies of a held-out line land in validation, none in training.
  const uniqueLines = [];
  docs.forEach((doc) => doc.lines.forEach((line) => { if (!uniqueLines.includes(line)) uniqueLines.push(line); }));
  const valLines = new Set(uniqueLines.filter((line, i) => i % 10 === 9));
  const corpusIds = [];
  const corpusIsVal = [];
  docs.forEach((doc) => {
    doc.lines.forEach((line) => {
      const isVal = valLines.has(line);
      toIds(line).concat([vocab.nl]).forEach((id) => { corpusIds.push(id); corpusIsVal.push(isVal); });
    });
    corpusIds.push(vocab.nl); corpusIsVal.push(false);
  });
  const toSeq = (d) => ({
    context: toIds(d.prompt).concat([vocab.nl]),
    response: toIds(d.response).concat([vocab.end]),
    prompt: d.prompt,
  });
  const demoSeqs = demos.map(toSeq);
  const valDemoSeqs = valDemos.map(toSeq);
  const rawBigrams = new Set();
  docs.forEach((d) => d.lines.forEach((l) => { const t = splitTokens(l); for (let i = 1; i < t.length; i++) rawBigrams.add(t[i - 1] + ' ' + t[i]); }));
  const allBigrams = new Set(rawBigrams);
  demos.forEach((d) => { const t = splitTokens(d.response); for (let i = 1; i < t.length; i++) allBigrams.add(t[i - 1] + ' ' + t[i]); });
  const rawTokens = new Set(); const allTokens = new Set();
  docs.forEach((d) => d.lines.forEach((l) => splitTokens(l).forEach((tok) => { rawTokens.add(tok); allTokens.add(tok); })));
  demos.forEach((d) => splitTokens(d.response).forEach((tok) => allTokens.add(tok)));
  const rlPrompts = Array.from(new Set(demos.map((d) => d.prompt)));
  // Words that follow a sentence subject at the start of a line (verbs, in practice); the sentence classifier needs one.
  const subjects = new Set(SENTENCE_SUBJECTS.map((s) => s.subject.toLowerCase()));
  const subjectFollowers = new Set();
  const noteFollower = (line) => {
    const t = splitTokens(line);
    t.forEach((tok, i) => {
      const start = i === 0 || t[i - 1] === '.' || t[i - 1] === '?';
      if (start && i + 1 < t.length && subjects.has(tok.toLowerCase()) && /\p{L}/u.test(t[i + 1])) subjectFollowers.add(t[i + 1].toLowerCase());
    });
  };
  docs.forEach((d) => d.lines.forEach(noteFollower));
  demos.concat(valDemos).forEach((d) => noteFollower(d.response));
  return { docs, demos, valDemos, vocab, corpusIds, corpusIsVal, demoSeqs, valDemoSeqs, rawBigrams, allBigrams, rawTokens, allTokens, rlPrompts, subjectFollowers,
    rlPromptIds: rlPrompts.map((p) => toIds(p).concat([vocab.nl])), rlPromptExpect: rlPrompts.map(expectationForText),
    evalPrompts: EVAL_PROMPTS.map((p) => ({ ...p, ids: tokenize(p.text, vocab).ids.concat([vocab.nl]) })) };
}

// ─── Helpers: classifier ───
function eqi(a, b) { return a.toLowerCase() === b.toLowerCase(); }

function expectationForText(text) {
  const raw = tokenizeRaw(text).map((tok) => tok.toLowerCase()).join(' ');
  const p = EVAL_PROMPTS.find((q) => tokenizeRaw(q.text).map((tok) => tok.toLowerCase()).join(' ') === raw);
  if (p) return p;
  const geo = GEO.find((g) => `jaka jest stolica ${g.gen} ?`.toLowerCase() === raw);
  if (geo) return { intent: 'fact', geo: geo.gen };
  const cat = LIST_CATEGORIES.find((c) => `wymień trzy ${c.key} .` === raw);
  if (cat) return { intent: 'list', category: cat.key };
  const sub = SENTENCE_SUBJECTS.find((s) => `napisz jedno zdanie o ${s.loc} .` === raw);
  if (sub) return { intent: 'sentence', subject: sub.subject };
  return null;
}

function splitSegment(tokens) {
  const segment = [];
  for (let i = 0; i < tokens.length; i++) {
    if (tokens[i] === TOKEN_NL || tokens[i] === TOKEN_END) return { segment, end: tokens[i] };
    segment.push(tokens[i]);
  }
  return { segment, end: 'limit' };
}

function isPlausible(segment, bigrams, tokenSet) {
  if (segment.length === 0) return false;
  if (segment.length === 1) return tokenSet.has(segment[0]);
  let hits = 0;
  for (let i = 1; i < segment.length; i++) if (bigrams.has(segment[i - 1] + ' ' + segment[i])) hits++;
  return hits / (segment.length - 1) >= PLAUSIBLE_SHARE;
}

function listItemsValid(tokens, items) {
  // Items separated by exactly one "," or "i"; the list ends in "."
  if (tokens.length !== 6 || tokens[5] !== '.') return false;
  const picked = [tokens[0], tokens[2], tokens[4]].map((tok) => tok.toLowerCase());
  const seps = [tokens[1], tokens[3]];
  if (!seps.every((sep) => sep === ',' || sep.toLowerCase() === 'i')) return false;
  const allowed = items.map((tok) => tok.toLowerCase());
  return new Set(picked).size === 3 && picked.every((tok) => allowed.includes(tok));
}

function meetsExpectation(segment, expect, data) {
  if (expect.intent === 'harm') return null;
  if (expect.intent === 'fact') {
    const g = GEO.find((item) => item.gen === expect.geo);
    const full = `stolicą ${g.gen} ${capVerb(g)} ${g.cap} .`.toLowerCase();
    if (segment.join(' ').toLowerCase() === full) return 'complete';
    if (segment.length <= 4 && segment.some((tok) => eqi(tok, g.cap))) return 'curt';
    return null;
  }
  if (expect.intent === 'list') {
    const c = LIST_CATEGORIES.find((item) => item.key === expect.category);
    if (segment.length === 10 && eqi(segment[0], 'trzy') && eqi(segment[1], c.key) && eqi(segment[2], 'to') && segment[3] === ':' && listItemsValid(segment.slice(4), c.items)) return 'complete';
    if (listItemsValid(segment, c.items)) return 'curt';
    // Two items instead of three: correct, but incomplete.
    const allowed = c.items.map((tok) => tok.toLowerCase());
    if (segment.length === 4 && eqi(segment[1], 'i') && segment[3] === '.' && segment[0].toLowerCase() !== segment[2].toLowerCase() && [segment[0], segment[2]].every((tok) => allowed.includes(tok.toLowerCase()))) return 'curt';

// A few samples that follow the checkpoint's mix of answer types (largest remainder), so SFT and RL

// The variant within a type and the order stay random, so rerolling still changes the answers.
function quotaOutcomes(ck, expect, count, rng, opts) {
  if (ck === 'random' || ck === 'pretrain' || !expect) return sampleOutcomes(ck, expect, count, rng, opts);
  const byClass = {};
  outcomes(ck, expect, opts).forEach((item) => { (byClass[item.cls] = byClass[item.cls] || []).push(item); });
  const quota = Object.keys(byClass).map((cls) => {
    const exact = count * byClass[cls].reduce((n, item) => n + item.w, 0);
    return { cls, n: Math.floor(exact), rest: exact - Math.floor(exact) };
  });
  let left = count - quota.reduce((n, q) => n + q.n, 0);
  quota.slice().sort((a, b) => b.rest - a.rest).forEach((q) => { if (left > 0) { q.n += 1; left -= 1; } });
  const out = [];

// ─── Helpers: data samples ───

// ─── Helpers: persistence (finished stages survive a reload) ───
function saveProgress() {

  const record = { done, labeller: App.stages.rl.labeller, source: App.rl.source, own: App.rl.own, equalCount: App.rl.equalCount };
  safeStorageSet(STORAGE_KEY, JSON.stringify(record));
}
function restoreProgress() {

  if (!record || !Array.isArray(record.done)) return false;

  App.rl.equalCount = Number(record.equalCount) || 0;
  if (LABELLER_NAME_KEYS[record.source]) App.rl.source = record.source;
  let restored = 0;
  STAGE_ORDER.forEach((key, i) => {
    if (!record.done.includes(key)) return;
    if (i > 0 && App.stages[STAGE_ORDER[i - 1]].status !== 'done') return;
    const stage = Object.assign(App.stages[key], newStage(key), { status: 'done' });
    if (key === 'rl') { stage.labeller = LABELLER_NAME_KEYS[record.labeller] ? record.labeller : 'rzeczowy'; App.rl.mainLabeller = stage.labeller; }
    stage.step = stage.stepsTotal;

      if (key === 'rl') stage.history.push({ step: Math.round(f * stage.stepsTotal), preferred: point.preferred });
      else { stage.history.push({ step: Math.round(f * stage.stepsTotal), loss: point.loss, val: point.val }); if (k === 0) { stage.lossInitial = point.loss; stage.valLossInitial = point.val; } stage.loss = point.loss; stage.valLoss = point.val; }
    }

    stage.metrics = computeMetrics(key, { labeller: stage.labeller });

function clearProgress() { try { window.localStorage.removeItem(STORAGE_KEY); } catch (err) { /* nothing to clear */ } }

// ─── Helpers: single-step pages (scripted) ───
function newStep(key) {

function stepLevels(key, ex, moment) {

// Builds the numbers of one token step: top-5 before and after the update, loss before and after.
function buildTokenStep(key, ex, moment) {
  const level = stepLevels(key, ex, moment);

  const pAfter = Math.min(0.995, level.target + level.gain);

    context: ex.context, target: ex.target, pBefore: level.target, pAfter, lossBefore: -Math.log(level.target), lossAfter: -Math.log(pAfter),
    topBefore: order(before), topAfter: order(after), restBefore: 1 - before.reduce((n, i) => n + i.p, 0), restAfter: 1 - after.reduce((n, i) => n + i.p, 0),
    lesson: ex.lesson, demo: ex.demo || null,

function syncStepValues(step) {

function stepForward(key) {

    const kind = column.state === 'generating' ? 'generate' : 'download';
    smolFail(key, kind, msg.message);
  }
}

function smolCancel(key) {
  const column = App.smol.columns[key];
  if (!['downloading', 'generating'].includes(column.state)) return;
  if (column.state === 'generating') {
    // Stop this answer only: the model stays loaded. A worker that does not stop in time is dropped as before.
    if (column.cancelling) return;
    column.cancelling = true;
    column.worker.postMessage({ type: 'interrupt' });
    column.cancelTimer = setTimeout(() => { if (column.cancelling) smolTerminate(key); }, SMOL_CANCEL_TIMEOUT_MS);
    renderSmol();
    return;
  }
  smolTerminate(key);
}

// Drops a loaded model from memory (worker and weights); the browser cache keeps the downloaded files.
function smolUnload(key) {
  const column = App.smol.columns[key];
  if (column.state !== 'ready' || App.smol.queue.includes(key) || App.smol.running === key) return;
  if (column.worker) column.worker.terminate();
  Object.assign(column, newSmolColumn(key), { checked: column.checked });
  announce(t('smolLiveUnload', { name: t(`smolName_${key}`) }));
  renderSmol();
}

function smolTerminate(key) {
  const column = App.smol.columns[key];
  if (column.cancelTimer) clearTimeout(column.cancelTimer);
  if (column.worker) column.worker.terminate();
  Object.assign(column, newSmolColumn(key), { checked: column.checked });
  App.smol.queue = App.smol.queue.filter((item) => item !== key);
  if (App.smol.running === key) App.smol.running = null;
  announce(t('smolLiveCancel', { name: t(`smolName_${key}`) }));
  smolNextInQueue();
  renderSmol();
}

function smolGenerate() {
  const smol = App.smol;
  if (!smol.prompt.trim()) { smol.promptError = t('smolPromptEmpty'); renderSmol(); return false; }
  smol.promptError = '';
  const ready = SMOL_ORDER.filter((key) => smol.columns[key].state === 'ready' && !smol.queue.includes(key) && smol.running !== key);
  if (!ready.length) { renderSmol(); return false; }
  smol.queue.push(...ready);
  smol.currentPrompt = smol.prompt;
  ready.forEach((key) => { Object.assign(smol.columns[key], { output: '', ms: 0, tokens: 0, interrupted: false }); });
  smolNextInQueue();
  renderSmol();
  return true;
}

// One column generates at a time, so the columns do not fight over memory or the GPU.
function smolNextInQueue() {
  const smol = App.smol;
  if (smol.running || !smol.queue.length) return;
  const key = smol.queue.shift();
  const column = smol.columns[key];
  if (column.state !== 'ready' || !column.worker) { smolNextInQueue(); return; }
  column.state = 'generating';
  smol.running = key;
  column.worker.postMessage({ type: 'generate', prompt: smol.currentPrompt, chat: SMOL_MODELS[key].chat, settings: SMOL_GENERATION });
}

// A mocked worker for the offline probes: it speaks the same messages and never touches the network.
function createMockSmolWorker(behaviour) {
  const mock = {
    onmessage: null, onerror: null, closed: false, sent: [],
    emit(msg, delay) { setTimeout(() => { if (!mock.closed && mock.onmessage) mock.onmessage({ data: msg }); }, delay); },
    terminate() { mock.closed = true; },
    postMessage(msg) {
      mock.sent.push(msg);
      if (msg.type === 'load') {
        if (behaviour === 'hang') return;
        mock.emit({ type: 'progress', loaded: 1035, total: 1035 }, 1);
        if (behaviour === 'fail-load') { mock.emit({ type: 'error', message: 'mock-failure' }, 2); return; }
        const backend = behaviour === 'gpu-fail' ? 'wasm' : msg.device;
        mock.emit({ type: 'ready', backend, dtype: msg.dtype[backend], fallback: behaviour === 'gpu-fail' ? 'mock-gpu-error' : '', loadMs: 1 }, 3);
      } else if (msg.type === 'interrupt') {
        if (mock.waiting) { mock.waiting = false; mock.emit({ type: 'done', text: 'mock partial', tokens: 1, ms: 2, interrupted: true }, 1); }
      } else if (msg.type === 'generate') {
        mock.emit({ type: 'input', input: msg.chat ? `<chat>${msg.prompt}` : msg.prompt }, 1);
        if (behaviour === 'hang-generate') { mock.waiting = true; return; }
        if (behaviour === 'fail-generate') { mock.emit({ type: 'error', message: 'mock-generate-failure' }, 2); return; }
        mock.emit({ type: 'token', text: 'mock' }, 2);
        mock.emit({ type: 'done', text: 'mock output', tokens: 2, ms: 3 }, 3);
      }
    },
  };
  return mock;
}

function smolProbeChecks(add) {
  const until = (cond) => waitFor(cond, 3000);
  const column = (key) => qs(`[data-smol-column="${key}"]`);
  const state = (key) => column(key).getAttribute('data-state');
  const reset = (behaviours) => {
    SMOL_ORDER.forEach((key) => { if (App.smol.columns[key].worker) App.smol.columns[key].worker.terminate(); });
    const created = {};
    initSmol();
    App.smol.factory = (key) => { created[key] = createMockSmolWorker((behaviours && behaviours[key]) || 'ok'); return created[key]; };
    App.smol.columns.sft.state = 'idle';
    App.smol.columns.sft.checked = true;
    App.smol.gpuChecked = true; App.smol.gpuAvailable = true; App.smol.engine = 'webgpu'; App.smol.engineChosen = true;
    renderSmol();
    return created;
  };
  const restore = () => { reset(); initSmol(); renderSmol(); };
  add('smol-offline', () => {
    const external = performance.getEntriesByType('resource').filter((e) => /huggingface|hf\.co|jsdelivr|transformers/.test(e.name)).map((e) => e.name);
    const noLib = !window.transformers;
    const idle = ['base', 'instruct'].every((key) => state(key) === 'idle');
    const told = SMOL_ORDER.every((key) => /MB/.test(qs('[data-action="smol-load"]', column(key)).textContent));
    const worker = SMOL_ORDER.every((key) => App.smol.columns[key].worker === null);
    const wasmDefault = App.smol.engine === 'wasm' && qs('[data-smol]').getAttribute('data-engine') === 'wasm';
    return { ok: external.length === 0 && noLib && idle && told && worker && wasmDefault, value: `bez sieci:${external.length === 0} stan:${idle} rozmiar w przycisku:${told} bez procesu:${worker} domyślnie WASM:${wasmDefault}` };
  });
  add('smol-flow', async () => {
    const created = reset();
    smolLoad('base');
    const downloading = state('base') === 'downloading';
    await until(() => Number(column('base').getAttribute('data-loaded')) > 0 || state('base') === 'ready');
    const notFull = state('base') === 'ready' || (Number(column('base').getAttribute('data-progress')) < 5 && Number(column('base').getAttribute('data-total')) === smolDownloadBytes('base'));
    await until(() => state('base') === 'ready');
    const backend = column('base').getAttribute('data-backend') === 'webgpu' && column('base').getAttribute('data-dtype') === SMOL_DTYPE.webgpu;
    smolLoad('instruct');
    await until(() => state('instruct') === 'ready');
    const prompt = App.smol.prompt;
    smolGenerate();
    const serial = [state('base'), state('instruct')].filter((s) => s === 'generating').length === 1;
    await until(() => state('base') === 'ready' && state('instruct') === 'ready' && column('base').getAttribute('data-output') === 'mock output' && column('instruct').getAttribute('data-output') === 'mock output');
    const baseMsg = created.base.sent.find((m) => m.type === 'generate');
    const instructMsg = created.instruct.sent.find((m) => m.type === 'generate');
    const raw = baseMsg.chat === false && column('base').getAttribute('data-input') === prompt;
    const chat = instructMsg.chat === true && column('instruct').getAttribute('data-input') === `<chat>${prompt}`;
    const settings = JSON.stringify(baseMsg.settings) === JSON.stringify(SMOL_GENERATION);
    restore();
    return { ok: downloading && notFull && backend && serial && raw && chat && settings, value: `pobieranie:${downloading} postęp po małym pliku:${notFull} backend:${backend} po kolei:${serial} surowy:${raw} szablon:${chat} ustawienia:${settings}` };
  });
  add('smol-cancel', async () => {
    const created = reset({ base: 'hang', instruct: 'hang-generate' });
    smolLoad('base');
    const was = state('base') === 'downloading';
    smolCancel('base');
    const cancelled = state('base') === 'idle' && created.base.closed;
    smolLoad('instruct');
    await until(() => state('instruct') === 'ready');
    smolGenerate();
    const generating = state('instruct') === 'generating';
    smolCancel('instruct');
    await until(() => state('instruct') === 'ready');
    const stopped = state('instruct') === 'ready' && !created.instruct.closed && App.smol.running === null && column('instruct').getAttribute('data-interrupted') === 'true' && qs('.smol-note', column('instruct')).textContent.length > 0;
    created.instruct.sent.length = 0;
    smolGenerate();
    const again = created.instruct.sent.some((m) => m.type === 'generate') && created.instruct.sent.every((m) => m.type !== 'load');
    restore();
    return { ok: was && cancelled && generating && stopped && again, value: `pobieranie:${was}/${cancelled} generowanie:${generating}/${stopped} model zostaje:${again}` };
  });
  add('smol-errors', async () => {
    reset({ base: 'fail-load', instruct: 'fail-generate' });
    smolLoad('base');
    await until(() => state('base') === 'error');
    const message = column('base').getAttribute('data-error').length > 0 && qs('[data-action="smol-load"]', column('base')).disabled === false && qs('.smol-error', column('base')).textContent.length > 0;
    smolLoad('instruct');
    await until(() => state('instruct') === 'ready');
    smolGenerate();
    await until(() => state('instruct') === 'error');
    const generateFailed = column('instruct').getAttribute('data-error-kind') === 'generate';
    const emptyPrompt = (() => { App.smol.prompt = '  '; const r = smolGenerate(); return r === false && qs('#smol-prompt-error').textContent.length > 0; })();
    restore();
    return { ok: message && generateFailed && emptyPrompt, value: `pobieranie:${message} generowanie:${generateFailed} pusty prompt:${emptyPrompt}` };
  });
  add('smol-fallback', async () => {
    reset({ base: 'gpu-fail' });
    smolLoad('base');
    await until(() => state('base') === 'ready');
    const ok = column('base').getAttribute('data-backend') === 'wasm' && qs('.smol-backend', column('base')).textContent.includes('WASM') && qs('.smol-backend', column('base')).textContent.length > 8;
    restore();
    return { ok, value: `WASM po błędzie WebGPU:${ok}` };
  });
  add('smol-engine', () => {
    reset();
    const size = () => qs('[data-action="smol-load"]', column('instruct')).textContent;
    const gpuSize = size();
    const gpuOk = gpuSize.includes(smolMegabytes(SMOL_MODELS.instruct.bytes.fp32 + SMOL_MODELS.instruct.extra));
    smolSetEngine('wasm');
    const wasmSize = size();
    const wasmOk = wasmSize.includes(smolMegabytes(SMOL_MODELS.instruct.bytes.int8 + SMOL_MODELS.instruct.extra));
    const engineAttr = qs('[data-smol]').getAttribute('data-engine') === 'wasm';
    restore();
    return { ok: gpuOk && wasmOk && engineAttr, value: `WebGPU: ${gpuSize}; WASM: ${wasmSize}` };
  });
  add('smol-unavailable', async () => {
    reset();
    const col = App.smol.columns.sft;
    col.state = 'unavailable'; col.errorKind = 'not-hosted';
    renderSmol();
    const shown = state('sft') === 'unavailable' && !column('sft').hidden && qs('.smol-note', column('sft')).textContent.length > 20 && qs('[data-action="smol-load"]', column('sft')).disabled;
    const ignored = (() => { smolLoad('sft'); return state('sft') === 'unavailable'; })();
    const source = smolSftSource();
    const constantOk = source.remote === true && source.model === 'andrzej/smollm2-135M-SFT-Only-ONNX';
    reset({ sft: 'fail-load' });
    smolLoad('sft');
    await until(() => state('sft') === 'unavailable');
    const fetchFailed = column('sft').getAttribute('data-error-kind') === 'fetch-failed' && !qs('[data-action="smol-load"]', column('sft')).hidden && qs('.smol-note', column('sft')).textContent.length > 20;
    restore();
    return { ok: shown && ignored && constantOk && fetchFailed, value: `widoczna:${shown} bez pobierania:${ignored} stała:${constantOk} nieudane pobranie:${fetchFailed}` };
  });
}

async function runSmolRealProbe() {
  refs.probe.hidden = false;
  setAttr(refs.probe, 'data-probe-status', 'running');
  setView('smollm');
  await waitFor(() => App.smol.gpuChecked, 5000);
  await new Promise((r) => setTimeout(r, 300));
  const prompts = SMOL_PROMPTS;
  const results = [];
  const keepPrompt = App.smol.prompt; const keepError = App.smol.promptError;
  try {
    await checkSftAvailability();
    for (const key of SMOL_ORDER) {
      const column = App.smol.columns[key];
      if (column.state === 'unavailable') { setProbeRow(`real-${key}`, 'skip', `niedostępna: ${column.errorKind}`); continue; }
      const started = nowMs();
      smolLoad(key);
      await waitFor(() => ['ready', 'error'].includes(column.state), 1200000);
      if (column.state === 'error') { setProbeRow(`real-${key}`, 'fail', column.error); results.push({ key, error: column.error }); continue; }
      const loadSeconds = Math.round((nowMs() - started) / 1000);
      const outputs = [];
      for (const prompt of prompts) {
        App.smol.prompt = prompt;
        App.smol.queue = [];
        const sent = smolGenerateOne(key);
        await waitFor(() => ['ready', 'error'].includes(column.state) && !App.smol.running, 600000);
        outputs.push({ prompt, input: column.input, output: column.output, ms: column.ms, tokens: column.tokens, sent });
      }
      results.push({ key, backend: column.backend, dtype: column.dtype, fallback: column.fallback, loaded: column.loaded, total: column.total, loadSeconds, outputs });
      setProbeRow(`real-${key}`, outputs.every((o) => o.output.length > 0) ? 'pass' : 'fail', `${column.backend}/${column.dtype}, ${loadSeconds} s`);
      setAttr(refs.probe, 'data-real-results', JSON.stringify(results));
      column.worker.terminate();
      Object.assign(column, newSmolColumn(key), { checked: true });
      renderSmol();
    }
  } finally {
    // The probe sets App.smol.prompt to its own prompts; give the user's prompt (and its trim notice) back even if a step throws.
    App.smol.prompt = keepPrompt; App.smol.promptError = keepError; renderSmol();
  }
  setAttr(refs.probe, 'data-real-results', JSON.stringify(results));
  updateProbeCounts(false);
}

function smolGenerateOne(key) {
  const smol = App.smol;
  smol.currentPrompt = smol.prompt;
  smol.queue.push(key);
  smol.columns[key].output = '';
  smolNextInQueue();
  renderSmol();
  return true;
}

function drawChart(canvas, series, yLabelDigits) {
  if (!canvas || canvas.offsetParent === null) return;
  const dpr = window.devicePixelRatio || 1;
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  if (!width || !height) return;
  if (canvas.width !== Math.round(width * dpr) || canvas.height !== Math.round(height * dpr)) {
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, width, height);
  const pad = { l: 44, r: 12, t: 10, b: 22 };
  const all = series.flatMap((s) => s.points);
  ctx.font = CHART_FONT;
  ctx.strokeStyle = CHART_COLORS.grid;
  ctx.fillStyle = CHART_COLORS.axis;
  ctx.lineWidth = 1;
  let minY = 0; let maxY = 1; let maxX = 1;
  if (all.length) {
    minY = Math.min(...all.map((p) => p.y));
    maxY = Math.max(...all.map((p) => p.y));
    maxX = Math.max(...all.map((p) => p.x), 1);
    if (series[0] && series[0].floorZero) minY = Math.min(0, minY);
    if (maxY - minY < 1e-6) maxY = minY + 1;
  }
  const plotW = width - pad.l - pad.r;
  const plotH = height - pad.t - pad.b;
  const px = (x) => pad.l + (x / maxX) * plotW;
  const py = (y) => pad.t + (1 - (y - minY) / (maxY - minY)) * plotH;
  // Polish decimals use a comma; an empty chart draws its grid without numbers rather than repeating "0" and "1".
  let digits = yLabelDigits === undefined ? 1 : yLabelDigits;
  const ticks = [0, 1, 2, 3].map((i) => minY + (maxY - minY) * (i / 3));
  while (digits < 3 && new Set(ticks.map((y) => y.toFixed(digits))).size < ticks.length) digits++;
  ticks.forEach((y) => {
    ctx.beginPath(); ctx.moveTo(pad.l, py(y)); ctx.lineTo(width - pad.r, py(y)); ctx.stroke();
    if (all.length) ctx.fillText(y.toFixed(digits).replace('.', ','), 4, py(y) + 4);
  });
  ctx.fillText('0', pad.l, height - 6);
  ctx.fillText(String(maxX), width - pad.r - ctx.measureText(String(maxX)).width, height - 6);
  series.forEach((s) => {
    if (!s.points.length) return;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 2;
    ctx.setLineDash(s.dash || []);
    ctx.beginPath();
    s.points.forEach((p, i) => { if (i === 0) ctx.moveTo(px(p.x), py(p.y)); else ctx.lineTo(px(p.x), py(p.y)); });
    ctx.stroke();
    ctx.setLineDash([]);
  });
}

function countWords(text) { return text.split(/\s+/).filter((w) => /\p{L}/u.test(w)).length; }

function budgetText(root) {
  const parts = [];
  const walk = (node) => {
    if (node.nodeType === 3) { parts.push(node.nodeValue); return; }
    if (node.nodeType !== 1) return;
    if (node.hasAttribute('data-nobudget')) return;
    if (node.tagName === 'SCRIPT' || node.tagName === 'STYLE' || node.tagName === 'CANVAS') return;
    if (node.tagName === 'DETAILS') { const sum = node.querySelector(':scope > summary'); if (sum) walk(sum); return; }
    node.childNodes.forEach(walk);
    if (/^(P|LI|TD|TH|DIV|H1|H2|H3|H4)$/.test(node.tagName)) parts.push(' ');
  };
  walk(root);
  return parts.join(' ');
}

    if (mini.closest('[data-nobudget]')) return;
    const count = countWords(budgetText(mini));
    if (count > stats.maxMini) stats.maxMini = count;
  });
  return stats;
}

// ─── Helpers: probes ───
function waitFor(cond, timeoutMs) {
  return new Promise((resolve, reject) => {
    const started = nowMs();
    const tick = () => {
      if (cond()) { resolve(true); return; }
      if (nowMs() - started > timeoutMs) { reject(new Error('timeout')); return; }
      setTimeout(tick, 10);
    };
    tick();
  });
}

function centerActiveNav() {
  const pill = qs('.nav-pill.active');
  // Two passes: showing or hiding an arrow changes the scroller's width, which moves the centre.
  for (let pass = 0; pass < 2; pass++) {
    if (pill && refs.nav.scrollWidth > refs.nav.clientWidth) refs.nav.scrollLeft = pill.offsetLeft - refs.nav.offsetLeft - (refs.nav.clientWidth - pill.offsetWidth) / 2;
    updateNavScroll();
  }
}

// Arrow buttons appear only when tabs are cut off on that side, so the reader knows more tabs exist.
function updateNavScroll() {
  const nav = refs.nav;
  const overflow = nav.scrollWidth > nav.clientWidth + 2;
  const prev = qs('#nav-prev'); const next = qs('#nav-next');
  if (!prev) return;
  prev.hidden = !overflow || nav.scrollLeft <= 2;
  next.hidden = !overflow || nav.scrollLeft + nav.clientWidth >= nav.scrollWidth - 2;
  setAttr(qs('.nav-shell'), 'data-overflow', overflow);
}

function scrollNav(direction) {
  const nav = refs.nav;
  const smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  nav.scrollBy({ left: direction * Math.max(120, nav.clientWidth * 0.7), behavior: smooth ? 'smooth' : 'auto' });
  setTimeout(updateNavScroll, smooth ? 400 : 0);
}

function renderSmolColumn(key) {
  const el = qs(`[data-smol-column="${key}"]`);
  if (!el) return;
  const column = App.smol.columns[key];
  setAttr(el, 'data-state', column.state);
  setAttr(el, 'data-progress', column.progress);
  setAttr(el, 'data-loaded', column.loaded);
  setAttr(el, 'data-total', column.total);
  setAttr(el, 'data-backend', column.backend);
  setAttr(el, 'data-dtype', column.dtype);
  setAttr(el, 'data-fallback', column.fallback);
  setAttr(el, 'data-input', column.input);
  setAttr(el, 'data-output', column.output);
  setAttr(el, 'data-error', column.error);
  setAttr(el, 'data-error-kind', column.errorKind);
  setAttr(el, 'data-ms', column.ms);
  setAttr(el, 'data-tokens', column.tokens);
  setAttr(el, 'data-interrupted', column.interrupted);
  setText(qs('.smol-state', el), t(`smolState_${column.state}`));
  const loadBtn = qs('[data-action="smol-load"]', el);
  const busy = column.state === 'downloading' || column.state === 'generating';
  const retryable = column.state === 'error' || (column.state === 'unavailable' && column.errorKind === 'fetch-failed');
  loadBtn.hidden = column.state === 'ready' || (column.state === 'unavailable' && !retryable) || busy;
  loadBtn.disabled = column.state === 'unavailable' && !retryable;
  setText(loadBtn, t(retryable ? 'smolRetry' : 'smolDownload', { size: smolMegabytes(smolDownloadBytes(key)) }));
  const unloadBtn = qs('[data-action="smol-unload"]', el);
  unloadBtn.hidden = column.state !== 'ready' || App.smol.queue.includes(key);
  const cancelBtn = qs('[data-action="smol-cancel"]', el);
  cancelBtn.hidden = !busy;
  cancelBtn.disabled = column.cancelling;
  setText(cancelBtn, t(column.state === 'generating' ? 'smolStop' : 'smolCancel'));
  const progressRow = qs('.smol-progress', el);
  progressRow.hidden = column.state !== 'downloading';
  qs('.smol-progress-fill', el).style.width = `${column.progress}%`;
  setAttr(qs('.smol-progress-track', el), 'aria-valuenow', column.progress);
  setText(qs('.smol-progress-text', el), column.total ? `${column.progress}% (${smolMegabytes(column.loaded)} z ${smolMegabytes(column.total)})` : t('smolStarting'));
  let note = '';
  if (column.state === 'unavailable') note = t({ 'needs-http': 'smolUnavailableHttp', 'fetch-failed': 'smolUnavailableFetch' }[column.errorKind] || 'smolUnavailableHost');
  if (column.state === 'unavailable' && column.error) note += ` ${t('smolErrorShown', { message: column.error })}`;
  if (column.state === 'ready' && column.interrupted) note = t('smolInterrupted');
  setText(qs('.smol-note', el), note);
  setText(qs('.smol-error', el), column.state === 'error' ? t('smolErrorShown', { message: column.error }) : '');
  let backendText = '';
  if (column.backend) {
    backendText = t('smolBackend', { backend: column.backend === 'webgpu' ? 'WebGPU' : 'WASM', dtype: column.dtype, size: smolMegabytes(column.total || smolDownloadBytes(key)) });
    if (column.fallback) backendText += ` ${t('smolFallback')}`;
  }
  setText(qs('.smol-backend', el), backendText);
  setText(qs('.smol-input', el), column.input);
  qs('.smol-input-row', el).hidden = !column.input;
  setText(qs('.smol-output', el), column.output);
  qs('.smol-output-row', el).hidden = !column.output && column.state !== 'generating';

}

function probeRow(name) {
  let row = qs(`[data-check="${name}"]`, refs.probe);
  if (!row) {
    row = document.createElement('tr');
    row.setAttribute('data-check', name);
    row.setAttribute('data-check-status', 'running');
    const nameCell = document.createElement('td'); nameCell.textContent = name;
    const statusCell = document.createElement('td'); statusCell.className = 'probe-status';
    const valueCell = document.createElement('td'); valueCell.className = 'probe-value';
    const actionCell = document.createElement('td');
    if (!name.startsWith('seed')) {
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'btn-ghost btn-small';
      btn.dataset.action = 'probe-rerun'; btn.dataset.name = name;
      btn.textContent = t('probeRerun');
      actionCell.appendChild(btn);
    }
    row.append(nameCell, statusCell, valueCell, actionCell);
    qs('#probe-rows').appendChild(row);
  }
  return row;
}

function setProbeRow(name, status, value) {
  const row = probeRow(name);
  row.setAttribute('data-check-status', status);
  row.setAttribute('data-check-value', value || '');
  row.children[1].textContent = status;
  row.children[2].textContent = value || '';
}

function updateProbeCounts(running) {
  const rows = qsa('[data-check]', refs.probe);
  const pass = rows.filter((r) => r.getAttribute('data-check-status') === 'pass').length;
  const fail = rows.filter((r) => r.getAttribute('data-check-status') === 'fail').length;
  setAttr(refs.probe, 'data-probe-pass', pass);
  setAttr(refs.probe, 'data-probe-fail', fail);
  setAttr(refs.probe, 'data-probe-status', running ? 'running' : (fail > 0 ? 'fail' : 'pass'));
}

async function runProbe(name) {
  refs.probe.hidden = false;
  const all = App.probeChecks;
  const selected = !name ? all : all.filter((c) => c.name === name || (name === 'classifier' && c.name.startsWith('classifier-')));
  if (name && selected.length === 0) throw new Error(`Nieznana kontrola: ${name}`);
  updateProbeCounts(true);
  setAttr(refs.probe, 'data-probe-status', 'running');
  const results = [];
  for (const check of selected) {
    setProbeRow(check.name, 'running', '');
    let result;
    try {
      result = await check.fn();
    } catch (err) {
      result = { ok: false, value: `wyjątek: ${err && err.message}` };
    }
    setProbeRow(check.name, result.ok ? 'pass' : 'fail', result.value);
    results.push({ name: check.name, ok: result.ok, value: result.value });
    await new Promise((r) => setTimeout(r, 0));
  }
  updateProbeCounts(false);
  return name && results.length === 1 ? results[0] : results;
}

function isTypingTarget(target) {
  if (!target || !target.tagName) return false;

}

function renderTokenChips(box, tokens, appendedFrom) {
  box.textContent = '';
  const vocab = App.data.vocab;
  tokens.forEach((tok, i) => {
    let cls = '';
    const known = vocab.index.has(tok) || vocab.lower.has(tok.toLowerCase());
    if (!known) cls += ' unknown';
    if (i >= appendedFrom) cls += ' appended';
    box.appendChild(makeTokenChip(known ? tok : `${tok} → ${TOKEN_UNK}`, null, cls));
  });
}
