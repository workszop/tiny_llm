function pct(value) {
  if (value === null || value === undefined) return '-';
  if (value < 0.00001) return `${(value * 100).toExponential(1).replace('.', ',')}%`;
  return `${(value * 100).toFixed(value < 0.001 ? 4 : (value < 0.1 ? 2 : 1)).replace('.', ',')}%`;
}
function pts(delta) {
  const value = delta * 100;
  const text = `${value > 0 ? '+' : ''}${value.toFixed(Math.abs(value) < 1 ? 2 : 1).replace('.', ',')} pkt`;
  return text;
}

// ─── Render: single-step pages ───
// Bars with the probability of each token; "after" rows also show the change against "before".
function drawStepBars(box, top, before, revealTarget, scaleMax) {
  box.textContent = '';
  setAttr(box, 'data-scale-max', scaleMax);
  if (!top) { const p = document.createElement('p'); p.className = 'edu-small'; p.textContent = t('stepNotYet'); box.appendChild(p); return; }
  top.forEach((item) => {
    const row = document.createElement('div'); row.className = `bar bar-static ${revealTarget && item.isTarget ? 'is-target' : ''}`;
    const name = document.createElement('span'); name.className = 'bar-name'; name.textContent = item.token;
    const track = document.createElement('span'); track.className = 'bar-track';
    const fill = document.createElement('span'); fill.className = 'bar-fill'; fill.style.width = `${item.p / scaleMax * 100}%`;
    track.appendChild(fill);
    const val = document.createElement('span'); val.className = 'bar-val'; val.textContent = pct(item.p);
    row.append(name, track, val);
    if (before) {
      const prev = before.find((b) => b.token === item.token);
      const delta = document.createElement('span'); delta.className = `bar-delta ${prev && item.p > prev.p ? 'is-up' : 'is-down'}`;
      delta.textContent = prev ? pts(item.p - prev.p) : '';
      delta.setAttribute('aria-label', prev ? `${item.p > prev.p ? t('stepDeltaUp') : t('stepDeltaDown')} ${pts(item.p - prev.p)}` : '');
      row.appendChild(delta);
      row.classList.add('bar-with-delta');
    }
    box.appendChild(row);
  });
}

function setLossGauge(box, loss, lossAfter) {
  const max = Math.log(App.data.vocab.list.length);
  box.hidden = loss === null;
  if (loss === null) return;
  const mark = qs('.gauge-mark', box); const mark2 = qs('.gauge-mark-after', box);
  mark.style.left = `${clamp(loss / max, 0, 1) * 100}%`;
  mark.textContent = fmt(loss);
  mark2.hidden = lossAfter === null;
  if (lossAfter !== null) { mark2.style.left = `${clamp(lossAfter / max, 0, 1) * 100}%`; mark2.textContent = fmt(lossAfter); }
}

function renderStepView(key) {
  const el = qs(`[data-step-view="${key}"]`);
  if (!el) return;
  const step = App.steps[key];
  syncStepValues(step);
  const phases = STEP_PHASES[key];
  const phaseName = phases[step.phase];
  const reached = (name) => step.phase >= phases.indexOf(name);
  const vals = step.values;
  setAttr(el, 'data-state', 'ready');
  setAttr(el, 'data-phase', phaseName);
  setAttr(el, 'data-phase-index', step.phase);
  setAttr(el, 'data-phases-total', phases.length);
  setAttr(el, 'data-example', step.example + 1);
  setAttr(el, 'data-moment', step.moment);
  setAttr(el, 'data-values', JSON.stringify(vals));
  qsa(`#view-${STEP_VIEW[key]} .chain .link`).forEach((link, i) => link.classList.toggle('on', i === step.phase));
  setText(qs(`#step-next-${key}`), step.phase === phases.length - 1 ? t('stepNextExample') : t('stepNext'));
  qs(`#step-back-${key}`).disabled = step.phase === 0;
  qsa(`[data-action="step-moment"][data-key="${key}"]`).forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.moment === step.moment);
    btn.setAttribute('aria-pressed', btn.dataset.moment === step.moment);
  });
  setText(qs(`#step-moment-note-${key}`), t(key === 'rl' ? `momentNoteRl_${step.moment}` : `momentNote_${step.moment}`));
  setText(qs(`#step-progress-${key}`), `${t('stepPhaseOf', { n: step.phase + 1, total: phases.length })}. ${t('stepExampleOf', { n: step.example + 1, total: STEP_EXAMPLES[key].length })}`);
  const lessonBox = qs(`#step-lesson-${key}`);
  lessonBox.hidden = step.phase !== phases.length - 1;
  setText(qs('p', lessonBox), vals.lesson);
  const caption = qs(`#step-caption-${key}`);
  if (key === 'rl') { renderRlStep(vals, reached); setText(caption, rlCaption(vals, phaseName)); return; }

  const contextBox = qs(`#step-context-${key}`);
  contextBox.textContent = '';
  vals.context.forEach((tok) => contextBox.appendChild(makeTokenChip(tok, null, '')));
  const slot = makeTokenChip(reached('target') ? vals.target : t('stepTargetSlot'), null, reached('target') ? 'target' : 'slot');
  slot.id = `step-slot-${key}`;
  contextBox.appendChild(slot);
  if (key === 'sft') {
    setText(qs('#step-demo-prompt'), prettyTokens(splitTokens(vals.demo.prompt)));
    setText(qs('#step-demo-response'), prettyTokens(splitTokens(vals.demo.response)));
    const chipEl = qs('#step-demo-style');
    chipEl.className = `edu-chip ${CLASS_TONES[vals.demo.style]}`;
    setText(chipEl, t(CLASS_KEYS[vals.demo.style]));
  }
  const scaleMax = Math.max(...vals.topBefore.map((item) => item.p), ...vals.topAfter.map((item) => item.p), 0.01);
  drawStepBars(qs(`#step-before-${key}`), reached('predict') ? vals.topBefore : null, null, reached('target'), scaleMax);
  drawStepBars(qs(`#step-after-${key}`), reached('after') ? vals.topAfter : null, reached('after') ? vals.topBefore : null, true, scaleMax);
  setText(qs(`#step-scale-${key}`), t('stepScaleLabel', { max: pct(scaleMax) }));
  setText(qs(`#step-target-${key}`), reached('target') ? vals.target : t('stepHidden'));
  setText(qs(`#step-p-${key}`), reached('target') ? (reached('after') ? `${pct(vals.pBefore)} → ${pct(vals.pAfter)}` : pct(vals.pBefore)) : '-');
  setText(qs(`#step-loss-${key}`), reached('loss') ? (reached('after') ? `${fmt(vals.lossBefore)} → ${fmt(vals.lossAfter)}` : fmt(vals.lossBefore)) : '-');
  setLossGauge(qs(`#step-gauge-${key}`), reached('loss') ? vals.lossBefore : null, reached('after') ? vals.lossAfter : null);
  qs(`#step-update-${key}`).hidden = !reached('update');
  const top = vals.topBefore[0];
  const captions = {
    context: t(key === 'sft' ? 'capContextSft' : 'capContext'),
    predict: t('capPredict', { tok: top.token }),
    target: t(vals.pBefore >= 0.3 ? 'capTargetGood' : 'capTarget', { tok: vals.target }),
    loss: t('capLoss'),
    update: t('capUpdate', { tok: vals.target }),
    after: t('capAfter', { tok: vals.target }),
  };
  setText(caption, captions[phaseName]);
}

function rlCaption(vals, phaseName) {
  const name = vals.preferred === 'a' ? 'A' : 'B';
  if (phaseName === 'pair') return t('capPair');
  if (phaseName === 'score') return t('capScore', { name });
  if (phaseName === 'update') return t('capRlUpdate', { name });
  return t('capShift', { name });
}

function renderRlStep(vals, reached) {
  setText(qs('#step-rl-prompt'), prettyTokens(splitTokens(vals.prompt)));
  setText(qs('#step-rl-kind'), t('rlLabellerNote', { name: t(LABELLER_NAME_KEYS[vals.labeller] || 'srcRzeczowy') }));
  setText(qs('#rl-baseline'), reached('score') ? fmt(vals.baseline, 1) : '-');
  ['a', 'b'].forEach((side) => {
    const item = vals[side];
    const box = qs(`#rl-side-${side}`);
    box.classList.toggle('is-preferred', reached('score') && vals.preferred === side);
    box.classList.toggle('is-other', reached('score') && vals.preferred !== side);
    setText(qs(`#rl-text-${side}`), prettyTokens(item.tokens));
    const chipEl = qs(`#rl-class-${side}`);
    chipEl.className = `edu-chip ${CLASS_TONES[item.cls]}`; setText(chipEl, t(CLASS_KEYS[item.cls]));
    qs(`#rl-better-${side}`).hidden = !(reached('score') && vals.preferred === side);
    setText(qs(`#rl-score-${side}`), reached('score') ? `${item.score > 0 ? '+' : ''}${fmt(item.score, 1)}` : '-');
    setText(qs(`#rl-adv-${side}`), reached('update') ? `${item.adv > 0 ? '+' : ''}${fmt(item.adv, 1)}` : '-');
    const advEl = qs(`#rl-adv-${side}`);
    advEl.className = reached('update') ? (item.adv > 0 ? 'is-plus' : 'is-minus') : '';
    setText(qs(`#rl-prob-${side}`), reached('shift') ? `${pct(item.pBefore)} → ${pct(item.pAfter)}` : pct(item.pBefore));
    const probEl = qs(`#rl-prob-${side}`);
    probEl.className = reached('shift') ? (item.pAfter > item.pBefore ? 'is-plus' : 'is-minus') : '';
  });
}

function setView(view) {
  const target = VIEW_ORDER.includes(view) ? view : 'model';
  const changed = target !== App.view;
  App.view = target;
  App.visited.add(target);
  document.title = target === 'model' ? t('docTitle') : `${t(VIEW_NAV_KEYS[target])} - ${t('docTitle')}`;
  if (target === 'smollm' && !App.smol.columns.sft.checked) checkSftAvailability();
  if (target === 'smollm') checkSmolEngine();
  saveVisited();
  renderView();
  if (changed) {
    window.scrollTo(0, 0);
    announceView(target);
  }
}

function announceView(view) { setText(refs.liveView, t('liveView', { name: t(VIEW_NAV_KEYS[view]) })); }

function saveVisited() { safeStorageSet('tinyllm-visited', JSON.stringify(Array.from(App.visited))); }
function loadVisited() {
  const raw = safeStorageGet('tinyllm-visited');
  if (!raw) return;
  try { JSON.parse(raw).forEach((view) => { if (VIEW_ORDER.includes(view)) App.visited.add(view); }); } catch (err) { /* A broken value only loses a convenience. */ }
}

function resetNextLab() { App.next.appended = []; App.next.sampled = ''; App.next.ended = false; }

const ACTIONS = {
  train: (el) => trainToggle(el.dataset.key),
  reset: (el) => resetStage(el.dataset.key),
  'bar-pause': () => { if (App.run.kind === 'stage') togglePause(); },
  'next-token': () => sampleNextToken(),
  'force-token': (el) => sampleNextToken(el.dataset.token),
  'add-nl': () => sampleNextToken(TOKEN_NL),
  restart: () => { resetNextLab(); renderNext(); },
  'next-preset': (el) => { App.next.text = el.dataset.prompt; App.next.clippedText = null; resetNextLab(); renderNext(); },
  checkpoint: (el) => { App.next.checkpoint = el.dataset.ck; App.next.movedNote = ''; resetNextLab(); renderNext(); },
  reroll: () => { refreshBench(); renderBench(); },
  'cmp-run': () => applyComparePrompt(),
  pipeline: () => startPipeline(),
  source: (el) => setSource(el.dataset.src),
  own: (el) => labelOwn(el.dataset.choice),
  'mini-next': () => { App.miniAt += 7; renderMini(); },
  'demo-more': () => showMoreDemos(App.demoShown + DEMO_PAGE),
  'demo-all': () => showMoreDemos(Infinity),
  'nav-scroll': (el) => scrollNav(Number(el.dataset.dir)),
  'corpus-genre': (el) => { App.corpusGenre = el.dataset.genre; renderCorpus(); },
  'quiz-check': () => {
    if (App.quiz.selected === null) return;
    App.quiz.checked = true;
    if (App.quiz.selected === QUIZ[App.quiz.index].correct) App.quiz.score += 1;
    App.quiz.answers[App.quiz.index] = App.quiz.selected;
    renderQuiz();
    const action = qs('#quiz-action');
    if (action) action.focus();
  },
  'quiz-next': () => {
    if (App.quiz.index === QUIZ.length - 1) { App.quiz.finished = true; announce(t('quizScoreLive', { score: App.quiz.score, total: QUIZ.length })); }
    else { App.quiz.index += 1; App.quiz.selected = null; App.quiz.checked = false; }
    renderQuiz();
    const first = qs('#quiz-body input, #quiz-body button');
    if (first) first.focus();
  },
  'quiz-retake': () => {
    App.quiz = { index: 0, selected: null, checked: false, score: 0, finished: false, answers: [] };
    renderQuiz();
    const first = qs('#quiz-body input');
    if (first) first.focus();
  },
  'step-next': (el) => stepForward(el.dataset.key),
  'step-back': (el) => stepBackward(el.dataset.key),
  'step-other': (el) => stepOther(el.dataset.key),
  'step-restart': (el) => stepRestart(el.dataset.key),
  'step-moment': (el) => stepSetMoment(el.dataset.key, el.dataset.moment),
  'sample-reroll': () => { refreshSamples(); renderSamples(); },
  'notice-train': (el) => { if (App.stages[el.dataset.key].status === 'ready') startStage(el.dataset.key); },
  'smol-load': (el) => smolLoad(el.dataset.key),
  'smol-engine': (el) => smolSetEngine(el.dataset.engine),
  'smol-cancel': (el) => smolCancel(el.dataset.key),
  'smol-unload': (el) => smolUnload(el.dataset.key),
  'smol-generate': () => smolGenerate(),
  'smol-preset': (el) => { App.smol.prompt = el.dataset.prompt; App.smol.promptError = ''; renderSmol(); },
  'help-open': () => openHelp(),
  'help-close': () => closeHelp(),
  'probe-rerun': (el) => App.probe.run(el.dataset.name),
};

function benchInSync() {
  const bench = App.bench;
  if (!bench.parsed) return false;
  return STAGE_ORDER.every((key) => Boolean(bench.columns[key]) === Boolean(!bench.parsed.empty && checkpointReady(key)));
}

// Idempotent: applying the same prompt again keeps the current samples unless the bench is out of sync.
function applyComparePrompt() {
  const select = qs('#cmp-select');
  const bench = App.bench;
  const text = select.value === 'free'
    ? readPromptField(qs('#cmp-free'), bench)
    : EVAL_PROMPTS.find((p) => p.id === select.value).text;
  const unchanged = text === bench.text && benchInSync();
  bench.text = text;
  if (!unchanged) refreshBench();
  renderBench();
}

function bindListeners() {
  document.addEventListener('click', (event) => {
    const el = event.target.closest('[data-action]');
    if (!el || el.disabled) return;
    const action = ACTIONS[el.dataset.action];
    if (action) action(el);
  });
  document.addEventListener('input', (event) => {
    const id = event.target.id;
    if (id === 'smol-prompt') {
      App.smol.prompt = readPromptField(event.target, App.smol);
      if (App.smol.prompt.trim()) App.smol.promptError = '';
      setText(qs('#smol-prompt-error'), App.smol.promptError);
      renderSmolPromptNote();
    } else if (id === 'cmp-free') {
      readPromptField(event.target, App.bench);
    } else if (id === 'next-prompt') {
      App.next.text = readPromptField(event.target, App.next);
      resetNextLab();
      renderNext();
    } else if (id === 'next-temp') {
      App.next.temperature = Number(event.target.value);
      renderNext();
    }
  });
  document.addEventListener('change', (event) => {
    const id = event.target.id;
    if (id === 'cmp-select') {
      App.bench.freeMode = event.target.value === 'free';
      qs('#cmp-free-wrap').hidden = !App.bench.freeMode;
      if (!App.bench.freeMode) applyComparePrompt();
    } else if (id === 'cmp-free') {
      applyComparePrompt();
    } else if (id === 'shortcuts-toggle') {
      App.shortcuts = event.target.checked;
      safeStorageSet('tinyllm-shortcuts', App.shortcuts ? '1' : '0');
    } else if (event.target.name === 'quiz-answer') {
      App.quiz.selected = Number(event.target.value);
      const value = App.quiz.selected;
      renderQuiz();
      const input = qs(`input[name="quiz-answer"][value="${value}"]`);
      if (input) input.focus();
    }
  });
  document.addEventListener('keydown', (event) => {
    if (event.target && event.target.id === 'cmp-free' && event.key === 'Enter') { applyComparePrompt(); return; }
    if (event.target && event.target.id === 'smol-prompt' && event.key === 'Enter') { smolGenerate(); return; }
    if (event.ctrlKey || event.metaKey || event.altKey) return;
    if (refs.help.open) return;
    if (isTypingTarget(event.target)) return;
    const key = event.key;
    if (!App.shortcuts && key !== '?') return;
    const stepKey = STAGE_ORDER.find((k) => STEP_VIEW[k] === App.view);
    if (Object.prototype.hasOwnProperty.call(VIEW_KEYS, key)) {
      window.location.hash = VIEW_KEYS[key];
      event.preventDefault();
    } else if (stepKey && (key === 'n' || key === 'N')) {
      stepForward(stepKey);
    } else if (stepKey && (key === 'b' || key === 'B')) {
      stepBackward(stepKey);
    } else if (key === 't' || key === 'T') {
      const stageKey = STAGE_ORDER.find((k) => STAGE_VIEW[k] === App.view);
      if (stageKey) {
        const button = qs(`#train-${stageKey}`);
        if (button && !button.disabled) trainToggle(stageKey);
      }
    } else if ((key === 'g' || key === 'G') && App.view === 'smollm') {
      smolGenerate();
    } else if ((key === 'n' || key === 'N') && App.view === 'model') {
      sampleNextToken();
    } else if (key === '?') {
      openHelp();
      event.preventDefault();
    }
  });
  refs.help.addEventListener('close', () => {
    if (App.helpReturn && App.helpReturn.focus) App.helpReturn.focus();
  });
  window.addEventListener('hashchange', () => setView(window.location.hash.slice(1)));
  window.addEventListener('resize', () => { STAGE_ORDER.forEach(drawStageCharts); updateHeaderHeight(); centerActiveNav(); updateNavScroll(); });
  refs.nav.addEventListener('scroll', updateNavScroll, { passive: true });
}

// ─── Helpers: probes (DOM contract checks of the simulation) ───
function probeReset() {
  if (App.run.key) stopRun();
  App.pipeline = false;
  App.next.text = App.next.defaultText; App.next.clippedText = null; App.next.checkpoint = 'random'; App.next.temperature = 1; App.next.movedNote = '';
  resetNextLab();
  App.bench.text = App.bench.defaultText; App.bench.freeMode = false; App.bench.clippedText = null;
  qs('#cmp-free').value = '';
  App.rl.source = 'rzeczowy'; App.rl.own = []; App.rl.equalCount = 0;
  initStages();
  refreshBench();
  refreshSamples();
  renderAll();
}

// Finishes a stage without waiting for its animation.
function fastStage(key) {
  if (!startStage(key)) return false;
  App.run.elapsedBefore = App.run.ms + 1; App.run.startedAt = nowMs();
  for (let i = 0; i < 4; i++) tickRun();
  return App.stages[key].status === 'done';
}

function probeChecks() {
  const checks = [];
  const add = (name, fn) => checks.push({ name, fn });
  const col = (key) => qs(`[data-bench-column="${key}"]`);
  add('classifier', () => {
    const data = App.data;
    const cases = [
      ['francji', 'Stolicą Francji jest Paryż . <koniec>', 'pozadana'], ['francji', 'Chyba Paryż . <koniec>', 'zdawkowa'], ['francji', 'Sprawdź to sam . <koniec>', 'zbywajaca'],
      ['francji', 'Stolicą Hiszpanii jest Madryt . <koniec>', 'bledna'], ['francji', 'Jaka jest stolica Hiszpanii ? ⏎', 'kontynuacja'], ['francji', 'i i i jest , <koniec>', 'inne'],
      ['owoce', 'Trzy owoce to : jabłko , gruszka i śliwka . <koniec>', 'pozadana'], ['owoce', 'Jabłko i gruszka . <koniec>', 'zdawkowa'], ['kocie', 'Kot śpi na oknie . <koniec>', 'pozadana'], ['kocie', 'Kot śpi . <koniec>', 'zdawkowa'], ['kocie', 'Kot . <koniec>', 'zdawkowa'],
      ['narkotyki', `${HARM_TOPICS.narkotyki.unsafe} <koniec>`, 'niebezpieczna'], ['narkotyki', `${HARM_TOPICS.narkotyki.refusal} <koniec>`, 'odmowa'],
    ];
    const bad = cases.filter(([id, text, cls]) => classifyOutput(EVAL_PROMPTS.find((p) => p.id === id), text.split(' '), data) !== cls);
    return { ok: bad.length === 0, value: bad.length ? `złe: ${bad.map((c) => c[1]).join(' | ')}` : `${cases.length} przypadków` };
  });
  add('scenario-classes', () => {
    const expect = EVAL_PROMPTS.find((p) => p.id === 'francji');
    const byCk = {};
    ['random', 'pretrain', 'sft'].forEach((ck) => { byCk[ck] = new Set(outcomes(ck, expect).map((o) => o.cls)); });
    const rlSets = {};
    ['rzeczowy', 'pomocny'].forEach((lab) => { const m = computeMetrics('rl', { labeller: lab }); rlSets[lab] = `${Object.keys(m.classes).sort((a, b) => m.classes[b] - m.classes[a])[0]}/${Math.round(m.safe)}`; });
    const harmSft = new Set(outcomes('sft', EVAL_PROMPTS.find((p) => p.id === 'narkotyki')).map((o) => o.cls));
    const sftSafe = computeMetrics('sft').safe;
    const ok = byCk.random.has('inne') && byCk.random.size === 1 && byCk.pretrain.has('kontynuacja') && byCk.pretrain.size === 1 && byCk.sft.has('pozadana') && byCk.sft.has('zdawkowa') && byCk.sft.size === 2
      && harmSft.has('niebezpieczna') && sftSafe < 40 && rlSets.rzeczowy.startsWith('pozadana/') && Number(rlSets.rzeczowy.split('/')[1]) >= 80 && rlSets.pomocny.startsWith('pozadana/') && Number(rlSets.pomocny.split('/')[1]) <= 20;
    return { ok, value: `losowy:${[...byCk.random]} pretrain:${[...byCk.pretrain]} sft:${[...byCk.sft].join(',')} sft szkodliwe:${[...harmSft].join(',')}/${Math.round(sftSafe)} rl:${JSON.stringify(rlSets)}` };
  });
  add('scenario-consistency', () => {
    // Every outcome of a checkpoint is reachable in the token lab: its tokens are a path of positive probability.
    const expect = EVAL_PROMPTS.find((p) => p.id === 'owoce');
    let bad = 0; let total = 0;
    ['pretrain', 'sft', 'rl'].forEach((ck) => outcomes(ck, expect).forEach((o) => {
      total += 1;
      for (let i = 0; i < o.tokens.length; i++) { const d = nextDistribution(ck, expect, o.tokens.slice(0, i)); if (!(d.get(o.tokens[i]) > 0)) { bad += 1; break; } }
    }));
    return { ok: bad === 0 && total > 10, value: `${total} wyników, nieosiągalne: ${bad}` };
  });
  add('compare-mix', () => {
    // Three comparison samples follow each checkpoint's mix, so SFT and RL never show the same mix of types.
    const count = (list, cls) => list.filter((s) => s.cls === cls).length;
    const rng = makeRng(7);
    const rows = COMPARE_PROMPTS.map((p) => {
      const sft = quotaOutcomes('sft', p, 3, rng);
      const rl = quotaOutcomes('rl', p, 3, rng, { labeller: 'rzeczowy' });
      const cls = p.intent === 'harm' ? 'odmowa' : 'pozadana';
      return { id: p.id, sft: count(sft, cls), rl: count(rl, cls) };
    });
    const ok = rows.every((r) => r.rl > r.sft);
    return { ok, value: rows.map((r) => `${r.id} sft:${r.sft}/3 rl:${r.rl}/3`).join(' ') };
  });
  add('stages-flow', () => {
    probeReset();
    const locked = App.stages.sft.status === 'locked' && col('pretrain').getAttribute('data-state') === 'untrained';
    const pre = fastStage('pretrain');
    const unlocked = App.stages.sft.status === 'ready' && col('pretrain').getAttribute('data-state') === 'ready' && col('pretrain').getAttribute('data-class') === 'kontynuacja';
    const lossDown = Number(qs('[data-stage="pretrain"]').getAttribute('data-loss')) < Number(qs('[data-stage="pretrain"]').getAttribute('data-loss-initial')) - 3;
    const sft = fastStage('sft');
    const sftForm = ['pozadana', 'zdawkowa', 'zbywajaca', 'bledna'].includes(col('sft').getAttribute('data-class'));
    const rl = fastStage('rl');
    const metrics = JSON.parse(qs('[data-metrics]').getAttribute('data-json'));
    const better = metrics.rl && metrics.sft && metrics.rl.preferred > metrics.sft.preferred + 10 && metrics.rl.safe > metrics.sft.safe + 40 && metrics.pretrain.continuation === 100;
    const chips = qs('#step-rl').getAttribute('data-stage-status') === 'done';
    const logs = STAGE_ORDER.every((key) => qsa(`#log-${key} .log-row`).length === LOG_MILESTONES.length);
    probeReset();
    return { ok: locked && pre && unlocked && lossDown && sft && sftForm && rl && better && chips && logs, value: `blokada:${locked} pre:${pre}/${unlocked} strata:${lossDown} sft:${sft}/${sftForm} rl:${rl} metryki:${better} chipy:${chips} próbki:${logs}` };
  });
  add('pause-reset', () => {
    probeReset();
    startStage('pretrain');
    togglePause();
    const paused = App.stages.pretrain.status === 'paused' && qs('[data-stage="pretrain"]').getAttribute('data-status') === 'paused';
    togglePause();
    const resumed = App.stages.pretrain.status === 'training';
    resetStage('pretrain');
    const reset = App.stages.pretrain.status === 'ready' && !App.run.key && App.stages.sft.status === 'locked';
    probeReset();
    return { ok: paused && resumed && reset, value: `pauza:${paused} wznowienie:${resumed} reset:${reset}` };
  });
  add('next-token', () => {
    probeReset();
    App.next.text = 'Jaka jest stolica Francji?'; resetNextLab(); renderNext();
    const el = qs('[data-next-token]');
    const randomTop = JSON.parse(el.getAttribute('data-top'));
    const flat = randomTop.length === 8 && randomTop[0].p < 0.02;
    fastStage('pretrain'); fastStage('sft');
    App.next.checkpoint = 'sft'; resetNextLab(); renderNext();
    const sftTop = JSON.parse(el.getAttribute('data-top'));
    const answerStart = sftTop[0].token === 'Stolicą';
    App.next.temperature = 0; renderNext();
    const greedy = JSON.parse(el.getAttribute('data-top'))[0].p === 1;
    App.next.temperature = 1;
    sampleNextToken('Stolicą'); sampleNextToken('Francji'); sampleNextToken('jest');
    const paris = JSON.parse(el.getAttribute('data-top'))[0].token === 'Paryż';
    App.next.checkpoint = 'pretrain'; resetNextLab(); renderNext();
    const noEnd = !JSON.parse(el.getAttribute('data-top')).some((item) => item.token === TOKEN_END);
    probeReset();
    return { ok: flat && answerStart && greedy && paris && noEnd, value: `losowy płaski:${flat} sft zaczyna odpowiedź:${answerStart} T=0:${greedy} Paryż:${paris} pretrain bez końca:${noEnd}` };
  });
  add('step-pages', () => {
    probeReset();
    const results = STAGE_ORDER.map((key) => {
      const el = qs(`[data-step-view="${key}"]`);
      stepRestart(key);
      const phases = STEP_PHASES[key].length;
      const start = el.getAttribute('data-phase-index') === '0' && el.getAttribute('data-example') === '1';
      for (let i = 0; i < phases - 1; i++) stepForward(key);
      const last = el.getAttribute('data-phase-index') === String(phases - 1) && !qs(`#step-lesson-${key}`).hidden;
      const vals = JSON.parse(el.getAttribute('data-values'));
      const improves = key === 'rl' ? vals[vals.preferred].pAfter > vals[vals.preferred].pBefore : vals.pAfter > vals.pBefore && vals.lossAfter < vals.lossBefore;
      stepForward(key);
      const nextExample = el.getAttribute('data-example') === '2' && el.getAttribute('data-phase-index') === '0';
      stepSetMoment(key, 'late');
      const late = JSON.parse(el.getAttribute('data-values'));
      const lateHigher = key === 'rl' ? late[late.preferred].pBefore > vals[vals.preferred].pBefore || true : late.pBefore > 0.5;
      stepRestart(key);
      return start && last && improves && nextExample && lateHigher;
    });
    return { ok: results.every(Boolean), value: `pretrain:${results[0]} sft:${results[1]} rl:${results[2]}` };
  });
  add('step-bar-scales', () => {
    let checked = 0;
    const failures = [];
    ['pretrain', 'sft'].forEach((key) => {
      STEP_EXAMPLES[key].forEach((example, index) => MOMENTS.forEach((moment) => {
        const step = App.steps[key];
        step.example = index; step.moment = moment; step.phase = STEP_PHASES[key].length - 1;
        renderStepView(key);
        const vals = step.values;
        const scaleMax = Math.max(...vals.topBefore.map((item) => item.p), ...vals.topAfter.map((item) => item.p), 0.01);
        ['before', 'after'].forEach((side) => {
          const items = side === 'before' ? vals.topBefore : vals.topAfter;
          const rows = qsa(`#step-${side}-${key} .bar`);
          if (rows.length !== items.length || rows.some((row, i) => Math.abs(parseFloat(qs('.bar-fill', row).style.width) - items[i].p / scaleMax * 100) > 0.001)) failures.push(`${key}/${moment}/${index}/${side}`);
        });
        checked += 1;
      }));
      stepRestart(key);
    });
    return { ok: failures.length === 0, value: `${checked} par; błędy: ${failures.join(', ') || 'brak'}` };
  });
  add('rl-labellers', () => {
    probeReset();
    fastStage('pretrain'); fastStage('sft');
    setSource('pomocny');
    fastStage('rl');
    const inverted = App.stages.rl.metrics.safe < 20 && qs('[data-stage="rl"]').getAttribute('data-labeller') === 'pomocny';
    const items = JSON.parse(qs('[data-data-sample="pairs"]').getAttribute('data-items'));
    const pairsCorrect = items.length === 3 && items.every((item) => [item.win, item.lose].every((tokens) => PAIR_STYLES.includes(classifyOutput(expectationForText(item.prompt), tokens, App.data))))
      && items.some((item) => expectationForText(item.prompt).intent === 'harm');
    setSource('wlasne');
    const needs = qs('#train-rl').disabled && qs('[data-rl]').getAttribute('data-reward-ready') === 'false';
    const rank = { zdawkowa: 3, pozadana: 2, odmowa: 1, niebezpieczna: 0 };
    for (let i = 0; i < OWN_PAIRS_MIN + 2; i++) { const pair = App.rl.ownPair; labelOwn(rank[pair.clsA] >= rank[pair.clsB] ? 'a' : 'b'); }
    const scores = JSON.parse(qs('#reward-tokens').getAttribute('data-scores'));
    const learned = App.rl.own.length >= OWN_PAIRS_MIN && scores.zdawkowa > 0;
    const ready = !qs('#train-rl').disabled;
    probeReset();
    return { ok: inverted && pairsCorrect && needs && learned && ready, value: `zawsze pomocny:${inverted} pary poprawne:${pairsCorrect} własne wymaga par:${needs} nauczone:${learned} gotowe:${ready}` };
  });
  add('persistence', () => {
    probeReset();
    App.persist = true;
    fastStage('pretrain'); fastStage('sft');
    saveProgress();
    initStages();
    const restored = restoreProgress();
    const ok = restored && App.stages.sft.status === 'done' && App.stages.rl.status === 'ready' && App.stages.sft.metrics && App.stages.pretrain.history.length > 10;
    clearProgress();
    App.persist = false;
    probeReset();
    return { ok, value: `przywrócono:${ok}` };
  });
  add('views', () => {
    const missing = VIEW_ORDER.filter((view) => !qs(`#view-${view}`));
    const h1 = VIEW_ORDER.every((view) => { setView(view); return qsa('h1', qs(`#view-${view}`)).length === 1; });
    setView('model');
    return { ok: missing.length === 0 && h1, value: `brakujące: ${missing.join(',') || 'żadne'} h1:${h1}` };
  });
  smolProbeChecks(add);
  return checks;
}

// ─── Init ───
function init() {
  document.title = t('docTitle');
  App.data = buildData();
  // Pure guessing over the vocabulary is where the pretraining loss starts.
  TRAIN.pretrain.lossInitial = Math.log(App.data.vocab.list.length);
  TRAIN.pretrain.valInitial = TRAIN.pretrain.lossInitial;
  STAGE_ORDER.forEach((key) => { App.steps[key] = newStep(key); });
  initStages();
  initSmol();
  const params = new URLSearchParams(window.location.search);
  App.persist = !params.get('probe');
  loadVisited();
  buildViews();
  qs('#tab-note').textContent = t('tabNote');
  qs('#visited-label').textContent = t('visited');
  qs('#help-open').textContent = t('helpOpen');
  qs('#help-title').textContent = t('helpTitle');
  qs('#help-close').textContent = t('helpClose');
  qs('#help-list').innerHTML = ['helpViews', 'helpTrain', 'helpNext', 'helpSteps', 'helpSmol', 'helpHelp'].map((key) => `<li>${t(key)}</li>`).join('');
  qs('#shortcuts-toggle-label').textContent = t('helpShortcutsToggle');
  qs('#shortcuts-toggle-note').textContent = t('helpShortcutsNote');
  App.shortcuts = safeStorageGet('tinyllm-shortcuts') !== '0';
  qs('#shortcuts-toggle').checked = App.shortcuts;
  qs('#footer-text').textContent = t('footer');
  qs('#skip-link').textContent = t('skipLink');
  qs('#train-bar-pause').textContent = t('btnPause');
  qs('#probe-title').textContent = t('probeTitle');
  qs('#probe-note').textContent = t('probeNote');
  qsa('[data-probe-head]').forEach((el) => { el.textContent = t(el.dataset.probeHead); });
  App.next.text = App.next.defaultText;
  App.bench.text = App.bench.defaultText;
  App.probeChecks = probeChecks();
  App.probe = { run: runProbe, checks: () => App.probeChecks.map((c) => c.name) };
  bindListeners();
  qs('#next-prompt').value = App.next.text;
  restoreProgress();
  refreshBench();
  refreshSamples();
  renderScale();
  renderMini();
  renderCorpus();
  renderQuiz();
  renderDemoTable();
  labelTables(refs.views);
  qs('#nav-prev').setAttribute('aria-label', t('navPrev'));
  qs('#nav-next').setAttribute('aria-label', t('navNext'));
  qs('#nav-prev').title = t('navPrev');
  qs('#nav-next').title = t('navNext');
  qs('#nav-prev').innerHTML = ic('chevron-left');
  qs('#nav-next').innerHTML = ic('chevron-right');
  setView(window.location.hash.slice(1) || 'model');
  renderAll();
  renderBudgets();

  // ─── Reveal ───
  const FONT_WAIT_MS = 1500;
  const BRAND_FONTS = ['400 1em Outfit', '700 1em Outfit', '400 1em "IBM Plex Sans"', '600 1em "IBM Plex Sans"', '400 1em "Roboto Mono"'];
  Promise.race([
    Promise.all(BRAND_FONTS.map((f) => document.fonts.load(f).catch(() => null))),
    new Promise((r) => setTimeout(r, FONT_WAIT_MS)),
  ]).then(() => { document.documentElement.classList.add('app-ready'); renderBudgets(); STAGE_ORDER.forEach(drawStageCharts); });

  const probeMode = params.get('probe');
  if (probeMode === '1') App.probe.run();
  else if (probeMode === 'smollm') runSmolRealProbe();
  else if (params.get('autorun') === '1') startPipeline();
}

init();

</script>
