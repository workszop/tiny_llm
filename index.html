<style>
/* ============================================================
   edulab - Colors & Type foundation
   Fonts (Outfit, IBM Plex Sans, Roboto Mono) load from Google Fonts
   via the <link> tags in tokens/head.html - paste that into <head>.
   No @import here: it chains requests and blocks rendering.
   ============================================================ */

:root {
  /* ---- Brand fonts ---- */
  --font-display: 'Outfit', 'IBM Plex Sans', system-ui, sans-serif;
  --font-sans:    'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --font-mono:    'Roboto Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* ============================================================
     RAW COLOR TOKENS
     ============================================================ */

  /* Paper - page background is white; the stone steps are bands / wells.
     Warm neutral grey (no yellow cast) so yellow and the colour blocks stay the
     loudest thing on the page. Stone v2 (2026-10-10) replaced the cream sand
     (#FBF7E6 / #F5EDCB), which at 1.07:1 on white did not read as a surface. */
  --paper:    #FFFFFF;   /* page background (white)                       */
  --paper-2:  #F5F3F0;   /* stone band: alternating sections, card heads   */
  --paper-3:  #EAE6E0;   /* deepest stone: wells, table heads, bar tracks  */
  --surface:  #FFFFFF;   /* cards & sheets                                */

  /* Ink - warm near-black text & lines */
  --ink:      #1C1917;   /* primary text                                    */
  --ink-2:    #44403C;   /* secondary text, 10.3:1 on white                 */
  --ink-3:    #625B53;   /* muted / placeholder: >= 4.5:1 on every paper step */
  --line:     #E0DBD3;   /* hairline: dividers, table rows, card heads      */
  --line-2:   #C9C2B7;   /* stronger: card contours, section rules          */
  --line-strong: #857C69;/* control boundaries (inputs, ghost buttons,
                            answer options): >= 3:1 on paper steps (WCAG 1.4.11) */

  /* ---- Brand: Yellow main · Blue + Green secondary · Red danger ----
     Plain saturated colours. The base colour (--blue) is for large fills,
     illustrations and large text (>= 24px, or 19px bold). "-soft" is the
     solid fill for chips and panels that carry small text: it is the
     AA shade (= "-600"), so its "-ink" (white; dark ink on yellow) reaches
     4.5:1. A colour used AS text goes only on white and uses "-600".
     Never colour-on-colour (no green text on green).
     Gate: python3 scripts/check-contrast.py */

  /* Yellow - primary (buttons, progress, values on dark panels) */
  --yellow:      #FFD500;
  --yellow-600:  #F0C800;  /* hover / press          */
  --yellow-soft: #FFD500;  /* chip / panel fill      */
  --yellow-ink:  #1C1917;  /* text on yellow         */

  /* Blue - secondary (panels, chips, correct / selected state) */
  --blue:      #1E8FC2;
  --blue-600:  #177AA8;
  --blue-soft: #177AA8;   /* = blue-600, white text 4.8:1 */
  --blue-ink:  #FFFFFF;

  /* Green - secondary support (chips, success) */
  --green:      #00A651;
  --green-600:  #078342;  /* hover / press, AA text shade */
  --green-soft: #078342;  /* = green-600, white text 4.9:1 */
  --green-ink:  #FFFFFF;

  /* Red - danger / important / wrong (use sparingly) */
  --red:      #E5322D;
  --red-600:  #C92823;
  --red-soft: #C92823;   /* = red-600, white text 5.5:1 */
  --red-ink:  #FFFFFF;

  /* Grape - 5th category tone (colour-coded groups), from the play palette */
  --grape:      #7A5AC2;
  --grape-soft: #7A5AC2;  /* white text 5.2:1 */
  --grape-ink:  #FFFFFF;

  /* Legacy role aliases - older edulab apps use these names */
  --marigold: var(--yellow); --marigold-600: var(--yellow-600); --marigold-soft: var(--yellow-soft); --marigold-ink: var(--yellow-ink);
  --teal:     var(--blue);   --teal-600:     var(--blue-600);   --teal-soft:     var(--blue-soft);   --teal-ink:     var(--blue-ink);
  --sky:      var(--green);                                     --sky-soft:      var(--green-soft);  --sky-ink:      var(--green-ink);
  --coral:    var(--red);    --coral-600:    var(--red-600);    --coral-soft:    var(--red-soft);    --coral-ink:    var(--red-ink);

  /* Play palette - subject/category colours in the kids app */
  --play-sun:    #FFD500;
  --play-grass:  #00A651;
  --play-berry:  #C6478B;
  --play-grape:  #7A5AC2;
  --play-sky:    #1E8FC2;
  --play-coral:  #E5322D;

  /* ---- Semantic ---- */
  --success:      #00A651;  --success-soft: #078342;  --success-ink: #FFFFFF;
  --warning:      #FFD500;  --warning-soft: #FFD500;  --warning-ink: #1C1917;
  --danger:       #E5322D;  --danger-soft:  #C92823;  --danger-ink:  #FFFFFF;
  --info:         #1E8FC2;  --info-soft:    #177AA8;  --info-ink:    #FFFFFF;

  /* ---- Functional aliases ---- */
  --bg:        var(--paper);
  --fg:        var(--ink);
  --fg-muted:  var(--ink-2);
  --primary:   var(--yellow);
  --on-primary:#1C1917;      /* dark text on yellow */
  /* White gap + ink band: >= 3:1 on paper, sand, yellow and every chip fill.
     Pair with `outline: 3px solid transparent` so forced-colours mode still shows focus. */
  --focus-ring: 0 0 0 2px var(--paper), 0 0 0 5px var(--ink);
  /* Range-slider track */
  --track: color-mix(in srgb, var(--ink) 24%, transparent);

  /* ============================================================
     SPACING  (4pt base)
     ============================================================ */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
  --sp-12: 48px; --sp-16: 64px; --sp-20: 80px; --sp-24: 96px;

  /* ---- Radii (friendly, generous) ---- */
  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-pill: 999px;

  /* ---- Elevation - warm, low, soft ---- */
  --shadow-sm: 0 1px 2px rgba(33,30,26,.10), 0 2px 6px rgba(33,30,26,.06);
  --shadow-md: 0 6px 18px rgba(33,30,26,.12), 0 1px 3px rgba(33,30,26,.08);
  --shadow-lg: 0 16px 40px rgba(33,30,26,.12), 0 3px 8px rgba(33,30,26,.06);
  --shadow-primary:  0 8px 22px color-mix(in srgb, var(--yellow) 30%, transparent);
  --shadow-marigold: var(--shadow-primary);   /* legacy alias */

  /* ============================================================
     TYPE SCALE (semantic sizes)
     ============================================================ */
  --display-font:  clamp(48px, 6vw, 72px);
  --h1: 44px; --h2: 33px; --h3: 25px; --h4: 19px;
  --body-lg: 18px; --body: 16px; --body-sm: 14px;
  --caption: 13px; --overline: 12px;
}

/* ============================================================
   SEMANTIC ELEMENT STYLES
   Apply via element selectors or .edu-prose wrapper.
   Element defaults are wrapped in :where(.edu) (zero specificity) so any
   single class wins: <p class="edu-overline">, <p class="edu-small">,
   <h1 class="app-title"> keep their own font/size instead of the element default.
   ============================================================ */

.edu-display, :where(.edu) h1.display {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--display-font);
  line-height: 1.02;
  letter-spacing: -0.025em;
  color: var(--ink);
}
:where(.edu) h1, .edu-h1 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h1);
  line-height: 1.06; letter-spacing: -0.02em; color: var(--ink);
}
:where(.edu) h2, .edu-h2 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h2);
  line-height: 1.12; letter-spacing: -0.015em; color: var(--ink);
}
:where(.edu) h3, .edu-h3 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h3);
  line-height: 1.2; letter-spacing: -0.01em; color: var(--ink);
}
:where(.edu) h4, .edu-h4 {
  font-family: var(--font-sans);
  font-weight: 700; font-size: var(--h4);
  line-height: 1.3; color: var(--ink);
}
:where(.edu) p, .edu-p, .edu-body {
  font-family: var(--font-sans);
  font-weight: 400; font-size: var(--body);
  line-height: 1.6; color: var(--ink-2);
}
.edu-body-lg { font-family: var(--font-sans); font-size: var(--body-lg); line-height: 1.6; color: var(--ink-2); }
.edu-small  { font-family: var(--font-sans); font-size: var(--body-sm); line-height: 1.5; color: var(--ink-2); }
.edu-caption{ font-family: var(--font-sans); font-size: var(--caption); line-height: 1.45; color: var(--ink-3); }

/* Overline - mono, tracked; functional labels only (never above page/section titles) */
.edu-overline {
  font-family: var(--font-mono);
  font-weight: 500; font-size: var(--overline);
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink);
}
:where(.edu) code, .edu-mono {
  font-family: var(--font-mono);
  font-size: 0.92em; color: var(--ink);
  background: var(--paper-3); padding: 0.12em 0.4em; border-radius: var(--r-xs);
}

/* Solid colour blocks (callouts, stat cards, chips): set background: var(--X-soft) and
   color: var(--X-ink) on the block, add .edu-block, and every heading/paragraph inside
   inherits that text colour instead of the default ink. */
.edu-block, .edu-block h1, .edu-block h2, .edu-block h3, .edu-block h4, .edu-block p,
.edu-block li, .edu-block small { color: inherit; }

body.edu { background: var(--paper); color: var(--ink); font-family: var(--font-sans); }

/* ─── App: tokens that are not in the edustyl set ─── */
:root { --gutter: clamp(16px, 4vw, 72px); --header-h: 73px; }

/* ─── Base ─── */
html, body { margin: 0; padding: 0; }
body.edu { font-size: var(--body); overflow-x: hidden; }
*, *::before, *::after { box-sizing: border-box; }
a { color: var(--blue-600); }
:focus-visible { outline: 3px solid transparent; outline-offset: 2px; box-shadow: var(--focus-ring); }
[hidden] { display: none !important; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.skip-link { position: absolute; left: 12px; top: -60px; background: var(--yellow); color: var(--yellow-ink); padding: 10px 14px; border-radius: var(--r-sm); z-index: 60; }
.skip-link:focus { top: 8px; }
button, select, input { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .55; }

/* ─── Chrome ─── */
.edu-header { position: sticky; top: 0; z-index: 50; width: 100%; background: var(--paper); border-bottom: 1px solid var(--line-2); }
.edu-header-inner { padding: 4px var(--gutter); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.edu-logo { width: 64px; height: 64px; display: block; margin-right: -6px; }
.edu-wordmark { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -.02em; color: var(--ink); }
.nav { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; justify-content: flex-end; }
.nav-pill { border-radius: var(--r-pill); padding: 8px 12px; color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: var(--body-sm); transition: background-color .15s; white-space: nowrap; }
.nav-pill:hover { background: var(--paper-2); }
.nav-pill.active { background: var(--yellow); color: var(--yellow-ink); font-weight: 600; }

.stepper { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px var(--gutter); background: var(--paper-2); border-bottom: 1px solid var(--line); }
.stepper-group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.edu-chip { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 4px 10px; border-radius: var(--r-pill); white-space: nowrap; }
.stepper-progress { display: flex; align-items: center; gap: 8px; min-width: 160px; flex: 1; }
.progress-track { flex: 1; height: 8px; border-radius: var(--r-pill); background: var(--paper-3); overflow: hidden; min-width: 60px; }
.progress-track > span { display: block; height: 100%; background: var(--ink); border-radius: var(--r-pill); }
.seed-control { display: flex; align-items: center; gap: 8px; }
.seed-control input { width: 84px; padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); }
.small-label { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink); }

.train-bar { position: sticky; top: var(--header-h); z-index: 40; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 8px var(--gutter); background: var(--ink); color: var(--paper); }
.train-bar .train-label { font-family: var(--font-display); font-weight: 600; }
.train-bar .train-eta { color: var(--yellow); font-family: var(--font-mono); font-size: 12px; }
.train-track { flex: 1; min-width: 100px; height: 8px; background: var(--ink-2); border-radius: var(--r-pill); overflow: hidden; }
.train-track span { display: block; height: 100%; width: 0; background: var(--yellow); }
.train-bar button { background: var(--yellow); color: var(--yellow-ink); border: none; border-radius: var(--r-pill); padding: 6px 14px; font-family: var(--font-display); font-weight: 600; min-height: 40px; }

/* ─── Page structure ─── */
.page-head { padding: 34px var(--gutter) 28px; text-align: left; }
.app-title { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.3rem, 5vw, 3.3rem); letter-spacing: -.025em; line-height: 1.05; color: var(--ink); margin: 0 0 14px; }
.edu-lead { font-size: 1.15rem; line-height: 1.6; color: var(--ink-2); margin: 0; }
.sec { margin: 0; padding: 36px 0 44px; border-top: 1px solid var(--line); }
[data-view-panel] > .sec:nth-of-type(even) { background: var(--paper-2); }
.sec > .wrap { padding: 0 var(--gutter); display: grid; gap: 22px; }
.sec-head { display: flex; align-items: center; gap: 14px; }
.sec-head h2 { margin: 0; }
.sec-head::after { content: ""; flex: 1; height: 1px; background: var(--line-2); }
.view-in { animation: view-fade .2s ease-out; }
@keyframes view-fade { from { opacity: 0; } to { opacity: 1; } }

.tone-grape { background: var(--grape-soft); color: var(--grape-ink); }
.tone-blue { background: var(--blue-soft); color: var(--blue-ink); }
.tone-yellow { background: var(--yellow-soft); color: var(--yellow-ink); }
.tone-green { background: var(--green-soft); color: var(--green-ink); }
.tone-red { background: var(--red-soft); color: var(--red-ink); }
.tone-ink { background: var(--ink); color: var(--paper); }
.tone-stone { background: var(--paper-3); color: var(--ink); }
.ic { width: 18px; height: 18px; flex: none; }
.badge { flex: none; width: 34px; height: 34px; border-radius: var(--r-sm); display: inline-grid; place-items: center; }
.badge-lg { width: 46px; height: 46px; border-radius: var(--r-md); }
.badge-lg .ic { width: 24px; height: 24px; }
.badge.tone-ink { color: var(--yellow); }
.tile-h { display: flex; align-items: center; gap: 12px; min-width: 0; }
.tile-h h3 { margin: 0; font-size: 18px; line-height: 1.3; }

.group-hero { border-radius: var(--r-xl); padding: 22px 28px; display: grid; grid-template-columns: 1fr minmax(180px, 230px); gap: 28px; align-items: center; }
.group-hero > :only-child { grid-column: 1 / -1; }
.group-hero .edu-overline { color: inherit; margin: 0 0 6px; }
.group-hero .lead { margin: 0; font-size: var(--body-lg); line-height: 1.5; }
.gh-num { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1; }
.gh-bar { height: 10px; border-radius: var(--r-pill); background: color-mix(in srgb, currentColor 24%, transparent); overflow: hidden; margin-top: 6px; }
.gh-bar span { display: block; height: 100%; width: 0; background: currentColor; border-radius: var(--r-pill); }
.group-hero.tone-ink .edu-overline { color: var(--yellow); }

.card { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.card-head { padding: 12px 18px; background: var(--paper-2); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card-head h3 { margin: 0; }
.card-head .edu-overline { margin: 0; }
.card-body { padding: 16px 18px; flex: 1; display: grid; gap: 12px; align-content: start; min-width: 0; }
.card-body > * { margin: 0; min-width: 0; }
.card-foot { padding: 12px 18px; border-top: 1px dashed var(--line-2); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

.split { display: grid; grid-template-columns: minmax(22rem, 30rem) minmax(0, 1fr); gap: clamp(24px, 3vw, 44px); align-items: start; }
.concept { display: grid; gap: 14px; min-width: 0; }
.row-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row-head h3 { margin: 0; font-size: 20px; }
.wide-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.tile { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 8px 10px; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 12px 14px; }
.tile h4 { font-family: var(--font-display); font-size: var(--body); line-height: 1.25; margin: 0; }
.tile p { grid-column: 1 / -1; margin: 0; font-size: var(--body-sm); line-height: 1.45; }
.chain { list-style: none; margin: 0; padding: 0; display: grid; gap: 24px; }
.link { position: relative; background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 10px 14px; font-size: var(--body-sm); line-height: 1.45; }
.link:not(:last-child)::after { content: "↓"; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); line-height: 24px; font-family: var(--font-mono); font-weight: 500; color: var(--ink-2); }
.mini { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 0 14px 14px; display: grid; gap: 10px; overflow: hidden; min-width: 0; }
.mini::before { content: attr(data-label); display: block; margin: 0 -14px; padding: 6px 14px; background: var(--paper-3); color: var(--ink); font-family: var(--font-mono); font-weight: 500; font-size: var(--overline); letter-spacing: .1em; text-transform: uppercase; }
details.more { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-md); min-width: 0; }
details.more > summary { display: flex; justify-content: space-between; gap: 10px; cursor: pointer; list-style: none; padding: 8px 14px; font-family: var(--font-display); font-weight: 600; min-height: 40px; align-items: center; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: "+"; font-family: var(--font-mono); }
details.more[open] > summary { border-bottom: 1px dashed var(--line-2); }
details.more[open] > summary::after { content: "−"; }
details.more > :not(summary) { margin: 10px 14px; font-size: var(--body-sm); }

/* ─── Controls ─── */
.field { margin: 0; }
.field > label, .field > .label { display: block; margin-bottom: 8px; font-family: var(--font-mono); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .1em; color: var(--ink); }
.input { width: 100%; padding: 11px 14px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); font: inherit; background: var(--surface); color: var(--ink); min-height: 44px; }
.input[aria-invalid="true"] { border-color: var(--red-600); }
.range { width: 100%; accent-color: var(--ink); min-height: 40px; }
.edu-btn { font-family: var(--font-display); font-weight: 600; background: var(--yellow); color: var(--on-primary); border: none; border-radius: var(--r-pill); padding: 10px 22px; min-height: 44px; transition: background-color .12s; }
.edu-btn:hover:not(:disabled) { background: var(--yellow-600); }
.btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--r-pill); padding: 8px 18px; font-family: var(--font-display); font-weight: 600; min-height: 44px; transition: background-color .12s; }
.btn-ghost:hover:not(:disabled) { background: var(--paper-2); }
.btn-small { min-height: 40px; padding: 4px 12px; font-size: var(--body-sm); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.edu-seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--paper-2); border-radius: var(--r-pill); max-width: 100%; flex-wrap: wrap; }
.edu-seg button { border: none; background: transparent; padding: 7px 14px; border-radius: var(--r-pill); font-family: var(--font-sans); font-weight: 600; color: var(--ink-2); min-height: 40px; }
.edu-seg button.active { background: var(--yellow); color: var(--yellow-ink); }
.wrap-seg { border-radius: var(--r-lg); }
.reason { font-size: var(--body-sm); color: var(--ink-2); margin: 6px 0 0; }
.reason:empty, .err:empty { display: none; }
.reason.is-error, .err { color: var(--red-600); font-weight: 600; font-size: var(--body-sm); margin: 6px 0 0; }

/* ─── Tokens and bars ─── */
.tokens { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; min-width: 0; }
.token-chip { display: inline-flex; align-items: baseline; gap: 6px; padding: 4px 9px; border-radius: var(--r-xs); background: var(--paper-3); color: var(--ink); font-family: var(--font-mono); font-size: 13px; max-width: 100%; overflow-wrap: anywhere; }
.token-chip small { color: var(--ink-3); font-size: 10px; }
.token-chip.appended { background: var(--blue-soft); color: var(--blue-ink); }
.token-chip.appended small { color: inherit; }
.token-chip.unknown { background: var(--red-soft); color: var(--red-ink); }
.token-chip.unknown small { color: inherit; }
.token-chip.unseen { background: var(--surface); color: var(--ink-3); text-decoration: line-through; border: 1px dashed var(--line-strong); }
.token-chip.target { background: var(--yellow); color: var(--yellow-ink); font-weight: 600; }
.token-chip.chip-plus { background: var(--green-soft); color: var(--green-ink); }
.token-chip.chip-minus { background: var(--red-soft); color: var(--red-ink); }
.bars { display: grid; gap: 4px; min-width: 0; }
.bars-head { margin: 0; }
.bar { display: grid; grid-template-columns: minmax(70px, 130px) minmax(0, 1fr) 56px; gap: 8px; align-items: center; width: 100%; background: transparent; border: 1px solid transparent; border-radius: var(--r-xs); padding: 4px 6px; text-align: left; min-height: 30px; transition: background-color .12s; color: var(--ink); }
.bar:hover { background: var(--paper-2); }
.bar-name { font-family: var(--font-mono); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 12px; background: var(--paper-3); border-radius: var(--r-pill); overflow: hidden; display: block; }
.bar-fill { display: block; height: 100%; background: var(--ink); border-radius: var(--r-pill); }
.bar-val { font-family: var(--font-mono); font-size: 12px; text-align: right; }
.readout { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; font-size: var(--body-sm); }
.readout > span { display: grid; align-content: start; gap: 2px; background: var(--paper-2); border-radius: var(--r-sm); padding: 8px 12px; min-width: 0; overflow-wrap: anywhere; }
.readout b { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; line-height: 1.15; color: var(--ink); }

/* ─── Stats, charts, logs ─── */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; font-size: var(--body-sm); }
.stats > span { display: grid; gap: 2px; background: var(--paper-2); border-radius: var(--r-sm); padding: 8px 12px; min-width: 0; }
.stats b { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; line-height: 1.15; color: var(--ink); overflow-wrap: anywhere; }
.chart { display: block; width: 100%; height: 190px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.chart-small { height: 110px; }
.chart-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.chart-pair p { margin: 0 0 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: var(--body-sm); color: var(--ink-2); }
.key { display: inline-block; width: 22px; height: 2px; }
.key-ink { background: var(--ink); }
.key-blue { background: repeating-linear-gradient(90deg, var(--blue-600) 0 6px, transparent 6px 10px); }
.log-head { margin: 6px 0 0; }
.log { max-height: 150px; overflow-y: auto; display: grid; gap: 4px; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px; background: var(--paper-2); }
.log-short { max-height: 130px; }
.log-row { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px; font-size: var(--body-sm); }
.log-step { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }
.log-text { overflow-wrap: anywhere; color: var(--ink); }
.corpus { max-height: 340px; overflow-y: auto; font-family: var(--font-mono); font-size: 13px; display: grid; gap: 10px; padding: 8px 10px; background: var(--paper-2); border-radius: var(--r-sm); }
.doc { display: grid; gap: 2px; color: var(--ink); }
.scroll-box { max-height: 420px; overflow: auto; display: block; padding: 0; }

/* ─── Bench ─── */
.bench-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: stretch; }
.samples { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.samples li { display: grid; gap: 6px; padding: 8px 10px; background: var(--paper-2); border-radius: var(--r-sm); justify-items: start; min-width: 0; }
.sample-text { overflow-wrap: anywhere; color: var(--ink); min-width: 0; }
.prompt-line { font-weight: 600; color: var(--ink); overflow-wrap: anywhere; margin: 0; }
.same-col { display: grid; gap: 8px; min-width: 0; }
.same-col .edu-overline { margin: 0; }
.cmp-form { max-width: none; }
.pair-opt { display: grid; gap: 8px; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--r-md); min-width: 0; }
.pair-opt p { margin: 0; }
.reward-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
.link-more { font-weight: 600; }
.plain { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.exp-result { display: grid; gap: 4px; font-size: var(--body-sm); margin-top: 8px; }
.exp-result p { margin: 0; }
.exp-result:empty { display: none; }
.scale-extra { margin: 0; padding: 12px 14px; }
.table-wrap { padding: 0; }
.dane-foot { margin-top: 0; }

/* ─── Tables ─── */
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; padding: 10px 14px; background: var(--paper-3); border-bottom: 1px solid var(--line-2); font-family: var(--font-mono); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--ink); }
td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--ink-2); vertical-align: top; }
tbody tr:nth-child(even) td { background: var(--paper-2); }
tbody tr:last-child td { border-bottom: none; }
td:first-child { color: var(--ink); font-weight: 600; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.table-card { overflow-x: auto; }

/* ─── Quiz ─── */
.quiz-track { height: 8px; background: var(--paper-3); }
.quiz-track span { display: block; height: 100%; width: 0; background: var(--ink); }
.quiz-q { border: none; padding: 0; margin: 0; display: grid; gap: 8px; min-width: 0; }
.opt input { flex: none; }
.quiz-q legend { font-family: var(--font-display); font-weight: 700; font-size: var(--h4); padding: 0; margin-bottom: 8px; color: var(--ink); }
.opt { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: var(--r-md); cursor: pointer; min-height: 44px; color: var(--ink); }
.opt.selected { background: var(--blue-soft); color: var(--blue-ink); border-color: var(--blue-soft); }
.opt.correct { background: var(--green-soft); color: var(--green-ink); border-color: var(--green-soft); }
.opt.wrong { background: var(--red-soft); color: var(--red-ink); border-color: var(--red-soft); }
.quiz-why { margin: 0; font-weight: 600; }
.quiz-why.good { color: var(--green-600); }
.quiz-why.bad { color: var(--red-600); }
.quiz-score { font-family: var(--font-display); font-weight: 700; font-size: var(--h2); color: var(--ink); margin: 0; }
#quiz-body .edu-btn { justify-self: start; }

/* ─── Help, footer, probe ─── */
dialog.help { border: 1px solid var(--line-2); border-radius: var(--r-lg); padding: 22px 26px; max-width: min(520px, calc(100vw - 32px)); color: var(--ink); background: var(--surface); }
dialog.help::backdrop { background: color-mix(in srgb, var(--ink) 45%, transparent); }
dialog.help h2 { margin: 0 0 12px; font-size: var(--h3); }
.app-footer { padding: 20px var(--gutter) 32px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; color: var(--ink-2); font-size: var(--body-sm); }
.app-footer p { margin: 0; }
.probe { padding: 20px var(--gutter); background: var(--paper-3); }
.probe h2 { font-size: var(--h3); margin: 0 0 6px; }
.probe-value { overflow-wrap: anywhere; font-family: var(--font-mono); font-size: 12px; }
.probe .card { margin-top: 12px; }
[data-check-status="pass"] .probe-status { color: var(--green-600); font-weight: 700; }
[data-check-status="fail"] .probe-status { color: var(--red-600); font-weight: 700; }

/* ─── Phone ─── */
@media (max-width: 768px) {
  .edu-header { display: contents; }
  .edu-header-inner { display: contents; }
  .brand { padding: 2px 16px; background: var(--paper); border-bottom: 1px solid var(--line); }
  .nav { position: sticky; top: 0; z-index: 50; background: var(--paper); padding: 6px 16px; flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; border-bottom: 1px solid var(--line-2); }
  .nav-pill { padding: 12px 12px; min-height: 44px; display: inline-flex; align-items: center; }
  #views a { display: inline-block; padding: 10px 0; }
  #views a.link-more { display: inline-flex; align-items: center; min-width: 44px; min-height: 44px; }
  .seed-control input { min-height: 44px; }
  .chart-pair { grid-template-columns: minmax(0, 1fr); }
  .opt input { width: 22px; height: 22px; }
  .train-bar { padding: 4px 16px; gap: 2px 10px; }
  .sec { padding: 28px 0 36px; }
  .page-head { padding: 24px 16px 20px; }
  .split, .pair, .wide-tiles, .bench-grid { grid-template-columns: minmax(0, 1fr); }
  .group-hero { grid-template-columns: 1fr; padding: 20px; gap: 14px; }
  .sec-head { flex-direction: row; flex-wrap: wrap; align-items: center; }
  .sec-head h2 { flex: 1; min-width: 0; font-size: var(--h3); }
  .sec-head::after { flex: 1 0 100%; }
  .stats { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .table-card table { min-width: 560px; }
  .bar { grid-template-columns: minmax(60px, 100px) minmax(0, 1fr) 50px; min-height: 40px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* ─── Notices, samples, step pages ─── */
.notice { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; border-radius: var(--r-md); padding: 14px 20px; }
.notice p { margin: 0; flex: 1 1 20rem; font-weight: 500; }
.btn-ink { display: inline-flex; align-items: center; min-height: 44px; padding: 8px 18px; background: var(--ink); color: var(--paper); border: none; border-radius: var(--r-pill); font-family: var(--font-display); font-weight: 600; text-decoration: none; transition: background-color .12s; }
.btn-ink:hover:not(:disabled) { background: var(--ink-2); }
#views a.btn-ink { color: var(--paper); }
.chain .link.on { background: var(--yellow); color: var(--on-primary); border-color: var(--yellow); }
.data-sample { display: grid; gap: 8px; margin-top: 10px; min-width: 0; }
.data-sample p { margin: 0; }
.sample-list, .sample-prompts { max-height: 340px; overflow-y: auto; }
.pair-line { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: center; min-width: 0; }
.step-link { align-self: center; }
.step-caption { display: block; background: var(--paper-2); border-radius: var(--r-sm); padding: 10px 14px; font-weight: 500; color: var(--ink); min-height: 66px; overflow-wrap: anywhere; }
.bar-static { cursor: default; }
.bar-static:hover { background: transparent; }
.bar.is-target { background: var(--yellow); color: var(--yellow-ink); }
.bar.is-target:hover { background: var(--yellow); }
.bar.is-target .bar-track { background: var(--paper); }
.demo-box { display: grid; gap: 6px; justify-items: start; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: var(--r-md); min-width: 0; }
.demo-box p { margin: 0; }
.rl-values { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; margin: 6px 0 0; font-size: var(--body-sm); }
.rl-values dt { color: var(--ink-2); }
.rl-values dd { margin: 0; font-family: var(--font-mono); text-align: right; color: var(--ink); }
.hash-line { overflow-wrap: anywhere; color: var(--ink-3); }
.pair-opt .edu-chip { justify-self: start; }

</style>

// ─── Helpers: random numbers ───
function hashSeed(a, b) {
  let h = 2166136261 ^ a;
  const text = String(b);
  for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function makeRng(seed) {
  let s = seed >>> 0;
  return function rng() {
    s = (s + 0x6D2B79F5) | 0;
    let z = Math.imul(s ^ (s >>> 15), 1 | s);
    z = (z + Math.imul(z ^ (z >>> 7), 61 | z)) ^ z;
    return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffled(list, rng) {
  const copy = list.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    const tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
  }
  return copy;
}
