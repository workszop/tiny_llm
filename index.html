function splitTokens(line) { return line.split(/\s+/).filter(Boolean); }

function buildCorpusDocs() {
  const rng = makeRng(90210);
  const docs = [];
  const geoLines = [];
  GEO.forEach((g) => {
    geoLines.push(`Stolicą ${g.gen} jest ${g.cap} .`, `${g.cap} to stolica ${g.gen} .`, `${g.nom} ${g.lies} w Europie .`);
    if (g.river) geoLines.push(`${g.cap} leży ${g.river} .`);
  });
  for (let i = 0; i < 6; i++) {
    const lines = shuffled(geoLines, rng);
    for (let at = 0; at < lines.length; at += 7) docs.push({ genre: 'encyklopedia', lines: lines.slice(at, at + 7) });
  }
  const tasks = [];
  GEO.forEach((g) => tasks.push(`Jaka jest stolica ${g.gen} ?`));
  LIST_CATEGORIES.forEach((c) => tasks.push(`Wymień trzy ${c.key} .`));
  SENTENCE_SUBJECTS.forEach((s) => tasks.push(`Napisz zdanie o ${s.loc} .`));
  const pool = tasks.concat(SHEET_EXTRA_LINES);
  for (let i = 0; i < 26; i++) {
    const lines = shuffled(pool, rng).slice(0, 11);
    lines.unshift(SHEET_TITLES[i % SHEET_TITLES.length]);
    docs.push({ genre: 'arkusz', lines });
  }
  for (let i = 0; i < 4; i++) {
    const lines = shuffled(NARRATIVE_LINES, rng);
    for (let at = 0; at < lines.length; at += 6) docs.push({ genre: 'opowiadanie', lines: lines.slice(at, at + 6) });
  }
  LIST_CATEGORIES.forEach((c) => {
    const lines = [`${c.head} to ${c.items.slice(0, 4).join(' , ')} i ${c.items[4]} .`];
    for (let i = 0; i < 5; i++) {
      lines.push(`Na liście są ${c.items[i]} , ${c.items[(i + 1) % 5]} i ${c.items[(i + 2) % 5]} .`);
    }
    docs.push({ genre: 'lista', lines: lines });
    docs.push({ genre: 'lista', lines: [lines[0]] });
  });
  return shuffled(docs, rng);
}

function buildDemos() {
  const demos = [];
  const add = (prompt, intent, style, response, heldOut) => demos.push({ prompt, intent, style, response, heldOut: !!heldOut });
  let dismissiveAt = 0;
  const dismissive = () => DISMISSIVE_PHRASES[dismissiveAt++ % DISMISSIVE_PHRASES.length];
  GEO.filter((g) => g.sft).forEach((g) => {
    const prompt = `Jaka jest stolica ${g.gen} ?`;
    add(prompt, 'fact', 'pozadana', `Stolicą ${g.gen} jest ${g.cap} .`);
    add(prompt, 'fact', 'pozadana', `Stolicą ${g.gen} jest ${g.cap} .`);
    add(prompt, 'fact', 'zdawkowa', `${g.cap} .`);
    add(prompt, 'fact', 'zdawkowa', `Chyba ${g.cap} .`);
    add(prompt, 'fact', 'zbywajaca', dismissive());
  });
  LIST_CATEGORIES.filter((c) => c.sft).forEach((c) => {
    const prompt = `Wymień trzy ${c.key} .`;
    const it = c.items;
    add(prompt, 'list', 'pozadana', `Trzy ${c.key} to : ${it[0]} , ${it[1]} i ${it[2]} .`);
    add(prompt, 'list', 'pozadana', `Trzy ${c.key} to : ${it[1]} , ${it[3]} i ${it[4]} .`);
    add(prompt, 'list', 'zdawkowa', `${it[0]} , ${it[1]} i ${it[2]} .`);
    add(prompt, 'list', 'zdawkowa', `${it[2]} , ${it[3]} i ${it[4]} .`);
    add(prompt, 'list', 'zbywajaca', dismissive());
  });
  SENTENCE_SUBJECTS.filter((s) => s.sft).forEach((s) => {
    const prompt = `Napisz zdanie o ${s.loc} .`;
    add(prompt, 'sentence', 'pozadana', s.full[0]);
    add(prompt, 'sentence', 'pozadana', s.full[1]);
    add(prompt, 'sentence', 'zdawkowa', s.curt[0]);
    add(prompt, 'sentence', 'zdawkowa', s.curt[1]);
    add(prompt, 'sentence', 'zbywajaca', dismissive());
  });
  return demos;
}

function buildVocab(docs, demos) {
  const set = new Set([TOKEN_NL, TOKEN_END, TOKEN_UNK]);
  docs.forEach((d) => d.lines.forEach((l) => splitTokens(l).forEach((tok) => set.add(tok))));
  demos.forEach((d) => { splitTokens(d.prompt).concat(splitTokens(d.response)).forEach((tok) => set.add(tok)); });
  EVAL_PROMPTS.forEach((p) => tokenizeRaw(p.text).forEach((tok) => set.add(tok)));
  const list = Array.from(set);
  const index = new Map(list.map((tok, i) => [tok, i]));
  const lower = new Map();
  list.forEach((tok, i) => { const low = tok.toLowerCase(); if (!lower.has(low)) lower.set(low, i); });
  return { list, index, lower, nl: index.get(TOKEN_NL), end: index.get(TOKEN_END), unk: index.get(TOKEN_UNK) };
}

function tokenizeRaw(text) { return text.match(/[\p{L}\p{N}]+|[^\s\p{L}\p{N}]/gu) || []; }

function tokenize(text, vocab) {
  const raw = tokenizeRaw(text);
  const ids = raw.map((tok) => {
    if (vocab.index.has(tok)) return vocab.index.get(tok);
    const low = tok.toLowerCase();
    return vocab.lower.has(low) ? vocab.lower.get(low) : vocab.unk;
  });
  return { raw, ids };
}

function buildData() {
  const docs = buildCorpusDocs();
  const demos = buildDemos();
  const vocab = buildVocab(docs, demos);
  const toIds = (line) => splitTokens(line).map((tok) => vocab.index.get(tok));
  const corpusIds = [];
  const corpusIsVal = [];
  let lineCounter = 0;
  docs.forEach((doc) => {
    doc.lines.forEach((line) => {
      const isVal = lineCounter++ % 10 === 9;
      toIds(line).concat([vocab.nl]).forEach((id) => { corpusIds.push(id); corpusIsVal.push(isVal); });
    });
    corpusIds.push(vocab.nl); corpusIsVal.push(false);
  });
  const demoSeqs = demos.map((d) => ({
    context: toIds(d.prompt).concat([vocab.nl]),
    response: toIds(d.response).concat([vocab.end]),
    prompt: d.prompt,
  }));
  const rawBigrams = new Set();
  docs.forEach((d) => d.lines.forEach((l) => { const t = splitTokens(l); for (let i = 1; i < t.length; i++) rawBigrams.add(t[i - 1] + ' ' + t[i]); }));
  const allBigrams = new Set(rawBigrams);
  demos.forEach((d) => { const t = splitTokens(d.response); for (let i = 1; i < t.length; i++) allBigrams.add(t[i - 1] + ' ' + t[i]); });
  const rawTokens = new Set(); const allTokens = new Set();
  docs.forEach((d) => d.lines.forEach((l) => splitTokens(l).forEach((tok) => { rawTokens.add(tok); allTokens.add(tok); })));
  demos.forEach((d) => splitTokens(d.response).forEach((tok) => allTokens.add(tok)));
  const rlPrompts = Array.from(new Set(demos.map((d) => d.prompt)));
  return { docs, demos, vocab, corpusIds, corpusIsVal, demoSeqs, rawBigrams, allBigrams, rawTokens, allTokens, rlPrompts,
    rlPromptIds: rlPrompts.map((p) => toIds(p).concat([vocab.nl])), rlPromptExpect: rlPrompts.map(expectationForText),
    evalPrompts: EVAL_PROMPTS.map((p) => ({ ...p, ids: tokenize(p.text, vocab).ids.concat([vocab.nl]) })) };
}

// ─── Helpers: classifier ───
function eqi(a, b) { return a.toLowerCase() === b.toLowerCase(); }

function expectationForText(text) {
  const raw = tokenizeRaw(text).map((tok) => tok.toLowerCase()).join(' ');
  const p = EVAL_PROMPTS.find((q) => tokenizeRaw(q.text).map((tok) => tok.toLowerCase()).join(' ') === raw);
  if (p) return p;
  const geo = GEO.find((g) => `jaka jest stolica ${g.gen} ?`.toLowerCase() === raw);
  if (geo) return { intent: 'fact', geo: geo.gen };
  const cat = LIST_CATEGORIES.find((c) => `wymień trzy ${c.key} .` === raw);
  if (cat) return { intent: 'list', category: cat.key };
  const sub = SENTENCE_SUBJECTS.find((s) => `napisz zdanie o ${s.loc} .` === raw);
  if (sub) return { intent: 'sentence', subject: sub.subject };
  return null;
}

function splitSegment(tokens) {
  const segment = [];
  for (let i = 0; i < tokens.length; i++) {
    if (tokens[i] === TOKEN_NL || tokens[i] === TOKEN_END) return { segment, end: tokens[i] };
    segment.push(tokens[i]);
  }
  return { segment, end: 'limit' };
}

function isPlausible(segment, bigrams, tokenSet) {
  if (segment.length === 0) return false;
  if (segment.length === 1) return tokenSet.has(segment[0]);
  let hits = 0;
  for (let i = 1; i < segment.length; i++) if (bigrams.has(segment[i - 1] + ' ' + segment[i])) hits++;
  return hits / (segment.length - 1) >= PLAUSIBLE_SHARE;
}

function listItemsValid(tokens, items) {
  // Items separated by exactly one "," or "i"; the list ends in "."
  if (tokens.length !== 6 || tokens[5] !== '.') return false;
  const picked = [tokens[0], tokens[2], tokens[4]].map((tok) => tok.toLowerCase());
  const seps = [tokens[1], tokens[3]];
  if (!seps.every((sep) => sep === ',' || sep.toLowerCase() === 'i')) return false;
  const allowed = items.map((tok) => tok.toLowerCase());
  return new Set(picked).size === 3 && picked.every((tok) => allowed.includes(tok));
}

function meetsExpectation(segment, expect) {
  if (expect.intent === 'fact') {
    const g = GEO.find((item) => item.gen === expect.geo);
    const full = `stolicą ${g.gen} jest ${g.cap} .`.toLowerCase();
    if (segment.join(' ').toLowerCase() === full) return 'complete';
    if (segment.length <= 4 && segment.some((tok) => eqi(tok, g.cap))) return 'curt';
    return null;
  }
  if (expect.intent === 'list') {
    const c = LIST_CATEGORIES.find((item) => item.key === expect.category);
    if (segment.length === 10 && eqi(segment[0], 'trzy') && eqi(segment[1], c.key) && eqi(segment[2], 'to') && segment[3] === ':' && listItemsValid(segment.slice(4), c.items)) return 'complete';
    if (listItemsValid(segment, c.items)) return 'curt';
    return null;
  }
  if (segment.length >= 2 && eqi(segment[0], expect.subject) && segment[segment.length - 1] === '.') {
    if (segment.length >= 4) return 'complete';
    return 'curt';
  }
  return null;
}

function classifyOutput(expect, tokens, data) {
  const { segment, end } = splitSegment(tokens);
  if (segment.length === 0 || segment.includes(TOKEN_UNK)) return 'inne';
  const text = segment.join(' ');
  if (DISMISSIVE_PHRASES.some((phrase) => eqi(phrase, text))) return 'zbywajaca';
  if (expect) {
    const met = meetsExpectation(segment, expect);
    if (met === 'complete') return 'pozadana';
    if (met === 'curt') return 'zdawkowa';
  }
  if (segment[segment.length - 1] === '?' || end === TOKEN_NL) {
    return isPlausible(segment, data.rawBigrams, data.rawTokens) ? 'kontynuacja' : 'inne';
  }
  if (end === 'limit') return 'inne';
  if (!expect) return 'odpowiedz';
  return isPlausible(segment, data.allBigrams, data.allTokens) ? 'bledna' : 'inne';
}

// ─── Helpers: model ───
function makeShape(vocabSize) {
  const inputDim = CONTEXT_LEN * EMBED_DIM;
  const embed = 0;
  const w1 = embed + vocabSize * EMBED_DIM;
  const b1 = w1 + inputDim * HIDDEN_DIM;
  const w2 = b1 + HIDDEN_DIM;
  const b2 = w2 + HIDDEN_DIM * vocabSize;
  return { vocabSize, inputDim, embed, w1, b1, w2, b2, total: b2 + vocabSize };
}

function initParams(shape, seed) {
  const rng = makeRng(hashSeed(seed, 'init'));
  const p = new Float64Array(shape.total);
  const gauss = () => Math.sqrt(-2 * Math.log(1 - rng())) * Math.cos(2 * Math.PI * rng());
  for (let i = shape.embed; i < shape.w1; i++) p[i] = gauss() * 0.1;
  for (let i = shape.w1; i < shape.b1; i++) p[i] = gauss() / Math.sqrt(shape.inputDim);
  for (let i = shape.w2; i < shape.b2; i++) p[i] = gauss() * 0.01;
  return p;
}

function makeWork(shape) {
  return { x: new Float64Array(shape.inputDim), h: new Float64Array(HIDDEN_DIM), logits: new Float64Array(shape.vocabSize), probs: new Float64Array(shape.vocabSize),
    dh: new Float64Array(HIDDEN_DIM), dx: new Float64Array(shape.inputDim), window: new Int32Array(CONTEXT_LEN) };
}

function fillWindow(work, ids, end, padId) {
  // The window holds the last CONTEXT_LEN tokens before position `end`, padded with the newline token.
  for (let c = 0; c < CONTEXT_LEN; c++) {
    const at = end - CONTEXT_LEN + c;
    work.window[c] = at >= 0 ? ids[at] : padId;
  }
}

function forwardWindow(p, shape, work) {
  const { x, h, logits, window: win } = work;
  for (let c = 0; c < CONTEXT_LEN; c++) {
    const from = shape.embed + win[c] * EMBED_DIM;
    const to = c * EMBED_DIM;
    for (let d = 0; d < EMBED_DIM; d++) x[to + d] = p[from + d];
  }
  let w = shape.w1;
  const inputDim = shape.inputDim;
  for (let j = 0; j < HIDDEN_DIM; j++) {
    let a = p[shape.b1 + j];
    for (let k = 0; k < inputDim; k++) a += p[w + k] * x[k];
    w += inputDim;
    h[j] = Math.tanh(a);
  }
  const V = shape.vocabSize;
  w = shape.w2;
  for (let j = 0; j < HIDDEN_DIM; j++) {
    const hj = h[j];
    if (j === 0) for (let i = 0; i < V; i++) logits[i] = p[shape.b2 + i] + p[w + i] * hj;
    else for (let i = 0; i < V; i++) logits[i] += p[w + i] * hj;
    w += V;
  }
}

function softmaxInto(logits, probs, temperature) {
  const V = logits.length;
  let max = -Infinity;
  for (let i = 0; i < V; i++) if (logits[i] > max) max = logits[i];
  if (temperature === 0) {
    let best = 0;
    for (let i = 1; i < V; i++) if (logits[i] > logits[best]) best = i;
    probs.fill(0); probs[best] = 1;
    return;
  }
  let sum = 0;
  for (let i = 0; i < V; i++) { const v = Math.exp((logits[i] - max) / temperature); probs[i] = v; sum += v; }
  for (let i = 0; i < V; i++) probs[i] /= sum;
}

function sampleFrom(probs, rng) {
  let r = rng();
  for (let i = 0; i < probs.length; i++) { r -= probs[i]; if (r <= 0) return i; }
  return probs.length - 1;
}

// One example's gradient is added to `grad`, scaled by `weight`. Returns the unweighted loss.
function accumulateGrad(p, grad, shape, work, target, weight) {
  forwardWindow(p, shape, work);
  const { x, h, logits, probs, dh, dx, window: win } = work;
  softmaxInto(logits, probs, 1);
  const V = shape.vocabSize;
  const loss = -Math.log(Math.max(probs[target], 1e-300));
  probs[target] -= 1;
  for (let i = 0; i < V; i++) grad[shape.b2 + i] += weight * probs[i];
  let w = shape.w2;
  for (let j = 0; j < HIDDEN_DIM; j++) {
    const hj = h[j];
    let d = 0;
    for (let i = 0; i < V; i++) { const e = probs[i]; d += p[w + i] * e; grad[w + i] += weight * e * hj; }
    dh[j] = d * (1 - hj * hj);
    w += V;
  }
  const inputDim = shape.inputDim;
  dx.fill(0);
  w = shape.w1;
  for (let j = 0; j < HIDDEN_DIM; j++) {
    const d = dh[j];
    grad[shape.b1 + j] += weight * d;
    for (let k = 0; k < inputDim; k++) { grad[w + k] += weight * d * x[k]; dx[k] += p[w + k] * d; }
    w += inputDim;
  }
  for (let c = 0; c < CONTEXT_LEN; c++) {
    const toE = shape.embed + win[c] * EMBED_DIM;
    const from = c * EMBED_DIM;
    for (let d = 0; d < EMBED_DIM; d++) grad[toE + d] += weight * dx[from + d];
  }
  return loss;
}

function makeAdam(total) { return { m: new Float64Array(total), v: new Float64Array(total), t: 0 }; }

function adamStep(p, grad, adam, lr, clip) {
  let norm = 0;
  for (let i = 0; i < grad.length; i++) norm += grad[i] * grad[i];
  norm = Math.sqrt(norm);
  const scale = norm > clip ? clip / norm : 1;
  adam.t += 1;
  const b1t = 1 - Math.pow(0.9, adam.t);
  const b2t = 1 - Math.pow(0.999, adam.t);
  const { m, v } = adam;
  for (let i = 0; i < grad.length; i++) {
    const g = grad[i] * scale;
    m[i] = 0.9 * m[i] + 0.1 * g;
    v[i] = 0.999 * v[i] + 0.001 * g * g;
    p[i] -= lr * (m[i] / b1t) / (Math.sqrt(v[i] / b2t) + 1e-8);
  }
  return norm;
}

function lrAt(cfg, step, steps) {
  const f = 0.5 * (1 + Math.cos(Math.PI * step / steps));
  return cfg.lrFinal + (cfg.lr - cfg.lrFinal) * f;
}

function weightsHash(p) {
  let h1 = 0x811C9DC5, h2 = 0x1B873593;
  const bytes = new Uint32Array(p.buffer, p.byteOffset, p.length * 2);
  for (let i = 0; i < bytes.length; i++) {
    h1 = Math.imul(h1 ^ bytes[i], 16777619);
    h2 = Math.imul(h2 + bytes[i], 2654435761);
  }
  return (h1 >>> 0).toString(16).padStart(8, '0') + (h2 >>> 0).toString(16).padStart(8, '0');
}

function sampleTokens(p, shape, work, contextIds, rng, temperature, padId, endId, maxTokens) {
  const seq = contextIds.slice();
  const out = [];
  while (out.length < maxTokens) {
    fillWindow(work, seq, seq.length, padId);
    forwardWindow(p, shape, work);
    softmaxInto(work.logits, work.probs, temperature);
    const id = sampleFrom(work.probs, rng);
    seq.push(id); out.push(id);
    if (id === endId) break;
  }
  return out;
}

// ─── Helpers: loss on a dataset ───
function exampleSets(data) {
  const corpusTrain = []; const corpusVal = [];
  for (let i = 0; i < data.corpusIds.length; i++) (data.corpusIsVal[i] ? corpusVal : corpusTrain).push(i);
  return { corpusTrain, corpusVal };
}

function makeSftExamples(seqs) {
  const train = []; const val = [];
  seqs.forEach((seq, s) => {
    const list = s % 7 === 3 ? val : train;
    for (let t = 0; t < seq.response.length; t++) list.push({ s, t });
  });
  return { train, val };
}

function* datasetLossSliced(p, shape, work, count, setWindow) {
  let sum = 0;
  for (let i = 0; i < count; i++) {
    const target = setWindow(i);
    forwardWindow(p, shape, work);
    softmaxInto(work.logits, work.probs, 1);
    sum += -Math.log(Math.max(work.probs[target], 1e-300));
    if (i % 40 === 39) yield 'loss';
  }
  return sum / Math.max(count, 1);
}

function datasetLoss(p, shape, work, count, setWindow) {
  let sum = 0;
  for (let i = 0; i < count; i++) {
    const target = setWindow(i);
    forwardWindow(p, shape, work);
    softmaxInto(work.logits, work.probs, 1);
    sum += -Math.log(Math.max(work.probs[target], 1e-300));
  }
  return sum / Math.max(count, 1);
}

// ─── Helpers: reward model ───
function rewardFeatures(tokens) {
  const { segment } = splitSegment(tokens);
  return { tokens: Array.from(new Set(segment)), length: segment.length };
}

function rewardScore(model, features) {
  let score = model.lengthWeight * features.length / 10;
  features.tokens.forEach((tok) => { score += model.weights.get(tok) || 0; });
  return score;
}

function fitRewardStep(model, pairs, rng, lr) {
  const order = shuffled(pairs, rng);
  let loss = 0;
  order.forEach((pair) => {
    const margin = rewardScore(model, pair.win) - rewardScore(model, pair.lose);
    const pLose = 1 / (1 + Math.exp(margin));
    loss += Math.log(1 + Math.exp(-margin));
    const step = lr * pLose;
    pair.win.tokens.forEach((tok) => model.weights.set(tok, (model.weights.get(tok) || 0) + step));
    pair.lose.tokens.forEach((tok) => model.weights.set(tok, (model.weights.get(tok) || 0) - step));
    model.lengthWeight += step * (pair.win.length - pair.lose.length) / 10;
  });
  return loss / Math.max(order.length, 1);
}

// ─── Helpers: training generators ───
function* trainPretrain(ctx, onReport) {
  const { p, shape, data, rng, cfg } = ctx;
  const work = makeWork(shape);
  const grad = new Float64Array(shape.total);
  const adam = makeAdam(shape.total);
  const ids = ctx.corpusIds || data.corpusIds;
  const sets = exampleSets({ corpusIds: ids, corpusIsVal: data.corpusIsVal });
  const nl = data.vocab.nl;
  const evalSet = (set, n) => {
    const count = Math.min(n, set.length);
    return datasetLossSliced(p, shape, work, count, (i) => {
      const at = set[Math.floor(i * set.length / count)];
      fillWindow(work, ids, at, nl);
      return ids[at];
    });
  };
  ctx.lossInitial = yield* evalSet(sets.corpusTrain, 400);
  ctx.valLossInitial = yield* evalSet(sets.corpusVal, 400);
  ctx.loss = ctx.lossInitial; ctx.valLoss = ctx.valLossInitial;
  if (onReport) onReport(0);
  yield 'ready';
  let running = ctx.lossInitial;
  for (let step = 1; step <= cfg.steps; step++) {
    grad.fill(0);
    let batchLoss = 0;
    const weight = 1 / cfg.batch;
    for (let b = 0; b < cfg.batch; b++) {
      const at = sets.corpusTrain[Math.floor(rng() * sets.corpusTrain.length)];
      fillWindow(work, ids, at, nl);
      batchLoss += accumulateGrad(p, grad, shape, work, ids[at], weight);
    }
    batchLoss /= cfg.batch;
    if (!Number.isFinite(batchLoss)) throw new Error('nonfinite');
    adamStep(p, grad, adam, ctx.lrOverride || lrAt(cfg, step - 1, cfg.steps), cfg.clip);
    for (let i = 0; i < 8; i++) if (!Number.isFinite(p[i])) throw new Error('nonfinite');
    running = 0.97 * running + 0.03 * batchLoss;
    ctx.loss = running; ctx.step = step;
    if (step % 100 === 0 || step === cfg.steps) { ctx.valLoss = yield* evalSet(sets.corpusVal, 300); if (onReport) onReport(step); }
    yield 'step';
  }
}

function* trainSft(ctx, onReport) {
  const { p, shape, data, rng, cfg } = ctx;
  const work = makeWork(shape);
  const grad = new Float64Array(shape.total);
  const adam = makeAdam(shape.total);
  const seqs = ctx.seqs || data.demoSeqs;
  const examples = makeSftExamples(seqs);
  const nl = data.vocab.nl;
  const buf = [];
  const setEx = (ex) => {
    const seq = seqs[ex.s];
    buf.length = 0;
    for (let i = 0; i < seq.context.length; i++) buf.push(seq.context[i]);
    for (let i = 0; i < ex.t; i++) buf.push(seq.response[i]);
    fillWindow(work, buf, buf.length, nl);
    return seq.response[ex.t];
  };
  const evalSet = (set) => datasetLossSliced(p, shape, work, set.length, (i) => setEx(set[i]));
  ctx.lossInitial = yield* evalSet(examples.train);
  ctx.valLossInitial = yield* evalSet(examples.val);
  ctx.loss = ctx.lossInitial; ctx.valLoss = ctx.valLossInitial;
  if (onReport) onReport(0);
  yield 'ready';
  let running = ctx.lossInitial;
  for (let step = 1; step <= cfg.steps; step++) {
    grad.fill(0);
    let batchLoss = 0;
    const weight = 1 / cfg.batch;
    for (let b = 0; b < cfg.batch; b++) {
      const ex = examples.train[Math.floor(rng() * examples.train.length)];
      const target = setEx(ex);
      batchLoss += accumulateGrad(p, grad, shape, work, target, weight);
    }
    batchLoss /= cfg.batch;
    if (!Number.isFinite(batchLoss)) throw new Error('nonfinite');
    adamStep(p, grad, adam, lrAt(cfg, step - 1, cfg.steps), cfg.clip);
    running = 0.95 * running + 0.05 * batchLoss;
    ctx.loss = running; ctx.step = step;
    if (step % 50 === 0 || step === cfg.steps) { ctx.valLoss = yield* evalSet(examples.val); if (onReport) onReport(step); }
    yield 'step';
  }
}

function* collectSimulatedPairs(ctx, labeller) {
  const { sftParams, shape, data, rng } = ctx;
  const work = makeWork(shape);
  const rank = LABELLER_RANK[labeller];
  const vocab = data.vocab;
  const pairs = [];
  let attempts = 0;
  const wanted = ctx.pairsTarget || SIMULATED_PAIRS;
  while (pairs.length < wanted && attempts < wanted * 30) {
    attempts++;
    const idx = Math.floor(rng() * data.rlPromptIds.length);
    const ctxIds = data.rlPromptIds[idx];
    const a = sampleTokens(sftParams, shape, work, ctxIds, rng, 1, vocab.nl, vocab.end, MAX_GEN_TOKENS).map((id) => vocab.list[id]);
    const b = sampleTokens(sftParams, shape, work, ctxIds, rng, 1, vocab.nl, vocab.end, MAX_GEN_TOKENS).map((id) => vocab.list[id]);
    yield 'pair';
    if (a.join(' ') === b.join(' ')) continue;
    const expect = data.rlPromptExpect[idx];
    const ra = rank[classifyOutput(expect, a, data)];
    const rb = rank[classifyOutput(expect, b, data)];
    if (ra === rb) continue;
    const winA = ra > rb;
    pairs.push({ prompt: data.rlPrompts[idx], win: rewardFeatures(winA ? a : b), lose: rewardFeatures(winA ? b : a), winTokens: winA ? a : b, loseTokens: winA ? b : a });
  }
  ctx.pairs = pairs;
}

function* fitReward(ctx) {
  const cfg = ctx.cfg;
  const model = { weights: new Map(), lengthWeight: 0 };
  for (let e = 0; e < cfg.rewardEpochs; e++) {
    ctx.rewardLoss = fitRewardStep(model, ctx.pairs, ctx.rng, cfg.rewardLr);
    // Weight decay: rare tokens such as one country's name fade, frequent style tokens stay.
    model.weights.forEach((w, tok) => model.weights.set(tok, w * cfg.rewardDecay));
    yield 'reward';
  }
  // Scores are standardised on the labelled answers, so the clip below cuts only outliers, not the difference between answers.
  const scores = [];
  ctx.pairs.forEach((pair) => { scores.push(rewardScore(model, pair.win), rewardScore(model, pair.lose)); });
  const mean = scores.reduce((sum, v) => sum + v, 0) / Math.max(scores.length, 1);
  const variance = scores.reduce((sum, v) => sum + (v - mean) * (v - mean), 0) / Math.max(scores.length, 1);
  model.mean = mean;
  model.std = Math.sqrt(variance) || 1;
  ctx.reward = model;
}

function* trainRl(ctx, onReport) {
  const { p, sftParams, shape, data, rng, cfg } = ctx;
  const vocab = data.vocab;
  const work = makeWork(shape);
  const workRef = makeWork(shape);
  const grad = new Float64Array(shape.total);
  const adam = makeAdam(shape.total);
  let baseline = 0;
  let baselineReady = false;
  const rewardHistory = [];
  if (onReport) onReport(0);
  for (let step = 1; step <= cfg.steps; step++) {
    const episodes = [];
    let meanReward = 0;
    let preferred = 0;
    for (let e = 0; e < cfg.batch; e++) {
      const idx = Math.floor(rng() * data.rlPromptIds.length);
      const seq = data.rlPromptIds[idx].slice();
      const start = seq.length;
      const generated = [];
      let klSum = 0;
      while (generated.length < MAX_GEN_TOKENS) {
        fillWindow(work, seq, seq.length, vocab.nl);
        forwardWindow(p, shape, work);
        softmaxInto(work.logits, work.probs, 1);
        const id = sampleFrom(work.probs, rng);
        const logP = Math.log(Math.max(work.probs[id], 1e-300));
        workRef.window.set(work.window);
        forwardWindow(sftParams, shape, workRef);
        softmaxInto(workRef.logits, workRef.probs, 1);
        klSum += logP - Math.log(Math.max(workRef.probs[id], 1e-300));
        seq.push(id); generated.push(id);
        if (id === vocab.end) break;
      }
      const tokens = generated.map((id) => vocab.list[id]);
      const scored = (rewardScore(ctx.reward, rewardFeatures(tokens)) - ctx.reward.mean) / ctx.reward.std;
      const reward = Math.max(-cfg.rewardClip, Math.min(cfg.rewardClip, scored)) - cfg.klBeta * klSum;
      if (!Number.isFinite(reward)) throw new Error('nonfinite');
      if (classifyOutput(data.rlPromptExpect[idx], tokens, data) === 'pozadana') preferred += 1 / cfg.batch;
      episodes.push({ seq, start, reward });
      meanReward += reward / cfg.batch;
      yield 'episode';
    }
    if (!baselineReady) { baseline = meanReward; baselineReady = true; }
    grad.fill(0);
    for (const ep of episodes) {
      const adv = ep.reward - baseline;
      for (let t = ep.start; t < ep.seq.length; t++) {
        fillWindow(work, ep.seq, t, vocab.nl);
        accumulateGrad(p, grad, shape, work, ep.seq[t], adv / cfg.batch);
      }
      yield 'grad';
    }
    adamStep(p, grad, adam, lrAt(cfg, step - 1, cfg.steps), cfg.clip);
    baseline = cfg.baselineDecay * baseline + (1 - cfg.baselineDecay) * meanReward;
    ctx.meanReward = meanReward; ctx.preferred = preferred; ctx.step = step;
    rewardHistory.push(meanReward);
    if (onReport && (step <= 20 || step % 10 === 0 || step === cfg.steps)) onReport(step);
    yield 'step';
  }
  ctx.rewardHistory = rewardHistory;
}

function* evaluateMetrics(p, shape, data, seed, label, samplesPerPrompt) {
  const rng = makeRng(hashSeed(seed, 'eval' + label));
  const vocab = data.vocab;
  const work = makeWork(shape);
  const samples = [];
  for (const prompt of data.evalPrompts) {
    for (let i = 0; i < (samplesPerPrompt || METRIC_SAMPLES_PER_PROMPT); i++) {
      const ids = sampleTokens(p, shape, work, prompt.ids, rng, METRIC_TEMPERATURE, vocab.nl, vocab.end, MAX_GEN_TOKENS);
      const tokens = ids.map((id) => vocab.list[id]);
      samples.push({ prompt: prompt.id, heldOut: prompt.heldOut, intent: prompt.intent, tokens, cls: classifyOutput(prompt, tokens, data) });
      yield 'sample';
    }
  }
  return { ...summarizeSamples(samples), samples };
}

function summarizeGroup(list) {
  const n = list.length || 1;
  const share = (fn) => Math.round(1000 * list.filter(fn).length / n) / 10;
  const facts = list.filter((s) => s.intent === 'fact');
  const counts = {};
  ['pozadana', 'zdawkowa', 'zbywajaca', 'bledna', 'kontynuacja', 'inne'].forEach((c) => { counts[c] = share((s) => s.cls === c); });
  return {
    form: share((s) => ['pozadana', 'zdawkowa', 'zbywajaca', 'bledna'].includes(s.cls)),
    continuation: counts.kontynuacja,
    preferred: counts.pozadana,
    correct: facts.length ? Math.round(1000 * facts.filter((s) => s.cls === 'pozadana' || s.cls === 'zdawkowa').length / facts.length) / 10 : 0,
    classes: counts,
    n: list.length,
  };
}

function summarizeSamples(samples) {
  return { trained: summarizeGroup(samples.filter((s) => !s.heldOut)), heldOut: summarizeGroup(samples.filter((s) => s.heldOut)) };
}

// ─── Helpers: stage flows (shared by the app and the seed probe) ───
function* flowPretrain(env) {
  const ctx = { p: env.params, shape: env.shape, data: env.data, rng: makeRng(hashSeed(env.seed, env.stream || 'batch')), cfg: env.cfg, step: 0, corpusIds: env.corpusIds, lrOverride: env.lrOverride };
  if (env.onCtx) env.onCtx(ctx);
  yield* trainPretrain(ctx, env.report);
  if (env.onPhase) env.onPhase('evaluating');
  ctx.metrics = yield* evaluateMetrics(env.params, env.shape, env.data, env.seed, env.label || 'pre', env.cfg.metricSamples);
  return ctx;
}

function* flowSft(env) {
  const ctx = { p: env.params, shape: env.shape, data: env.data, rng: makeRng(hashSeed(env.seed, env.stream || 'sft')), cfg: env.cfg, step: 0, seqs: env.seqs };
  if (env.onCtx) env.onCtx(ctx);
  yield* trainSft(ctx, env.report);
  if (env.onPhase) env.onPhase('evaluating');
  ctx.metrics = yield* evaluateMetrics(env.params, env.shape, env.data, env.seed, env.label || 'sft', env.cfg.metricSamples);
  return ctx;
}

function* flowRl(env) {
  const ctx = { p: env.params, sftParams: env.sftParams, shape: env.shape, data: env.data, rng: makeRng(hashSeed(env.seed, env.stream || 'rl')), cfg: env.cfg, step: 0, pairs: env.pairs, pairsTarget: env.cfg.pairsTarget };
  if (env.onCtx) env.onCtx(ctx);
  if (!ctx.pairs) {
    if (env.onPhase) env.onPhase('collecting');
    yield* collectSimulatedPairs(ctx, env.labeller);
  }
  if (env.onPhase) env.onPhase('fitting');
  yield* fitReward(ctx);
  if (env.onPhase) env.onPhase('training');
  yield* trainRl(ctx, env.report);
  if (env.onPhase) env.onPhase('evaluating');
  ctx.metrics = yield* evaluateMetrics(env.params, env.shape, env.data, env.seed, env.label || 'rl', env.cfg.metricSamples);
  return ctx;
}

function shuffledCorpus(data, seed) {
  return shuffled(data.corpusIds, makeRng(hashSeed(seed, 'shuffle-corpus')));
}

function shuffledDemoSeqs(data, seed) {
  const responses = shuffled(data.demoSeqs.map((s) => s.response), makeRng(hashSeed(seed, 'shuffle-demos')));
  return data.demoSeqs.map((s, i) => ({ context: s.context, prompt: s.prompt, response: responses[i] }));
}

// ─── Helpers: general ───
function t(key, vars) {
  let text = Object.prototype.hasOwnProperty.call(T, key) ? T[key] : key;
  if (vars) Object.keys(vars).forEach((k) => { text = text.split('{' + k + '}').join(String(vars[k])); });
  return text;
}
function qs(selector, root) { return (root || document).querySelector(selector); }
function qsa(selector, root) { return Array.from((root || document).querySelectorAll(selector)); }
function ic(name) { return `<svg class="ic" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[name] || ''}</svg>`; }
function setText(el, text) { if (el && el.textContent !== text) el.textContent = text; }
function setAttr(el, name, value) { if (el && el.getAttribute(name) !== String(value)) el.setAttribute(name, String(value)); }
function fmt(value, digits) {
  if (value === null || value === undefined || !Number.isFinite(value)) return '-';
  return value.toFixed(digits === undefined ? 2 : digits).replace('.', ',');
}
function attrNum(value, digits) { return value === null || value === undefined || !Number.isFinite(value) ? '' : value.toFixed(digits === undefined ? 4 : digits); }
function prettyTokens(tokens) {
  return tokens.filter((tok) => tok !== TOKEN_END).join(' ').replace(/ ([.,?:])/g, '$1');
}
function safeStorageGet(key) { try { return window.localStorage.getItem(key); } catch (err) { return null; } }
function safeStorageSet(key, value) { try { window.localStorage.setItem(key, value); return true; } catch (err) { return false; } }
function announce(text) { App.live.count += 1; setText(refs.live, text); }
function stageIndex(key) { return STAGE_ORDER.indexOf(key); }
function stageName(key) { return t(STAGE_NAME_KEYS[key]); }
function nowMs() { return performance.now(); }

// ─── Helpers: state ───
function newStage(key) {
  return { key, status: 'locked', step: 0, stepsTotal: TRAIN[key].steps, lossInitial: null, loss: null, valLossInitial: null, valLoss: null,
    params: null, hash: '', startHash: '', longest: 0, history: [], log: [], top: [], metrics: null, note: '', error: '', phase: '', labeller: '' };
}
function newExperiment() { return { status: 'idle', result: null }; }
function cfgFor(key) { return Object.assign({}, TRAIN[key], App.loop.cfgOverride ? App.loop.cfgOverride[key] : null); }
function isBusy() { return !!App.loop.gen; }
function checkpointParams(key) {
  if (key === 'random') return App.randomParams;
  const stage = App.stages[key];
  return stage && stage.status === 'done' ? stage.params : null;
}
function readyHash(key) {
  if (key === 'pretrain') return weightsHash(App.randomParams);
  return weightsHash(App.stages[STAGE_ORDER[stageIndex(key) - 1]].params);
}

function initEngine(seed) {
  App.seed = seed;
  App.readerRng = makeRng(hashSeed(seed, 'reader'));
  App.randomParams = initParams(App.shape, seed);
  STAGE_ORDER.forEach((key) => { App.stages[key] = newStage(key); App.stages[key].stepsTotal = cfgFor(key).steps; });
  Object.keys(App.experiments).forEach((key) => { App.experiments[key] = newExperiment(); });
  App.rl.own = []; App.rl.equalCount = 0; App.rl.ownPair = null; App.rl.ownReward = null; App.rl.reward = null; App.rl.simPairs = 0; App.rl.mainLabeller = ''; App.rl.lastPairs = null;
  App.sampleRng = makeRng(hashSeed(seed, 'samples'));
  const pre = App.stages.pretrain;
  pre.status = 'ready';
  pre.hash = weightsHash(App.randomParams);
  computePretrainInitialLoss(pre);
}

function computePretrainInitialLoss(stage) {
  const work = makeWork(App.shape);
  const ids = App.data.corpusIds;
  const sets = exampleSets(App.data);
  const lossOf = (set) => {
    const count = Math.min(400, set.length);
    return datasetLoss(App.randomParams, App.shape, work, count, (i) => {
      const at = set[Math.floor(i * set.length / count)];
      fillWindow(work, ids, at, App.data.vocab.nl);
      return ids[at];
    });
  };
  stage.lossInitial = lossOf(sets.corpusTrain); stage.loss = stage.lossInitial;
  stage.valLossInitial = lossOf(sets.corpusVal); stage.valLoss = stage.valLossInitial;
}

// ─── Helpers: prompts ───
function parsePrompt(text) {
  let value = String(text === undefined || text === null ? '' : text);
  let trimmed = false;
  if (value.length > MAX_PROMPT_CHARS) { value = value.slice(0, MAX_PROMPT_CHARS); trimmed = true; }
  const empty = value.trim().length === 0;
  const { raw, ids } = tokenize(value, App.data.vocab);
  const unknown = ids.filter((id) => id === App.data.vocab.unk).length;
  return { value, trimmed, empty: empty || raw.length === 0, raw, ids, unknown, allUnknown: ids.length > 0 && unknown === ids.length, expect: expectationForText(value) };
}
function idsToTokens(ids) { return ids.map((id) => App.data.vocab.list[id]); }

// ─── Helpers: training loop ───
function schedulePump() {
  if (App.loop.scheduled) return;
  App.loop.scheduled = true;
  App.loop.channel.port2.postMessage(0);
}

function pump() {
  App.loop.scheduled = false;
  const loop = App.loop;
  if (!loop.gen || loop.paused) return;
  const started = nowMs();
  const budget = loop.sliceMs || SLICE_MS;
  try {
    while (nowMs() - started < budget) {
      const res = loop.gen.next();
      if (res.done) { finishLoop(res.value); break; }
    }
  } catch (err) {
    failLoop(err);
    return;
  }
  const elapsed = nowMs() - started;
  loop.activeMs += elapsed;
  if (loop.kind === 'stage' && App.stages[loop.key]) {
    syncStageFromCtx();
    if (elapsed > App.stages[loop.key].longest) App.stages[loop.key].longest = elapsed;
    checkHalfway();
  }
  if (nowMs() - loop.lastRender > 150) { loop.lastRender = nowMs(); renderTraining(); }
  if (loop.gen) schedulePump();
}

function syncStageFromCtx() {
  const ctx = App.loop.ctx;
  const stage = App.stages[App.loop.key];
  if (!ctx) return;
  stage.step = ctx.step || 0;
  if (Number.isFinite(ctx.loss)) stage.loss = ctx.loss;
  if (Number.isFinite(ctx.valLoss)) stage.valLoss = ctx.valLoss;
  if (Number.isFinite(ctx.lossInitial)) stage.lossInitial = ctx.lossInitial;
  if (Number.isFinite(ctx.valLossInitial)) stage.valLossInitial = ctx.valLossInitial;
}

function checkHalfway() {
  const loop = App.loop;
  const stage = App.stages[loop.key];
  if (!loop.half && stage.stepsTotal && stage.step / stage.stepsTotal >= 0.5) {
    loop.half = true;
    announce(t('liveTrainingHalf', { name: stageName(loop.key) }));
  }
}

function clearLoop() {
  const loop = App.loop;
  loop.gen = null; loop.ctx = null; loop.kind = null; loop.key = null; loop.paused = false; loop.half = false; loop.activeMs = 0; loop.onDone = null; loop.lrOverride = null;
}

function finishLoop(value) {
  const onDone = App.loop.onDone;
  const kind = App.loop.kind;
  const key = App.loop.key;
  clearLoop();
  if (onDone) onDone(value);
  renderAll();
  if (kind === 'stage' && App.pipeline) advancePipeline();
  else if (App.pipeline && kind !== 'stage') App.pipeline = false;
  return key;
}

function failLoop(err) {
  const kind = App.loop.kind;
  const key = App.loop.key;
  clearLoop();
  App.pipeline = false;
  if (kind === 'stage') {
    const stage = App.stages[key];
    stage.status = 'error';
    stage.params = null;
    stage.error = t('errorNonFinite');
    stage.hash = '';
    announce(t('liveError', { name: stageName(key) }));
  } else {
    App.experiments[key].status = 'error';
    App.experiments[key].result = { error: String(err && err.message) };
  }
  renderAll();
}

function startLoop(kind, key, gen, onDone, ctxSetter) {
  const loop = App.loop;
  loop.gen = gen; loop.kind = kind; loop.key = key; loop.paused = false; loop.half = false; loop.activeMs = 0; loop.onDone = onDone; loop.lastRender = 0;
  loop.startCount += 1;
  if (ctxSetter) ctxSetter();
  schedulePump();
}

// ─── Helpers: stage control ───
function logSample(stage, step, contextTokens) {
  const rng = makeRng(hashSeed(App.seed, 'log' + stage.key + step));
  const vocab = App.data.vocab;
  const ids = contextTokens.map((tok) => vocab.index.get(tok));
  const out = sampleTokens(stage.params, App.shape, makeWork(App.shape), ids, rng, METRIC_TEMPERATURE, vocab.nl, vocab.end, 14);
  stage.log.push({ step, text: prettyTokens(idsToTokens(out)) });
}

function logTop(stage, step) {
  const vocab = App.data.vocab;
  const ids = ['Stolicą', 'Francji', 'jest'].map((tok) => vocab.index.get(tok));
  const work = makeWork(App.shape);
  fillWindow(work, ids, ids.length, vocab.nl);
  forwardWindow(stage.params, App.shape, work);
  softmaxInto(work.logits, work.probs, 1);
  const order = Array.from(work.probs.keys()).sort((a, b) => work.probs[b] - work.probs[a]).slice(0, 3);
  stage.top.push({ step, items: order.map((id) => `${vocab.list[id]} ${Math.round(work.probs[id] * 100)}%`).join(', ') });
}

function makeReport(stage, contextTokens, withTop) {
  const marks = [0, 0.02, 0.05, 0.1, 0.25, 0.5, 0.75, 1];
  let nextMark = 0;
  return (step) => {
    const ctx = App.loop.ctx;
    if (ctx) stage.history.push({ step, loss: ctx.loss, val: ctx.valLoss, reward: ctx.meanReward, preferred: ctx.preferred });
    let reached = false;
    while (nextMark < marks.length && step >= marks[nextMark] * stage.stepsTotal) { reached = true; nextMark++; }
    if (reached) {
      logSample(stage, step, contextTokens);
      if (withTop) logTop(stage, step);
    }
  };
}

function startStage(key) {
  const stage = App.stages[key];
  if (isBusy() || stage.status !== 'ready') return false;
  const cfg = cfgFor(key);
  stage.stepsTotal = cfg.steps;
  stage.step = 0; stage.history = []; stage.log = []; stage.top = []; stage.note = ''; stage.error = ''; stage.metrics = null; stage.longest = 0; stage.phase = 'training';
  const source = key === 'pretrain' ? App.randomParams : App.stages[STAGE_ORDER[stageIndex(key) - 1]].params;
  stage.params = source.slice();
  stage.startHash = weightsHash(stage.params);
  stage.hash = stage.startHash;
  stage.status = 'training';
  const env = { seed: App.seed, params: stage.params, shape: App.shape, data: App.data, cfg };
  env.onCtx = (ctx) => { App.loop.ctx = ctx; };
  env.onPhase = (phase) => { stage.phase = phase; renderStage(key); };
  const promptTokens = idsToTokens(tokenize('Jaka jest stolica Francji?', App.data.vocab).ids).concat([TOKEN_NL]);
  let gen;
  if (key === 'pretrain') {
    env.report = makeReport(stage, ['Kot'], true);
    env.lrOverride = App.loop.lrOverride;
    gen = flowPretrain(env);
  } else if (key === 'sft') {
    env.report = makeReport(stage, promptTokens, false);
    gen = flowSft(env);
  } else {
    env.report = makeReport(stage, promptTokens, false);
    env.sftParams = App.stages.sft.params;
    const source2 = App.rl.source;
    stage.labeller = source2;
    App.rl.mainLabeller = source2;
    if (source2 === 'wlasne') env.pairs = App.rl.own.map((pair) => pair);
    else env.labeller = source2;
    gen = flowRl(env);
  }
  const lrOverride = App.loop.lrOverride;
  startLoop('stage', key, gen, (ctx) => onStageDone(key, ctx));
  App.loop.lrOverride = lrOverride;
  announce(t('liveTrainingStart', { name: stageName(key) }));
  renderAll();
  return true;
}

function onStageDone(key, ctx) {
  const stage = App.stages[key];
  stage.status = 'done';
  stage.phase = '';
  stage.step = ctx.step || stage.stepsTotal;
  stage.metrics = ctx.metrics;
  if (Number.isFinite(ctx.loss)) stage.loss = ctx.loss;
  if (Number.isFinite(ctx.valLoss)) stage.valLoss = ctx.valLoss;
  stage.hash = weightsHash(stage.params);
  if (key === 'rl') {
    App.rl.reward = ctx.reward;
    App.rl.lastPairs = ctx.pairs;
    if (App.rl.source !== 'wlasne') App.rl.simPairs = ctx.pairs.length;
  }
  const next = STAGE_ORDER[stageIndex(key) + 1];
  if (next) {
    App.stages[next].status = 'ready';
    App.stages[next].note = '';
    App.stages[next].hash = stage.hash;
    if (next === 'rl') newOwnPair();
  }
  refreshBench();
  refreshPairSample();
  announce(t('liveTrainingDone', { name: stageName(key) }));
}

function togglePause() {
  const loop = App.loop;
  if (!loop.gen) return;
  loop.paused = !loop.paused;
  if (loop.kind === 'stage') {
    App.stages[loop.key].status = loop.paused ? 'paused' : 'training';
    if (loop.paused) announce(t('livePaused', { name: stageName(loop.key) }));
  }
  if (!loop.paused) schedulePump();
  renderAll();
}

function trainToggle(key) {
  const stage = App.stages[key];
  const time = nowMs();
  if (time - App.loop.lastToggle < 400) return;
  App.loop.lastToggle = time;
  if (stage.status === 'training' || stage.status === 'paused') { if (App.loop.key === key) togglePause(); return; }
  if (stage.status === 'done' || stage.status === 'error') { if (isBusy()) return; resetStage(key); startStage(key); return; }
  if (stage.status === 'ready') startStage(key);
}

function cancelLoopIfAffected(key) {
  const loop = App.loop;
  if (!loop.gen) return;
  if (loop.kind === 'experiment') { App.experiments[loop.key] = newExperiment(); clearLoop(); App.pipeline = false; return; }
  if (stageIndex(loop.key) >= stageIndex(key)) { clearLoop(); App.pipeline = false; }
}

function resetStage(key) {
  const idx = stageIndex(key);
  const stage = App.stages[key];
  if (stage.status === 'locked') return;
  cancelLoopIfAffected(key);
  const prevDone = idx === 0 || App.stages[STAGE_ORDER[idx - 1]].status === 'done';
  const fresh = newStage(key);
  fresh.stepsTotal = cfgFor(key).steps;
  fresh.status = prevDone ? 'ready' : 'locked';
  App.stages[key] = fresh;
  if (prevDone) fresh.hash = readyHash(key);
  if (key === 'pretrain') computePretrainInitialLoss(fresh);
  for (let i = idx + 1; i < STAGE_ORDER.length; i++) {
    const later = App.stages[STAGE_ORDER[i]];
    const hadWork = later.status !== 'locked';
    const dropped = newStage(STAGE_ORDER[i]);
    dropped.stepsTotal = cfgFor(STAGE_ORDER[i]).steps;
    dropped.note = hadWork ? t('resetNote') : '';
    App.stages[STAGE_ORDER[i]] = dropped;
  }
  const experimentsFrom = { pretrain: ['corpus', 'demos', 'labeller'], sft: ['demos', 'labeller'], rl: ['labeller'] };
  experimentsFrom[key].forEach((exp) => { App.experiments[exp] = newExperiment(); });
  if (idx <= 1) { App.rl.own = []; App.rl.equalCount = 0; App.rl.ownPair = null; App.rl.ownReward = null; }
  if (idx <= 2) { App.rl.reward = null; App.rl.simPairs = 0; App.rl.mainLabeller = ''; App.rl.lastPairs = null; }
  ensureCheckpoint();
  refreshBench();
  refreshPairSample();
  renderAll();
}

function advancePipeline() {
  if (isBusy() && !App.loop.paused) return;
  if (isBusy() && App.loop.paused) { togglePause(); return; }
  App.rl.source = 'rzeczowy';
  const next = STAGE_ORDER.find((key) => App.stages[key].status !== 'done');
  if (!next) { App.pipeline = false; renderAll(); return; }
  const stage = App.stages[next];
  if (stage.status === 'error') { resetStage(next); }
  App.pipeline = true;
  if (!startStage(next)) App.pipeline = false;
}

function startPipeline() {
  if (isBusy() && !App.loop.paused) return;
  App.pipeline = true;
  advancePipeline();
}

function changeSeed(value) {
  const seed = Number(value);
  if (isBusy()) return;
  if (!Number.isInteger(seed) || seed < 1 || seed > 9999) { App.seedError = t('seedBad'); renderChrome(); return; }
  App.seedError = '';
  if (seed === App.seed) { renderChrome(); return; }
  initEngine(seed);
  App.next.checkpoint = 'random';
  App.next.appended = [];
  App.bench.columns = {};
  refreshSamples();
  renderAll();
  announce(t('seedChanged', { seed }));
}

// ─── Helpers: experiments ───
function startExperiment(key) {
  if (isBusy()) return;
  const stageKey = { corpus: 'pretrain', demos: 'sft', labeller: 'rl' }[key];
  if (App.stages[stageKey].status !== 'done') return;
  const exp = App.experiments[key];
  exp.status = 'running'; exp.result = null;
  const data = App.data;
  const env = { seed: App.seed, shape: App.shape, data, cfg: cfgFor(stageKey) };
  env.onCtx = (ctx) => { App.loop.ctx = ctx; };
  let gen;
  if (key === 'corpus') {
    env.params = App.randomParams.slice();
    env.cfg = Object.assign({}, env.cfg, { steps: App.loop.cfgOverride ? env.cfg.steps : TRAIN.corpusExperimentSteps });
    env.corpusIds = shuffledCorpus(data, App.seed); env.stream = 'batch-shuffled'; env.label = 'exp-corpus';
    gen = flowPretrain(env);
  } else if (key === 'demos') {
    env.params = App.stages.pretrain.params.slice();
    env.seqs = shuffledDemoSeqs(data, App.seed); env.stream = 'sft-shuffled'; env.label = 'exp-demos';
    gen = flowSft(env);
  } else {
    env.params = App.stages.sft.params.slice();
    env.sftParams = App.stages.sft.params;

// ─── Helpers: labeller ───
function rewardReady() {
  if (App.rl.source !== 'wlasne') return true;
  return App.rl.own.length >= OWN_PAIRS_MIN;
}

function newOwnPair() {
  const sft = App.stages.sft;
  App.rl.ownPair = null;
  if (sft.status !== 'done') return;
  const data = App.data;
  const vocab = data.vocab;
  const work = makeWork(App.shape);
  for (let tries = 0; tries < 60; tries++) {
    const idx = Math.floor(App.readerRng() * data.rlPromptIds.length);
    const ctx = data.rlPromptIds[idx];
    const a = sampleTokens(sft.params, App.shape, work, ctx, App.readerRng, 1, vocab.nl, vocab.end, MAX_GEN_TOKENS);
    const b = sampleTokens(sft.params, App.shape, work, ctx, App.readerRng, 1, vocab.nl, vocab.end, MAX_GEN_TOKENS);
    if (a.join() !== b.join()) { App.rl.ownPair = { prompt: data.rlPrompts[idx], a: idsToTokens(a), b: idsToTokens(b) }; return; }
  }
}

function labelOwn(choice) {
  const pair = App.rl.ownPair;
  if (!pair) return;
  if (choice === 'equal') App.rl.equalCount += 1;
  else {
    const win = choice === 'a' ? pair.a : pair.b;
    const lose = choice === 'a' ? pair.b : pair.a;
    App.rl.own.push({ prompt: pair.prompt, win: rewardFeatures(win), lose: rewardFeatures(lose), winTokens: win, loseTokens: lose });
    if (App.rl.own.length >= OWN_PAIRS_MIN) fitOwnReward();
  }
  newOwnPair();
  renderRl();
}

function fitOwnReward() {
  const rng = makeRng(hashSeed(App.seed, 'own-reward'));
  const model = { weights: new Map(), lengthWeight: 0 };
  for (let e = 0; e < TRAIN.rl.rewardEpochs; e++) {
    fitRewardStep(model, App.rl.own, rng, TRAIN.rl.rewardLr);
    model.weights.forEach((w, tok) => model.weights.set(tok, w * TRAIN.rl.rewardDecay));
  }
  App.rl.ownReward = model;
}

function currentRewardModel() {
  if (App.rl.source === 'wlasne') return App.rl.ownReward;
  return App.rl.reward && App.rl.mainLabeller === App.rl.source ? App.rl.reward : null;
}

function setSource(source) {
  if (isBusy()) return;
  App.rl.source = source;
  if (source === 'wlasne' && !App.rl.ownPair) newOwnPair();
  renderRl();
}

// ─── Helpers: next-token lab ───
function ensureCheckpoint() {
  const next = App.next;
  if (next.checkpoint !== 'random' && !checkpointParams(next.checkpoint)) {
    const fallback = STAGE_ORDER.slice().reverse().find((key) => checkpointParams(key)) || 'random';
    next.checkpoint = fallback;
    next.movedNote = t('ckMoved', { name: t(fallback === 'random' ? 'ckRandom' : { pretrain: 'ckPretrain', sft: 'ckSft', rl: 'ckRl' }[fallback]) });
  }
}

function nextContextIds() {
  const parsed = parsePrompt(App.next.text);
  return { parsed, ids: parsed.ids.concat(App.next.appended) };
}

function computeNext() {
  const { parsed, ids } = nextContextIds();
  if (parsed.empty) return { parsed, ids, probs: null };
  const params = checkpointParams(App.next.checkpoint);
  const work = App.next.work;
  fillWindow(work, ids, ids.length, App.data.vocab.nl);
  forwardWindow(params, App.shape, work);
  softmaxInto(work.logits, work.probs, App.next.temperature);
  return { parsed, ids, probs: work.probs };
}

function sampleNextToken(forcedId) {
  const { parsed, ids, probs } = computeNext();
  if (parsed.empty || !probs) { renderNext(); return; }
  const id = forcedId === undefined ? sampleFrom(probs, App.readerRng) : forcedId;
  App.next.appended.push(id);
  App.next.sampled = App.data.vocab.list[id];
  if (ids.length > 200) App.next.appended = App.next.appended.slice(-100);
  renderNext();
}

// ─── Helpers: neighbours ───
function nearestNeighbours(token, params) {
  const vocab = App.data.vocab;
  const id = vocab.index.get(token);
  if (id === undefined) return [];
  const dim = EMBED_DIM;
  const base = App.shape.embed + id * dim;
  let normA = 0;
  for (let d = 0; d < dim; d++) normA += params[base + d] * params[base + d];
  const scored = [];
  for (let i = 0; i < vocab.list.length; i++) {
    if (i === id || i === vocab.nl || i === vocab.end || i === vocab.unk) continue;
    // Tokens seen only in SFT data get no pretraining updates, so their vectors would be noise here.
    if (!App.data.rawTokens.has(vocab.list[i])) continue;
    const off = App.shape.embed + i * dim;
    let dot = 0; let normB = 0;
    for (let d = 0; d < dim; d++) { dot += params[base + d] * params[off + d]; normB += params[off + d] * params[off + d]; }
    scored.push({ token: vocab.list[i], score: dot / Math.sqrt(normA * normB + 1e-12) });
  }
  return scored.sort((a, b) => b.score - a.score).slice(0, 5);
}

// ─── Helpers: word budget ───
function countWords(text) { return text.split(/\s+/).filter((w) => /\p{L}/u.test(w)).length; }

function budgetText(root) {
  const parts = [];
  const walk = (node) => {
    if (node.nodeType === 3) { parts.push(node.nodeValue); return; }
    if (node.nodeType !== 1) return;
    if (node.hasAttribute('data-nobudget')) return;
    if (node.tagName === 'SCRIPT' || node.tagName === 'STYLE' || node.tagName === 'CANVAS') return;
    if (node.tagName === 'DETAILS') { const sum = node.querySelector(':scope > summary'); if (sum) walk(sum); return; }
    node.childNodes.forEach(walk);
    if (/^(P|LI|TD|TH|DIV|H1|H2|H3|H4)$/.test(node.tagName)) parts.push(' ');
  };
  walk(root);
  return parts.join(' ');
}

function viewWordStats(panel) {
  const stats = { words: countWords(budgetText(panel)), maxBlock: 0, maxMini: 0, overBlock: [] };
  qsa('p, li, td, th, .tile, .callout', panel).forEach((block) => {
    if (block.closest('[data-nobudget]') || block.closest('details.more')) return;
    if (block.closest('.mini')) return;
    const count = countWords(budgetText(block));
    if (count > stats.maxBlock) stats.maxBlock = count;
    if (count > 20) stats.overBlock.push(block.textContent.slice(0, 40));
  });
  qsa('.mini', panel).forEach((mini) => {
    if (mini.closest('[data-nobudget]')) return;
    const count = countWords(budgetText(mini));
    if (count > stats.maxMini) stats.maxMini = count;
  });
  return stats;
}

// ─── Helpers: probes ───
function waitFor(cond, timeoutMs) {
  return new Promise((resolve, reject) => {
    const started = nowMs();
    const tick = () => {
      if (cond()) { resolve(true); return; }
      if (nowMs() - started > timeoutMs) { reject(new Error('timeout')); return; }
      setTimeout(tick, 10);
    };
    tick();
  });
}

function probeReset() {
  if (App.loop.gen) clearLoop();
  App.pipeline = false;
  App.loop.cfgOverride = null;
  App.loop.lrOverride = null;
  App.next.text = App.next.defaultText;
  App.next.appended = [];
  App.next.checkpoint = 'random';

  App.next.movedNote = '';
  App.bench.text = App.bench.defaultText;
  App.bench.freeMode = false;
  App.neighbours.checkpoint = 'auto';
  App.rl.source = 'rzeczowy';
  Object.values(App.steps).forEach(stopAutoplay);
  initEngine(App.seed);
  refreshBench();
  refreshSamples();
  renderAll();
}

    const live = read('pairs').el.dataset.source === 'live';
    const liveOk = read('pairs').items.length > 0 && read('pairs').items.every((it) => data.rlPrompts.includes(it.prompt));
    await runShortStages(['rl'], longer);
    const run = read('pairs').el.dataset.source === 'run' && read('pairs').total === App.rl.lastPairs.length;
    probeReset();
    return { ok: corpusOk && demosOk && rerolled && pairsNone && live && liveOk && run, value: `korpus:${corpusOk} SFT:${demosOk} losuj:${rerolled} pary brak:${pairsNone} na żywo:${live}/${liveOk} z treningu:${run}` };
  });
  add('step-pretrain', async () => {
    probeReset();
    const key = 'pretrain';
    const el = qs(`[data-step-view="${key}"]`);
    renderStepView(key);
    const mainBefore = App.stages.pretrain.hash;
    const ready = el.dataset.state === 'ready' && el.dataset.source === 'random';
    const branch0 = el.dataset.branchHash;
    const sameAsMain = branch0 === weightsHash(App.randomParams);
    const movedEarly = [];
    for (let i = 0; i < 3; i++) { stepForward(key); movedEarly.push(el.dataset.branchHash === branch0); }
    const stillBeforeUpdate = el.dataset.phase === 'loss' && el.dataset.branchHash === branch0;
    const vals = JSON.parse(el.dataset.values);
    const lossOk = Math.abs(vals.lossBefore + Math.log(vals.pBefore)) < 1e-6;
    const work = makeWork(App.shape);
    const ids = vals.context.map((tok) => App.data.vocab.index.get(tok));
    work.window.set(ids);
    forwardWindow(App.randomParams, App.shape, work);
    softmaxInto(work.logits, work.probs, 1);
    const recomputed = Math.abs(work.probs[App.data.vocab.index.get(vals.target)] - vals.pBefore) < 1e-9;
    stepForward(key);
    const movedAtUpdate = el.dataset.phase === 'update' && el.dataset.branchHash !== branch0 && el.dataset.updates === '1';
    stepForward(key);
    const after = JSON.parse(el.dataset.values);
    const rises = after.pAfter > after.pBefore;
    stepBackward(key); stepForward(key);
    const noSecond = el.dataset.updates === '1';
    const mainSame = App.stages.pretrain.hash === mainBefore && el.dataset.mainHash === mainBefore;
    probeReset();
    const ok = ready && sameAsMain && movedEarly.every(Boolean) && stillBeforeUpdate && lossOk && recomputed && movedAtUpdate && rises && noSecond && mainSame;
    return { ok, value: `gotowy:${ready} strata:${lossOk} przeliczone:${recomputed} aktualizacja:${movedAtUpdate} p ${after.pBefore.toFixed(4)} -> ${after.pAfter.toFixed(4)} bez drugiej:${noSecond} główny:${mainSame}` };
  });
  add('step-sft', async () => {
    probeReset();
    const key = 'sft';
    const el = qs(`[data-step-view="${key}"]`);
    renderStepView(key);
    const needs = el.dataset.state === 'needs' && qs('#step-next-sft').disabled;
    await runShortStages(['pretrain']);
    renderStepView(key);
    const main = App.stages.pretrain.hash;
    const ready = el.dataset.state === 'ready' && el.dataset.source === 'pretrain';
    const first = JSON.parse(el.dataset.values);
    const demo = App.data.demos[first.demoIndex];
    const real = demo.prompt === first.prompt && splitTokens(demo.response).concat([TOKEN_END])[first.responseIndex] === first.target;
    for (let i = 0; i < 5; i++) stepForward(key);
    const vals = JSON.parse(el.dataset.values);
    const rises = vals.pAfter > vals.pBefore;
    const mainSame = App.stages.pretrain.hash === main;
    probeReset();
    return { ok: needs && ready && real && rises && mainSame, value: `wymaga:${needs} gotowy:${ready} przykład:${real} p ${vals.pBefore.toFixed(4)} -> ${vals.pAfter.toFixed(4)} główny:${mainSame}` };
  });
  add('step-rl', async () => {
    probeReset();
    const key = 'rl';
    const el = qs(`[data-step-view="${key}"]`);
    renderStepView(key);
    const needs = el.dataset.state === 'needs' && qs('#step-next-rl').disabled;
    await runShortStages(['pretrain', 'sft']);
    renderStepView(key);
    await waitFor(() => { renderStepView(key); return el.dataset.state === 'ready' && el.dataset.values !== 'null'; }, 30000);
    const main = App.stages.sft.hash;
    const first = JSON.parse(el.dataset.values);
    const different = first.a.tokens.join(' ') !== first.b.tokens.join(' ');
    const heldOut = App.data.evalPrompts.filter((p) => p.heldOut).map((p) => tokenizeRaw(p.text).join(' '));
    const promptOk = App.data.rlPrompts.includes(first.prompt) && !heldOut.includes(first.prompt);
    const pref = first.preferred;
    const prefHigher = first[pref].reward >= first[pref === 'a' ? 'b' : 'a'].reward;
    for (let i = 0; i < 3; i++) stepForward(key);
    const vals = JSON.parse(el.dataset.values);
    const rises = vals[pref].logPAfter > vals[pref].logPBefore;
    const mainSame = App.stages.sft.hash === main;
    probeReset();
    return { ok: needs && different && promptOk && prefHigher && rises && mainSame, value: `wymaga:${needs} różne:${different} prompt:${promptOk} wyższa:${prefHigher} logP ${vals[pref].logPBefore.toFixed(3)} -> ${vals[pref].logPAfter.toFixed(3)} główny:${mainSame}` };
  });
  add('step-keyboard', async () => {
    probeReset();
    const startView = App.view;
    setView('krok-pretraining');
    const el = qs('[data-step-view="pretrain"]');
    const press = (key) => document.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true }));
    press('n');
    const next = el.dataset.phaseIndex === '1';
    press('b');
    const back = el.dataset.phaseIndex === '0';
    press('a');
    const on = el.dataset.autoplay === 'true';
    press('a');
    const off = el.dataset.autoplay === 'false';
    press('a');
    const running = el.dataset.autoplay === 'true';
    setView(startView);
    const stopped = el.dataset.autoplay === 'false' && !App.steps.pretrain.timer;
    probeReset();
    return { ok: next && back && on && off && running && stopped, value: `N:${next} B:${back} A:${on}/${off} po wyjściu:${stopped}` };
  });
  add('dom-contract', () => {
    const problems = [];
    const app = refs.app;
    const need = (el, name, expected) => {
      if (!el) { problems.push(`brak elementu dla ${name}`); return; }
      if (!el.hasAttribute(name)) { problems.push(`brak ${name}`); return; }
      if (expected !== undefined && el.getAttribute(name) !== String(expected)) problems.push(`${name}=${el.getAttribute(name)} zamiast ${expected}`);
    };
    need(app, 'data-view', App.view);
    need(app, 'data-seed', App.seed);
    need(app, 'data-active-training', activeTrainingName());
    need(app, 'data-vocab-size', App.data.vocab.list.length);
    need(app, 'data-params', App.shape.total);
    STAGE_ORDER.forEach((key) => {
      const el = qs(`[data-stage="${key}"]`);
      const stage = App.stages[key];
      need(el, 'data-status', stage.status);
      need(el, 'data-steps-total', stage.stepsTotal);
      ['data-step', 'data-loss-initial', 'data-loss', 'data-val-loss-initial', 'data-val-loss', 'data-weights-hash', 'data-longest-task-ms'].forEach((name) => need(el, name));
      if (!isBusy()) { need(el, 'data-step', stage.step); need(el, 'data-weights-hash', stage.hash); }
      const col = qs(`[data-bench-column="${key}"]`);
      need(col, 'data-state', benchColumnState(key));

    });
    const select = qs('#cmp-select');
    const shown = App.bench.freeMode ? App.bench.text : select.options[select.selectedIndex].textContent;
    if (shown !== App.bench.text) problems.push(`lista pokazuje „${shown}”, a porównanie używa „${App.bench.text}”`);
    const metrics = qs('[data-metrics]');
    need(metrics, 'data-json');
    if (metrics) { try { JSON.parse(metrics.getAttribute('data-json')); } catch (err) { problems.push('data-json nie jest JSON-em'); } }
    const nextEl = qs('[data-next-token]');
    need(nextEl, 'data-checkpoint', App.next.checkpoint);
    need(nextEl, 'data-temperature', App.next.temperature);
    ['data-context', 'data-top'].forEach((name) => need(nextEl, name));
    const rl = qs('[data-rl]');
    need(rl, 'data-labeller', App.rl.source);
    need(rl, 'data-reward-ready', rewardReady());
    need(rl, 'data-pairs-labelled');
    ['corpus', 'demos', 'labeller'].forEach((key) => {
      const el = qs(`[data-experiment="${key}"]`);
      need(el, 'data-status', App.experiments[key].status);
      need(el, 'data-json');
    });
    qsa('[data-view-panel]').forEach((panel) => need(panel, 'data-words'));
    qsa('[data-train-notice]').forEach((notice) => { need(notice, 'data-needs'); need(notice, 'data-state'); });
    if (qsa('[data-train-notice]').length !== Object.keys(NOTICE_STAGES).length) problems.push('zła liczba komunikatów o treningu');
    ['corpus', 'demos', 'pairs'].forEach((kind) => {
      const el = qs(`[data-data-sample="${kind}"]`);
      ['data-total', 'data-shown', 'data-items'].forEach((name) => need(el, name));
    });
    STAGE_ORDER.forEach((key) => {
      const el = qs(`[data-step-view="${key}"]`);
      need(el, 'data-state', App.steps[key].state);
      need(el, 'data-autoplay', App.steps[key].autoplay);
